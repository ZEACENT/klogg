name: "Setup agent"
description: Install the pinned CMake, Ninja, Qt, Boost, and CPM build dependencies
inputs:
  qt-version:
    description: Qt version to install
    required: true
  qt-arch:
    description: Qt architecture to install
    required: true
  qt-modules:
    description: Additional Qt modules to install
    required: false
    default: ""
  qt-archives:
    description: Qt archives to install
    required: false
    default: qtbase icu
runs:
  using: "composite"
  steps:
    - name: Validate setup inputs
      shell: bash
      env:
        KLOGG_INPUT_QT_VERSION: ${{ inputs.qt-version }}
        KLOGG_INPUT_QT_ARCH: ${{ inputs.qt-arch }}
      run: |
        test -n "$KLOGG_INPUT_QT_VERSION" || { echo "::error::qt-version is required"; exit 1; }
        test -n "$KLOGG_INPUT_QT_ARCH" || { echo "::error::qt-arch is required"; exit 1; }

    - name: Install CMake and Ninja
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        cmakeVersion: 3.31.6
        ninjaVersion: 1.12.1

    - name: Install Qt
      uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
      with:
        version: ${{ inputs.qt-version }}
        arch: ${{ inputs.qt-arch }}
        cache: true
        modules: ${{ inputs.qt-modules }}
        archives: ${{ inputs.qt-archives || 'qtbase icu' }}

    - name: Set Boost root
      shell: bash
      run: echo "BOOST_ROOT=$GITHUB_WORKSPACE/3rdparty/boost" >> "$GITHUB_ENV"

    - name: Restore Boost source archive
      if: ${{ env.KLOGG_REQUIRE_PREFETCHED_BOOST != 'ON' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/prefetch_artifacts/boost_1_86_0.tar.bz2
        key: boost-source-${{ hashFiles('ci/environments/materials.json') }}

    - name: Restore CPM cache
      if: ${{ env.KLOGG_REQUIRE_PREFETCHED_CPM != 'ON' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/cpm_cache
        key: CPM-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake', '3rdparty/patches/**', 'cmake/prefetch_cpm/CMakeLists.txt') }}${{ env.KLOGG_CPM_CACHE_KEY_SUFFIX }}

    - name: Populate CPM source cache
      if: ${{ env.KLOGG_REQUIRE_PREFETCHED_CPM != 'ON' }}
      uses: ./.github/actions/prefetch-cpm-cache
      env:
        KLOGG_WORKSPACE: ${{ github.workspace }}

    - name: Install Boost
      shell: bash
      run: |
        set -euo pipefail
        args=()
        if [ "${KLOGG_REQUIRE_PREFETCHED_BOOST:-OFF}" = "ON" ]; then
          args+=(--require-prefetched)
        fi
        python3 scripts/materialize_boost.py \
          --archive "$GITHUB_WORKSPACE/prefetch_artifacts/boost_1_86_0.tar.bz2" \
          --destination "$BOOST_ROOT" "${args[@]}"
