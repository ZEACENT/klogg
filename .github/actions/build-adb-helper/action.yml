name: Build locked source ADB helper
description: Build the complete ADB client/server from the prefetched immutable source closure
inputs:
  target:
    description: Locked target from adb-helper.lock.json
    required: true
  source-root:
    description: Extracted and verified source closure
    required: true
  package-core-root:
    description: Version-independent package-required legal core without a source archive or overlay
    required: true
  package-support-root:
    description: Fresh output for package legal assets and the current source-offer overlay
    required: true
  version:
    description: Current application release version from the original legal producer
    required: true
  artifact-root:
    description: Output directory for the helper closure and receipt
    required: true
  object-cache-enabled:
    description: Opt in to ordinary macOS compiler objects, never native core qualification or bundle reuse
    required: false
    default: "false"
  container-image:
    description: Digest-bound Linux helper toolchain image; empty for native macOS and Windows builds
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Verify locked native ADB build toolchain
      if: ${{ !startsWith(inputs.target, 'linux-') }}
      shell: bash
      run: |
        python3 scripts/verify_adb_helper_toolchain.py \
          --lock packaging/adb/adb-helper.lock.json \
          --target "${{ inputs.target }}"

    - name: Select ordinary macOS ADB cache scope
      id: native-cache-eligibility
      if: ${{ inputs.object-cache-enabled == 'true' && startsWith(inputs.target, 'macos-') }}
      shell: bash
      env:
        KLOGG_NATIVE_CACHE_TARGET: ${{ inputs.target }}
      run: python3 scripts/ci_native_object_cache.py eligible --target "$KLOGG_NATIVE_CACHE_TARGET"

    - name: Install ordinary macOS ADB compiler cache
      if: ${{ steps.native-cache-eligibility.outputs.eligible == 'true' }}
      shell: bash
      env:
        HOMEBREW_NO_ANALYTICS: "1"
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_INSTALL_CLEANUP: "1"
      run: brew install ccache

    - name: Prepare ordinary macOS ADB compiler cache
      id: native-cache
      if: ${{ inputs.object-cache-enabled == 'true' && steps.native-cache-eligibility.outputs.eligible == 'true' }}
      shell: bash
      env:
        KLOGG_NATIVE_CACHE_TARGET: ${{ inputs.target }}
      run: python3 scripts/ci_native_object_cache.py prepare --target "$KLOGG_NATIVE_CACHE_TARGET"

    - name: Restore scoped macOS ADB compiler objects
      id: native-cache-primary
      if: ${{ steps.native-cache.outputs.enabled == 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.native-cache.outputs.path }}
        key: ${{ steps.native-cache.outputs.primary-key }}
        restore-keys: ${{ steps.native-cache.outputs.primary-prefix }}

    - name: Restore master macOS ADB objects on own-PR miss
      id: native-cache-master
      if: ${{ steps.native-cache.outputs.own-pr == 'true' && steps.native-cache-primary.outputs.cache-matched-key == '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.native-cache.outputs.path }}
        key: ${{ steps.native-cache.outputs.master-key }}
        restore-keys: ${{ steps.native-cache.outputs.master-prefix }}

    - name: Describe shared native ADB compiler objects
      id: native-cache-descriptor
      if: ${{ steps.native-cache.outputs.enabled == 'true' }}
      shell: bash
      env:
        KLOGG_NATIVE_CACHE_TARGET: ${{ inputs.target }}
        KLOGG_NATIVE_CACHE_IDENTITY: ${{ steps.native-cache.outputs.identity-file }}
      run: |
        set -euo pipefail
        python3 scripts/ci_compiler_object_descriptor.py \
          --component native --label "native-adb-$KLOGG_NATIVE_CACHE_TARGET" \
          --native-identity "$KLOGG_NATIVE_CACHE_IDENTITY" \
          --producer-job "Source-built ADB helper $KLOGG_NATIVE_CACHE_TARGET" \
          --required-step "Build and verify native ADB helper" \
          --export-step "Build and verify native ADB helper" \
          --output "$RUNNER_TEMP/native-adb-descriptor-$KLOGG_NATIVE_CACHE_TARGET.json"

    - name: Restore shared native ADB compiler objects
      id: native-cache-shared
      if: ${{ steps.native-cache-descriptor.outputs.eligible == 'true' }}
      uses: ./.github/actions/restore-compiler-object-artifact
      with:
        descriptor: ${{ steps.native-cache-descriptor.outputs.descriptor }}
        path: ${{ steps.native-cache.outputs.path }}

    - name: Start current-build native cache observation
      if: ${{ steps.native-cache.outputs.enabled == 'true' }}
      shell: bash
      env:
        KLOGG_NATIVE_CACHE_STATE: ${{ steps.native-cache.outputs.state }}
        KLOGG_NATIVE_PRIMARY_MATCH: ${{ steps.native-cache-primary.outputs.cache-matched-key }}
        KLOGG_NATIVE_MASTER_MATCH: ${{ steps.native-cache-master.outputs.cache-matched-key }}
      run: python3 scripts/ci_native_object_cache.py start --state "$KLOGG_NATIVE_CACHE_STATE"

    - name: Build Linux helper in digest-bound disconnected toolchain
      if: ${{ startsWith(inputs.target, 'linux-') }}
      shell: bash
      env:
        FETCHCONTENT_FULLY_DISCONNECTED: "ON"
        FETCHCONTENT_UPDATES_DISCONNECTED: "ON"
      run: |
        set -euo pipefail
        test -n "${{ inputs.container-image }}" || {
          echo "::error::locked Linux helper container image is required"
          exit 1
        }
        docker pull "${{ inputs.container-image }}"
        docker run --rm --network none \
          --user "$(id -u):$(id -g)" \
          --entrypoint /bin/bash \
          -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -v "$RUNNER_TEMP:$RUNNER_TEMP" \
          -w "$GITHUB_WORKSPACE" \
          -e GITHUB_WORKSPACE \
          -e RUNNER_TEMP \
          -e HOME="$RUNNER_TEMP" \
          -e FETCHCONTENT_FULLY_DISCONNECTED=ON \
          -e FETCHCONTENT_UPDATES_DISCONNECTED=ON \
          "${{ inputs.container-image }}" -lc '
            python=/opt/python/cp311-cp311/bin/python3 &&
            test -x "$python" &&
            "$python" scripts/verify_adb_helper_toolchain.py \
              --lock packaging/adb/adb-helper.lock.json \
              --target "${{ inputs.target }}" \
              --containerized \
              --container-image "${{ inputs.container-image }}" &&
            "$python" scripts/build_adb_helper.py \
              --repository-root "$GITHUB_WORKSPACE" \
              --lock "$GITHUB_WORKSPACE/packaging/adb/adb-helper.lock.json" \
              --source-root "${{ inputs.source-root }}" \
              --build-root "$RUNNER_TEMP/klogg-adb-${{ inputs.target }}" \
              --target "${{ inputs.target }}" \
              --artifact-root "${{ inputs.artifact-root }}" \
              --package-support-root "${{ inputs.package-core-root }}"
          '

    - name: Build native macOS helper from prefetched sources
      if: ${{ startsWith(inputs.target, 'macos-') }}
      shell: bash
      env:
        FETCHCONTENT_FULLY_DISCONNECTED: "ON"
        FETCHCONTENT_UPDATES_DISCONNECTED: "ON"
        CMAKE_C_COMPILER_LAUNCHER: ${{ steps.native-cache.outputs.launcher }}
        CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.native-cache.outputs.launcher }}
      run: |
        set -euo pipefail
        python3 scripts/build_adb_helper.py \
          --repository-root "$GITHUB_WORKSPACE" \
          --lock "$GITHUB_WORKSPACE/packaging/adb/adb-helper.lock.json" \
          --source-root "${{ inputs.source-root }}" \
          --build-root "$RUNNER_TEMP/klogg-adb-${{ inputs.target }}" \
          --target "${{ inputs.target }}" \
          --artifact-root "${{ inputs.artifact-root }}" \
          --package-support-root "${{ inputs.package-core-root }}"

    - name: Build native Windows helper from prefetched sources
      if: ${{ inputs.target == 'windows-x86_64' }}
      shell: msys2 {0}
      env:
        FETCHCONTENT_FULLY_DISCONNECTED: "ON"
        FETCHCONTENT_UPDATES_DISCONNECTED: "ON"
      run: |
        set -euo pipefail
        KLOGG_ADB_PATCH_EXECUTABLE="$(cygpath -w /usr/bin/patch.exe)" \
          python3 scripts/build_adb_helper.py \
          --repository-root "$GITHUB_WORKSPACE" \
          --lock "$GITHUB_WORKSPACE/packaging/adb/adb-helper.lock.json" \
          --source-root "${{ inputs.source-root }}" \
          --build-root "$RUNNER_TEMP/klogg-adb-${{ inputs.target }}" \
          --target "${{ inputs.target }}" \
          --artifact-root "${{ inputs.artifact-root }}" \
          --package-support-root "${{ inputs.package-core-root }}"

    - name: Assemble current ADB package overlay from pinned core
      shell: bash
      run: |
        set -euo pipefail
        core_root="${{ inputs.package-core-root }}"
        receipt="${{ inputs.artifact-root }}/receipt.json"
        receipt_sha256() {
          python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$1"
        }
        python3 scripts/build_adb_helper_legal_assets.py \
          --package-overlay-only \
          --lock packaging/adb/adb-helper.lock.json \
          --core-root "$core_root" \
          --build-receipt "$receipt" \
          --source-set-sha256 "$(receipt_sha256 "$core_root/adb-helper-source-set-receipt.json")" \
          --build-receipt-sha256 "$(receipt_sha256 "$receipt")" \
          --version "${{ inputs.version }}" \
          --base-url "https://github.com/${GITHUB_REPOSITORY}" \
          --output "${{ inputs.package-support-root }}"

    - name: Smoke and verify source-built ADB artifact
      shell: bash
      run: |
        set -euo pipefail
        helper_name=adb
        if [ "${{ inputs.target }}" = "windows-x86_64" ]; then helper_name=adb.exe; fi
        python3 scripts/smoke_adb_helper.py \
          --adb "${{ inputs.artifact-root }}/helpers/${helper_name}" \
          --port 0 \
          --timeout-seconds 15 \
          --json-output "${{ inputs.artifact-root }}/package-smoke.json"
        python3 scripts/verify_adb_helper_artifact.py \
          --lock packaging/adb/adb-helper.lock.json \
          --receipt "${{ inputs.artifact-root }}/receipt.json" \
          --binary-smoke-receipt "${{ inputs.artifact-root }}/package-smoke.json" \
          --package-root "${{ inputs.artifact-root }}" \
          --asset-scope package \
          --source-assets-root "${{ inputs.package-support-root }}" \
          --helper-path "helpers/${helper_name}" \
          --expected-target "${{ inputs.target }}" \
          --package-verification-receipt "${{ inputs.artifact-root }}/package-verification.json" \
          --require-lock-binding

    - name: Generate SHA256SUMS for target-bound artifact
      shell: bash
      run: |
        set -euo pipefail
        python3 - "${{ inputs.artifact-root }}" <<'PY'
        import hashlib, pathlib, sys
        root = pathlib.Path(sys.argv[1])
        files = sorted(path for path in (root / "helpers").iterdir() if path.is_file())
        files.extend(root / name for name in (
            "receipt.json", "smoke.json", "package-smoke.json", "package-verification.json"
        ))
        lines = []
        for path in files:
            digest = hashlib.sha256(path.read_bytes()).hexdigest()
            lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
        (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
        PY

    - name: Measure and bound verified native compiler objects
      id: native-cache-finish
      if: ${{ success() && steps.native-cache.outputs.enabled == 'true' }}
      shell: bash
      env:
        KLOGG_NATIVE_CACHE_STATE: ${{ steps.native-cache.outputs.state }}
      run: python3 scripts/ci_native_object_cache.py finish --state "$KLOGG_NATIVE_CACHE_STATE"

    - name: Save verified scoped native compiler objects
      if: ${{ success() && steps.native-cache-finish.outputs.validated == 'true' && steps.native-cache.outputs.save-key != '' }}
      uses: ./.github/actions/save-verified-compiler-cache
      with:
        path: ${{ steps.native-cache.outputs.path }}
        key: ${{ steps.native-cache.outputs.save-key }}
        descriptor: ${{ steps.native-cache-descriptor.outputs.descriptor }}

    - name: Export shared native ADB compiler objects
      if: ${{ success() && steps.native-cache-finish.outputs.validated == 'true' && steps.native-cache-descriptor.outputs.eligible == 'true' }}
      uses: ./.github/actions/export-compiler-object-artifact
      with:
        descriptor: ${{ steps.native-cache-descriptor.outputs.descriptor }}
        path: ${{ steps.native-cache.outputs.path }}
        export-needed: ${{ steps.native-cache-shared.outputs.export-needed }}

    - name: Retain native compiler cache measurement
      if: ${{ always() && steps.native-cache-finish.outputs.validated == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: native-adb-object-cache-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ steps.native-cache-finish.outputs.report }}
          ${{ steps.native-cache-shared.outputs.report }}
        retention-days: 7
        if-no-files-found: error
