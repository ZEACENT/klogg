name: Upload release artifact with one retry
description: Preserve required release uploads across one transient artifact-service failure.
inputs:
  name:
    description: Artifact name, unchanged across attempts.
    required: true
  path:
    description: Publication input paths, unchanged across attempts.
    required: true
  retention-days:
    description: Retention policy, unchanged across attempts.
    required: true
  compression-level:
    description: Compression policy, unchanged across attempts.
    required: true
runs:
  using: composite
  steps:
    - name: Upload release artifact
      id: upload
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}

    # Match the iOS native-stack policy: one retry, never mask its failure.
    # Overwrite also handles an initial attempt that failed after creation.
    - name: Retry release artifact upload after artifact-service failure
      if: ${{ steps.upload.outcome == 'failure' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
