name: "Create a package"
description: "Creates a package from build output"
inputs:
  os:
    description: Linux packaging mode
    required: true
  container-suffix:
    description: Suffix of the prepared CI container image
    required: true
  cpack-generator:
    description: CPack generator; empty for AppImage packaging
    required: false
    default: ""
  package-suffix:
    description: Package filename suffix
    required: true
  artifact-id:
    description: Distribution artifact identifier
    required: true
  collect-symbols:
    description: Preserve debug symbols for shipped builds
    required: false
    default: "false"
  check-container:
    description: Container used to install and smoke-test the package
    required: false
    default: ""
  check-command:
    description: Package install and smoke-test command
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Validate package inputs
      shell: sh
      env:
        KLOGG_INPUT_OS: ${{ inputs.os }}
        KLOGG_INPUT_CONTAINER_SUFFIX: ${{ inputs.container-suffix }}
        KLOGG_INPUT_PACKAGE_SUFFIX: ${{ inputs.package-suffix }}
        KLOGG_INPUT_ARTIFACT_ID: ${{ inputs.artifact-id }}
        KLOGG_INPUT_CHECK_CONTAINER: ${{ inputs.check-container }}
        KLOGG_INPUT_CHECK_COMMAND: ${{ inputs.check-command }}
      run: |
        test -n "$KLOGG_INPUT_OS" || { echo "::error::os is required"; exit 1; }
        test -n "$KLOGG_INPUT_PACKAGE_SUFFIX" || { echo "::error::package-suffix is required"; exit 1; }
        test -n "$KLOGG_INPUT_ARTIFACT_ID" || { echo "::error::artifact-id is required"; exit 1; }
        python3 scripts/validate_ci_container_suffix.py \
          --suffix "$KLOGG_INPUT_CONTAINER_SUFFIX"
        if { test -n "$KLOGG_INPUT_CHECK_CONTAINER" && test -z "$KLOGG_INPUT_CHECK_COMMAND"; } ||
           { test -z "$KLOGG_INPUT_CHECK_CONTAINER" && test -n "$KLOGG_INPUT_CHECK_COMMAND"; }; then
          echo "::error::check-container and check-command must be configured together"
          exit 1
        fi

    - name: package
      if: ${{ inputs.cpack-generator }}
      shell: sh
      run: |
        docker run -v "$KLOGG_WORKSPACE":/usr/local ${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ inputs.container-suffix }} /bin/bash -c "cd /usr/local/build_root && cpack -G ${{ inputs.cpack-generator }} "
        docker run --env KLOGG_VERSION=$KLOGG_VERSION --env KLOGG_PACKAGE_TAG=$KLOGG_PACKAGE_TAG -v "$KLOGG_WORKSPACE":/usr/local ${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ inputs.container-suffix }} /bin/bash -c "cd /usr/local/build_root && mv ./packages/klogg-$KLOGG_VERSION-Linux.${{ inputs.package-suffix }} ./packages/klogg-$KLOGG_VERSION-${{ inputs.artifact-id }}-$KLOGG_PACKAGE_TAG.${{ inputs.package-suffix }}"

    - name: Verify source-built ADB helper in DEB
      if: ${{ inputs.cpack-generator == 'DEB' }}
      shell: sh
      run: |
        docker run --rm -v "$KLOGG_WORKSPACE":/usr/local ${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ inputs.container-suffix }} /bin/bash -c '
          set -euo pipefail
          cd /usr/local/build_root
          package=$(find packages -maxdepth 1 -name "*.deb" -type f -print -quit)
          test -n "$package" || { echo "ERROR: DEB package missing before ADB verification"; exit 1; }
          rm -rf adb-deb-root
          mkdir adb-deb-root
          dpkg-deb -x "$package" adb-deb-root
          python3 ../scripts/smoke_adb_helper.py \
            --adb adb-deb-root/usr/bin/helpers/adb \
            --port 0 --timeout-seconds 15 \
            --json-output adb-helper-deb-smoke.json
          python3 ../scripts/verify_adb_helper_artifact.py \
            --lock ../packaging/adb/adb-helper.lock.json \
            --receipt adb-helper-staged/receipt.json \
            --binary-smoke-receipt adb-helper-deb-smoke.json \
            --package-root adb-deb-root \
            --asset-scope package \
            --source-assets-root adb-deb-root/usr/share/doc/klogg/adb-helper \
            --layout deb \
            --expected-target linux-x86_64 \
            --package-target linux-${{ inputs.artifact-id }}-x86_64 \
            --package-file "$package" \
            --package-verification-receipt packages/adb-helper-deb-package-verification.json \
            --checksum-envelope adb-helper-staged/SHA256SUMS \
            --require-lock-binding
        '

    - name: Check package
      if: ${{ inputs.check-command }}
      shell: sh
      env:
        KLOGG_CHECK_COMMAND: ${{ inputs.check-command }}
      run: |
        docker run --rm -v "$KLOGG_WORKSPACE/$KLOGG_BUILD_ROOT/packages":/packages:ro ${{ inputs.check-container }} /bin/bash -c "$KLOGG_CHECK_COMMAND"

    - name: Linux AppImage
      if: ${{ inputs.os == 'ubuntu_appimage' }}
      shell: sh
      run: |
        docker run --device /dev/fuse --privileged --env KLOGG_VERSION=$KLOGG_VERSION --env KLOGG_PACKAGE_TAG=$KLOGG_PACKAGE_TAG -v "$KLOGG_WORKSPACE":/usr/local ${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ inputs.container-suffix }} /bin/bash -c "cd /usr/local/build_root && ../packaging/linux/appimage/generate_appimage.sh"

    - name: Collect Linux symbols
      if: ${{ inputs.collect-symbols == 'true' }}
      shell: sh
      run: |
        docker run --env KLOGG_PACKAGE_TAG=$KLOGG_PACKAGE_TAG -v "$KLOGG_WORKSPACE":/usr/local ${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ inputs.container-suffix }} /bin/bash -c '
          set -euo pipefail
          cd /usr/local/build_root
          mkdir -p symbols
          xz -c ./output/klogg.debug > ./symbols/klogg_${{ inputs.artifact-id }}_$KLOGG_PACKAGE_TAG.debug.xz
        '
