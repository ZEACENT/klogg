name: "Run tests in container"
description: "Run all the tests in container"
inputs:
  container-suffix:
    description: Suffix of the prepared CI container image
    required: true
runs:
  using: "composite"
  steps:
    - name: Validate test container suffix
      shell: sh
      run: >-
        python3 scripts/validate_ci_container_suffix.py
        --suffix "${{ inputs.container-suffix }}"

    - name: test
      shell: sh
      run: |
        # LANG=C.UTF-8: match the de-facto Linux desktop environment. Under the
        # containers' default POSIX locale, vanilla-built Qt5 (the qt5-tsan
        # runtime) transcodes file names via the locale codec and silently
        # drops non-ASCII bytes, mangling non-ASCII path fixtures (PR #62 TSan
        # leg: a CJK directory was created on disk as "APP").
        docker run --env KLOGG_BUILD_ROOT=$KLOGG_BUILD_ROOT --env LANG=C.UTF-8 --env ASAN_OPTIONS --env UBSAN_OPTIONS --env TSAN_OPTIONS --env LSAN_OPTIONS -v "$KLOGG_WORKSPACE":/usr/local ${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ inputs.container-suffix }} /bin/bash -c "cd /usr/local/$KLOGG_BUILD_ROOT && ctest --verbose"

