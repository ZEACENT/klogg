name: "Prepare klogg mac packages"
description: Deploy, verify, sign, notarize, and package the macOS application
inputs:
  p12-file-base64:
    required: false
  p12-password:
    required: false
  codesign-identity:
    required: false
  installer-sign-identity:
    required: false
  notarization-username:
    required: false
  notarization-team:
    required: false
  notarization-password:
    required: false
    
runs:
  using: "composite"
  steps:
    - name: Mac release signing and notarization preflight
      if: ${{ github.event_name != 'pull_request' }}
      shell: sh
      run: |
        set -eu
        missing=0
        require_input() {
          name="$1"
          value="$2"
          if [ -z "${value}" ]; then
            echo "::error::Missing macOS release qualification input: ${name}"
            missing=1
          fi
        }
        require_input "p12-file-base64" "${{ inputs.p12-file-base64 }}"
        require_input "p12-password" "${{ inputs.p12-password }}"
        require_input "codesign-identity" "${{ inputs.codesign-identity }}"
        require_input "notarization-username" "${{ inputs.notarization-username }}"
        require_input "notarization-team" "${{ inputs.notarization-team }}"
        require_input "notarization-password" "${{ inputs.notarization-password }}"
        test "${missing}" -eq 0

    - name: Import macOS release signing certificate
      if: ${{ github.event_name != 'pull_request' }}
      uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071 # v1
      with:
        p12-file-base64: ${{ inputs.p12-file-base64 }}
        p12-password: ${{ inputs.p12-password }}
     
    - name: Verify disconnected iOS native stack
      shell: sh
      run: |
        set -euo pipefail
        export FETCHCONTENT_FULLY_DISCONNECTED=ON
        test "${FETCHCONTENT_FULLY_DISCONNECTED}" = "ON"
        test -n "${KLOGG_IOS_NATIVE_STACK_ROOT:-}" || {
          echo "::error::KLOGG_IOS_NATIVE_STACK_ROOT is required for macOS release packaging"
          exit 1
        }
        case "${KLOGG_ARCH}" in
          x64) ios_arch=x86_64 ;;
          arm64) ios_arch=arm64 ;;
          *) echo "::error::unsupported iOS native stack architecture: ${KLOGG_ARCH}"; exit 1 ;;
        esac
        python3 scripts/verify_ios_native_stack.py \
          --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
          --stack-root "$KLOGG_IOS_NATIVE_STACK_ROOT" \
          --architecture "$ios_arch" \
          --receipt "$KLOGG_IOS_NATIVE_STACK_ROOT/ios-native-build-receipt.json"
    - name: Mac deploy Qt
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        macdeployqt ./output/klogg.app -always-overwrite -verbose=2

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '5')"
      shell: sh
      run: |
        # KLOGG_QT_DIR is set by prepare-workspace-env from QT_ROOT_DIR (install-qt-action)
        test -n "${KLOGG_QT_DIR}" || { echo "::error::KLOGG_QT_DIR is not set"; exit 1; }
        test -d "${KLOGG_QT_DIR}" || { echo "::error::KLOGG_QT_DIR does not exist: ${KLOGG_QT_DIR}"; exit 1; }
        test -f "${KLOGG_BUILD_ROOT}/macdeployqtfix.py" || { echo "::error::macdeployqtfix.py not found at ${KLOGG_BUILD_ROOT}/macdeployqtfix.py"; exit 1; }
        # macdeployqtfix.py may try to delete rpaths that don't exist (already removed by macdeployqt)
        # This is harmless, so we ignore the error if it occurs
        python3 "${KLOGG_BUILD_ROOT}/macdeployqtfix.py" "${KLOGG_BUILD_ROOT}/output/klogg.app/Contents/MacOS/klogg" "${KLOGG_QT_DIR}"

    - name: Mac deploy Qt fixing
      if: "startsWith(matrix.config.qt_version, '6')"
      shell: sh
      run: |
        # KLOGG_QT_DIR is set by prepare-workspace-env from QT_ROOT_DIR (install-qt-action)
        test -n "${KLOGG_QT_DIR}" || { echo "::error::KLOGG_QT_DIR is not set"; exit 1; }
        test -d "${KLOGG_QT_DIR}" || { echo "::error::KLOGG_QT_DIR does not exist: ${KLOGG_QT_DIR}"; exit 1; }
        test -f "${KLOGG_BUILD_ROOT}/macdeployqtfix.py" || { echo "::error::macdeployqtfix.py not found at ${KLOGG_BUILD_ROOT}/macdeployqtfix.py"; exit 1; }
        # macdeployqtfix.py may try to delete rpaths that don't exist (already removed by macdeployqt)
        # This is harmless, so we ignore the error if it occurs
        python3 "${KLOGG_BUILD_ROOT}/macdeployqtfix.py" "${KLOGG_BUILD_ROOT}/output/klogg.app/Contents/MacOS/klogg" "${KLOGG_QT_DIR}"
    
    - name: Verify staged iOS native bundle
      shell: sh
      run: |
        set -euo pipefail
        app_frameworks="$KLOGG_BUILD_ROOT/output/klogg.app/Contents/Frameworks"
        bundled_stack="$KLOGG_BUILD_ROOT/output/klogg.app/Contents/Frameworks/ios-native"
        ios_support="$KLOGG_BUILD_ROOT/output/klogg.app/Contents/SharedSupport/ios-native"
        rm -rf "$bundled_stack" "$ios_support"
        mkdir -p "$bundled_stack/lib" "$ios_support"
        cp -a "$KLOGG_IOS_NATIVE_STACK_ROOT/lib/"*.dylib "$bundled_stack/lib/"
        for receipt in \
          ios-native-build-receipt.json \
          ios-native-source-set-receipt.json \
          ios-native-legal-receipt.json \
          ios-native-sbom.spdx.json; do
          test -f "$KLOGG_IOS_NATIVE_STACK_ROOT/$receipt" || {
            echo "::error::missing required iOS native release receipt: $receipt"
            exit 1
          }
          cp "$KLOGG_IOS_NATIVE_STACK_ROOT/$receipt" "$ios_support/$receipt"
        done
        for asset in \
          ios-native-source-offer.txt \
          ios-native-lgpl-replacement.txt \
          NOTICE-ios-native.txt; do
          test -f "$KLOGG_IOS_NATIVE_STACK_ROOT/$asset" || {
            echo "::error::missing required iOS native legal/source asset: $asset"
            exit 1
          }
          cp "$KLOGG_IOS_NATIVE_STACK_ROOT/$asset" "$ios_support/$asset"
        done
        test -d "$KLOGG_IOS_NATIVE_STACK_ROOT/licenses" || {
          echo "::error::missing iOS native license directory"
          exit 1
        }
        cp -a "$KLOGG_IOS_NATIVE_STACK_ROOT/licenses" "$ios_support/licenses"
        if find "$app_frameworks" -maxdepth 1 -type f \
             \( -name 'libimobiledevice*.dylib' -o -name 'libplist*.dylib' \
                -o -name 'libusbmuxd*.dylib' -o -name 'libimobiledevice-glue*.dylib' \
                -o -name 'libtatsu*.dylib' \) | grep .; then
          echo "::error::macdeployqt created an iOS native dylib outside the private closure"
          exit 1
        fi
        case "${KLOGG_ARCH}" in
          x64) ios_arch=x86_64 ;;
          arm64) ios_arch=arm64 ;;
          *) echo "::error::unsupported iOS native stack architecture: ${KLOGG_ARCH}"; exit 1 ;;
        esac
        python3 scripts/verify_ios_native_stack.py \
          --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
          --stack-root "$bundled_stack" \
          --architecture "$ios_arch" \
          --receipt "$KLOGG_IOS_NATIVE_STACK_ROOT/ios-native-build-receipt.json" \
          --app-executable "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/klogg" \
          --source-receipt "$ios_support/ios-native-source-set-receipt.json" \
          --asset-scope package \
          --source-assets-root "$ios_support" \
          --legal-receipt "$ios_support/ios-native-legal-receipt.json" \
          --sbom "$ios_support/ios-native-sbom.spdx.json" \
          --package-receipt "$ios_support/ios-native-package-receipt.json"

    - name: Verify source-built ADB helper before DMG
      shell: sh
      run: |
        set -euo pipefail
        test -x "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/helpers/adb" || {
          echo "::error::source-built ADB helper missing from output/klogg.app/Contents/MacOS/helpers/adb"
          exit 1
        }
        python3 scripts/smoke_adb_helper.py \
          --adb "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/helpers/adb" \
          --port 0 --timeout-seconds 15 \
          --json-output "$KLOGG_BUILD_ROOT/adb-helper-dmg-smoke.json"
        python3 scripts/verify_adb_helper_artifact.py \
          --lock packaging/adb/adb-helper.lock.json \
          --receipt "$KLOGG_BUILD_ROOT/adb-helper-staged/receipt.json" \
          --binary-smoke-receipt "$KLOGG_BUILD_ROOT/adb-helper-dmg-smoke.json" \
          --package-root "$KLOGG_BUILD_ROOT/output" \
          --asset-scope package \
          --source-assets-root "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/SharedSupport/adb-helper" \
          --layout dmg \
          --expected-target "${{ matrix.config.adb_target }}" \
          --checksum-envelope "$KLOGG_BUILD_ROOT/adb-helper-staged/SHA256SUMS" \
          --require-lock-binding

    - name: Set packaging env
      shell: sh
      run: |
        echo "KLOGG_CODESIGN=${{ inputs.codesign-identity }}" >> $GITHUB_ENV
        echo "KLOGG_INSTALLERSIGN=${{ inputs.installer-sign-identity }}" >> $GITHUB_ENV
        echo "KLOGG_DMG=klogg-${{ env.KLOGG_VERSION }}-mac-${{ env.KLOGG_ARCH }}-${{ env.KLOGG_PACKAGE_TAG }}.dmg" >> $GITHUB_ENV
        echo "KLOGG_PKG=klogg-${{ env.KLOGG_VERSION }}-mac-${{ env.KLOGG_ARCH }}-${{ env.KLOGG_PACKAGE_TAG }}.pkg" >> $GITHUB_ENV

    - name: Sign and verify macOS application bundle
      if: ${{ github.event_name != 'pull_request' }}
      shell: sh
      run: |
        set -euo pipefail
        cd "$KLOGG_BUILD_ROOT"
        codesign -v -f -o runtime --deep --timestamp -s "$KLOGG_CODESIGN" ./output/klogg.app
        codesign --verify --deep --strict --verbose=2 ./output/klogg.app

    - name: Bind and reverify signed iOS native closure
      if: ${{ github.event_name != 'pull_request' }}
      shell: sh
      run: |
        set -euo pipefail
        case "${KLOGG_ARCH}" in
          x64) ios_arch=x86_64 ;;
          arm64) ios_arch=arm64 ;;
          *) echo "::error::unsupported iOS native stack architecture: ${KLOGG_ARCH}"; exit 1 ;;
        esac
        app="$KLOGG_BUILD_ROOT/output/klogg.app"
        bundled_stack="$app/Contents/Frameworks/ios-native"
        ios_support="$app/Contents/SharedSupport/ios-native"
        package_receipt="$ios_support/ios-native-package-receipt.json"
        python3 scripts/verify_ios_native_stack.py \
          --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
          --stack-root "$bundled_stack" \
          --architecture "$ios_arch" \
          --receipt "$KLOGG_IOS_NATIVE_STACK_ROOT/ios-native-build-receipt.json" \
          --app-executable "$app/Contents/MacOS/klogg" \
          --source-receipt "$ios_support/ios-native-source-set-receipt.json" \
          --asset-scope package \
          --source-assets-root "$ios_support" \
          --legal-receipt "$ios_support/ios-native-legal-receipt.json" \
          --sbom "$ios_support/ios-native-sbom.spdx.json" \
          --signed-package-stage \
          --package-receipt "$package_receipt"
        # Updating the package receipt changes bundle resources, so seal the root
        # again without touching the already verified nested dylib signatures.
        codesign -v -f -o runtime --timestamp -s "$KLOGG_CODESIGN" "$app"
        codesign --verify --deep --strict --verbose=2 "$app"
        python3 scripts/verify_ios_native_stack.py \
          --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
          --stack-root "$bundled_stack" \
          --architecture "$ios_arch" \
          --receipt "$KLOGG_IOS_NATIVE_STACK_ROOT/ios-native-build-receipt.json" \
          --app-executable "$app/Contents/MacOS/klogg" \
          --source-receipt "$ios_support/ios-native-source-set-receipt.json" \
          --asset-scope package \
          --source-assets-root "$ios_support" \
          --legal-receipt "$ios_support/ios-native-legal-receipt.json" \
          --sbom "$ios_support/ios-native-sbom.spdx.json" \
          --verify-package-receipt "$package_receipt"

    - name: Mac pack dmg
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT

        # Aggressive cleanup: orphan diskimages-helper processes can hold
        # locks on disk image resources across runs, causing "hdiutil: create
        # failed - Resource busy".  Kill them before we start.
        if pgrep -x diskimages-helper >/dev/null 2>&1; then
          killall diskimages-helper
        fi

        # Detach any leftover mounted klogg volumes from previous runs
        for vol in /Volumes/klogg /Volumes/klogg-*; do
          if [ -d "${vol}" ]; then
            if ! hdiutil detach "${vol}" -force; then
              echo "Continuing after stale volume detach cleanup failed: ${vol}"
            fi
          fi
        done
        rm -f ./packages/*.dmg
        mkdir -p ./packages

        # Let the system release disk image resources after cleanup
        sleep 2

        # Build DMG directly with hdiutil instead of CPack DragNDrop.
        #
        # CPack's DragNDrop generator runs a CMake install step that calls
        # install_name_tool -delete_rpath on the staged binary.  When
        # macdeployqt has already removed that rpath, the delete fails and
        # cascades into hdiutil detach errors.  This has been an intermittent
        # CI failure that was patched and reverted repeatedly:
        #   b6f71e12 → 44d58b34 → f468d7da → 92791b80 → 4d367052
        #
        # Using hdiutil directly on the macdeployqt-processed .app bundle
        # bypasses CMake's install/rpath logic entirely — zero rpath
        # operations, zero conflicts.

        DMG_STAGING=$(mktemp -d)
        cp -a ./output/klogg.app "${DMG_STAGING}/"
        ln -s /Applications "${DMG_STAGING}/Applications"

        # Copy background image for the DMG window
        BACKGROUND_DIR="${DMG_STAGING}/.background"
        mkdir -p "${BACKGROUND_DIR}"
        cp "${KLOGG_WORKSPACE}/packaging/osx/dmg_background.tif" "${BACKGROUND_DIR}/background.tif"

        # Retry hdiutil create up to 3 times: "Resource busy" is a transient
        # macOS runner issue caused by lingering diskimages-helper processes.
        for attempt in 1 2 3; do
          if hdiutil create \
              -volname "klogg" \
              -srcfolder "${DMG_STAGING}" \
              -ov \
              -format UDZO \
              "./packages/klogg-${{ env.KLOGG_VERSION }}-OSX.dmg"; then
            break
          fi
          if [ $attempt -eq 3 ]; then
            echo "hdiutil create failed after 3 attempts"
            exit 1
          fi
          echo "hdiutil create attempt ${attempt} failed, retrying after cleanup..."
          if pgrep -x diskimages-helper >/dev/null 2>&1; then
          killall diskimages-helper
        fi
          sleep 5
        done

        rm -rf "${DMG_STAGING}"

        if [ ! -f "./packages/klogg-${{ env.KLOGG_VERSION }}-OSX.dmg" ]; then
            echo "DMG creation failed"
            exit 1
        fi
        echo "DMG created successfully: ./packages/klogg-${{ env.KLOGG_VERSION }}-OSX.dmg"

    - name: Mac rename dmg with arch
      shell: sh
      run: |
        cd $KLOGG_BUILD_ROOT
        # Rename DMG to include architecture to avoid conflicts when multiple macOS builds upload
        mv ./packages/klogg-${{ env.KLOGG_VERSION }}-OSX.dmg ./packages/${{ env.KLOGG_DMG }}
        echo "Renamed DMG to: ${{ env.KLOGG_DMG }}"

    - name: Sign and verify macOS disk image
      if: ${{ github.event_name != 'pull_request' }}
      shell: sh
      run: |
        set -euo pipefail
        cd "$KLOGG_BUILD_ROOT"
        codesign -v -f -o runtime --timestamp -s "$KLOGG_CODESIGN" "./packages/$KLOGG_DMG"
        codesign --verify --strict --verbose=2 "./packages/$KLOGG_DMG"

    - name: Notarize staple and validate macOS disk image
      if: ${{ github.event_name != 'pull_request' }}
      shell: sh
      run: |
        set -euo pipefail
        dmg="$KLOGG_BUILD_ROOT/packages/$KLOGG_DMG"
        xcrun notarytool submit --wait --output-format json \
          --apple-id "${{ inputs.notarization-username }}" \
          --team-id "${{ inputs.notarization-team }}" \
          --password "${{ inputs.notarization-password }}" \
          "$dmg" | tee "$KLOGG_BUILD_ROOT/dmg-notarytool-receipt.json"
        xcrun stapler staple "$dmg"
        xcrun stapler validate "$dmg"
        spctl --assess --type open --context context:primary-signature --verbose "$dmg"
        codesign --verify --strict --verbose=2 "$dmg"
        python3 - \
          "$dmg" \
          "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/helpers/adb" \
          "$KLOGG_BUILD_ROOT/dmg-notarytool-receipt.json" \
          "$KLOGG_BUILD_ROOT/adb-helper-staged/receipt.json" \
          "$KLOGG_BUILD_ROOT/adb-helper-signing-receipt.json" \
          "$KLOGG_BUILD_ROOT/adb-helper-notarization-receipt.json" \
          "$KLOGG_CODESIGN" \
          "${{ inputs.notarization-team }}" \
          "${{ matrix.config.adb_target }}" <<'PY'
        import hashlib, json, pathlib, sys
        dmg, helper, notary_path, build_receipt_path, signing_path, notarization_path = map(pathlib.Path, sys.argv[1:7])
        identity, team, target = sys.argv[7:10]
        def sha256(path):
            digest = hashlib.sha256()
            with path.open("rb") as stream:
                for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                    digest.update(chunk)
            return digest.hexdigest()
        notary = json.loads(notary_path.read_text(encoding="utf-8"))
        if str(notary.get("status", "")).lower() != "accepted" or not notary.get("id"):
            raise SystemExit(f"notarization was not accepted: {notary}")
        build_receipt = json.loads(build_receipt_path.read_text(encoding="utf-8"))
        source_helper_sha256 = build_receipt.get("helper", {}).get("sha256")
        if not source_helper_sha256:
            raise SystemExit("binary-build receipt lacks source helper sha256")
        package_sha256 = sha256(dmg)
        evidence = {
            "schema_version": 1,
            "target": target,
            "dmg_sha256": package_sha256,
            "package_sha256": package_sha256,
            "source_helper_sha256": source_helper_sha256,
            "signed_helper_sha256": sha256(helper),
        }
        signing_path.write_text(json.dumps({
            **evidence,
            "receipt_kind": "signing",
            "status": "passed",
            "identity": identity,
        }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        notarization_path.write_text(json.dumps({
            **evidence,
            "receipt_kind": "notarization",
            "status": "passed",
            "team_id": team,
            "submission_id": notary["id"],
        }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        PY
        python3 scripts/smoke_adb_helper.py \
          --adb "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/MacOS/helpers/adb" \
          --port 0 --timeout-seconds 15 \
          --json-output "$KLOGG_BUILD_ROOT/adb-helper-dmg-signed-smoke.json"
        python3 scripts/verify_adb_helper_artifact.py \
          --lock packaging/adb/adb-helper.lock.json \
          --receipt "$KLOGG_BUILD_ROOT/adb-helper-staged/receipt.json" \
          --binary-smoke-receipt "$KLOGG_BUILD_ROOT/adb-helper-dmg-signed-smoke.json" \
          --package-root "$KLOGG_BUILD_ROOT/output" \
          --asset-scope package \
          --source-assets-root "$KLOGG_BUILD_ROOT/output/klogg.app/Contents/SharedSupport/adb-helper" \
          --layout dmg \
          --expected-target "${{ matrix.config.adb_target }}" \
          --package-target "${{ matrix.config.adb_target }}-dmg" \
          --signing-receipt "$KLOGG_BUILD_ROOT/adb-helper-signing-receipt.json" \
          --notarization-receipt "$KLOGG_BUILD_ROOT/adb-helper-notarization-receipt.json" \
          --package-file "$dmg" \
          --package-verification-receipt "$KLOGG_BUILD_ROOT/adb-helper-dmg-package-verification.json" \
          --checksum-envelope "$KLOGG_BUILD_ROOT/adb-helper-staged/SHA256SUMS" \
          --require-lock-binding
        mount_dir=$(mktemp -d)
        mounted_device=""
        cleanup_mounted_dmg() {
          if [ -n "${mounted_device}" ]; then
            hdiutil detach "${mounted_device}" -force >/dev/null
          fi
          rm -rf "${mount_dir}"
        }
        trap cleanup_mounted_dmg EXIT
        attach_output=$(hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir")
        mounted_device=$(printf '%s\n' "$attach_output" | awk '$1 ~ /^\/dev\// { device=$1 } END { print device }')
        test -n "$mounted_device" || { echo "::error::failed to identify mounted DMG device"; exit 1; }
        mounted_app=$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)
        test -n "$mounted_app" || { echo "::error::mounted DMG has no application bundle"; exit 1; }
        mounted_stack="$mounted_app/Contents/Frameworks/ios-native"
        mounted_support="$mounted_app/Contents/SharedSupport/ios-native"
        test ! -e "$mounted_support/ios-native-corresponding-source.tar.gz" || {
          echo "::error::release-only iOS source archive leaked into final DMG"
          exit 1
        }
        case "${KLOGG_ARCH}" in
          x64) ios_arch=x86_64 ;;
          arm64) ios_arch=arm64 ;;
          *) echo "::error::unsupported iOS native stack architecture: ${KLOGG_ARCH}"; exit 1 ;;
        esac
        python3 scripts/verify_ios_native_stack.py \
          --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
          --stack-root "$mounted_stack" \
          --architecture "$ios_arch" \
          --receipt "$KLOGG_IOS_NATIVE_STACK_ROOT/ios-native-build-receipt.json" \
          --app-executable "$mounted_app/Contents/MacOS/klogg" \
          --source-receipt "$mounted_support/ios-native-source-set-receipt.json" \
          --asset-scope package \
          --source-assets-root "$mounted_support" \
          --legal-receipt "$mounted_support/ios-native-legal-receipt.json" \
          --sbom "$mounted_support/ios-native-sbom.spdx.json" \
          --verify-package-receipt "$mounted_support/ios-native-package-receipt.json"
        python3 - \
          "$dmg" \
          "$mounted_support/ios-native-package-receipt.json" \
          "$mounted_support/ios-native-source-set-receipt.json" \
          "$KLOGG_BUILD_ROOT/packages/ios-native-dmg-package-verification.json" <<'PY'
        import hashlib, json, pathlib, sys
        dmg, package_receipt_path, source_set_path, output = map(pathlib.Path, sys.argv[1:5])
        digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
        package_receipt = json.loads(package_receipt_path.read_text(encoding="utf-8"))
        source_set_hash = digest(source_set_path)
        if package_receipt.get("source_set_receipt_sha256") != source_set_hash:
            raise SystemExit("iOS package receipt source-set binding mismatch")
        output.write_text(json.dumps({
            "schema_version": 1,
            "receipt_kind": "ios-native-package-verification",
            "release_qualified": True,
            "source_set_receipt_sha256": source_set_hash,
            "ios_native_package_receipt_sha256": digest(package_receipt_path),
            "packages": [{"name": dmg.name, "sha256": digest(dmg)}],
        }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
        PY
        cp "$KLOGG_BUILD_ROOT/adb-helper-dmg-package-verification.json" "$KLOGG_BUILD_ROOT/packages/"
        cp "$KLOGG_BUILD_ROOT/adb-helper-signing-receipt.json" "$KLOGG_BUILD_ROOT/packages/"
        cp "$KLOGG_BUILD_ROOT/adb-helper-notarization-receipt.json" "$KLOGG_BUILD_ROOT/packages/"

    #- name: "Mac build pkg"
    #  if: ${{ github.event_name != 'pull_request' }}
    #  shell: sh
    #  run: |
    #    cd $KLOGG_BUILD_ROOT
    #    mkdir -p packages
    #    mkdir -p pkg_resources/en.lproj
