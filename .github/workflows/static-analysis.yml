name: "Static analysis"

# Event-aware clang-tidy + cppcheck gate. Configures once
# (CMAKE_EXPORT_COMPILE_COMMANDS) to produce build_root/compile_commands.json,
# then runs two independent analyses:
#   * clang-tidy via clang-tidy-diff on PRs, pushes, and manual runs with a
#     CHANGED-LINES-ONLY policy that is strict on new code. Manual full-report
#     dispatch performs the legacy full-source audit outside the merge path.
#   * cppcheck --enable=warning,style --error-exitcode=1 over the first-party
#     src/ compile units.
# cppcheck returning non-zero, or a clang-tidy-diff finding on a changed
# PR/push/manual line, fails the job. The job runs inside the locked
# noble-qt693-analysis environment (gcc-13, clang-tidy, cppcheck, Qt 6.9.3);
# only the CPM source cache is restored on top of the verified image.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  workflow_dispatch:
    inputs:
      analysis-mode:
        description: Run the full report-only audit, or a strict diff from an explicit base SHA
        required: true
        default: full-report
        type: choice
        options:
          - full-report
          - changed-strict
      base-sha:
        description: Required only for changed-strict manual analysis
        required: false
        type: string

concurrency:
  # Full audits and strict event qualification must never cancel one another.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  PlatformFragilePreflight:
    name: "Platform-fragile preflight"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.8'
      - name: Run narrow platform-fragile lint
        run: python3 scripts/lint_platform_fragile.py --paths src tests

  ResolveLinuxEnvironment:
    name: "Resolve locked analysis environment"
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: prepare
        uses: ./.github/actions/prepare-linux-environment
        with:
          family: noble-qt693-analysis
          pull: "false"
          retag: "false"

  static-analysis:
    needs: [PlatformFragilePreflight, ResolveLinuxEnvironment]
    name: "clang-tidy + cppcheck"
    runs-on: ubuntu-24.04
    # Strict changed-scope runs normally finish well below this bound. The
    # manual full report-only audit gets enough cold-cache headroom without
    # forcing master pushes through the same whole-tree workload.
    timeout-minutes: 90
    container:
      image: ${{ needs.ResolveLinuxEnvironment.outputs.image }}
      options: --init
    env:
      KLOGG_WORKSPACE: ${{ github.workspace }}
      KLOGG_BUILD_ROOT: build_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the clang-tidy-diff step can diff the PR branch
          # against its exact base SHA (changed-LINES-ONLY policy).
          fetch-depth: 0

      # The container runs as root while the mounted workspace stays owned by
      # the runner user; raw git commands fail closed without this exception.
      - name: Trust the workspace for Git inside the container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve authoritative analysis base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          MANUAL_MODE: ${{ inputs.analysis-mode }}
          MANUAL_BASE_SHA: ${{ inputs.base-sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$PUSH_BASE_SHA" ;;
            workflow_dispatch)
              if [ "$MANUAL_MODE" = "full-report" ]; then
                echo "KLOGG_ANALYSIS_MODE=full-report" >> "$GITHUB_ENV"
                exit 0
              fi
              test "$MANUAL_MODE" = "changed-strict" || {
                echo "::error::unsupported manual analysis mode: $MANUAL_MODE"
                exit 1
              }
              base_sha="$MANUAL_BASE_SHA"
              ;;
            *) echo "::error::unsupported static-analysis event: $EVENT_NAME"; exit 1 ;;
          esac
          test -n "$base_sha" && test "$base_sha" != "0000000000000000000000000000000000000000" || {
            echo "::error::changed-strict analysis requires an authoritative non-zero base SHA"
            exit 1
          }
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_sha"
          fi
          git cat-file -e "$base_sha^{commit}"
          echo "KLOGG_ANALYSIS_BASE=$base_sha" >> "$GITHUB_ENV"
          echo "KLOGG_ANALYSIS_MODE=changed-strict" >> "$GITHUB_ENV"

      - name: Locate clang-tidy-diff in the locked environment
        shell: bash
        run: |
          set -euo pipefail
          tidy_diff=$(command -v clang-tidy-diff || true)
          if [ -z "$tidy_diff" ]; then
            tidy_diff=$(command -v clang-tidy-diff-18.py || true)
          fi
          if [ -z "$tidy_diff" ]; then
            tidy_diff=$(find /usr/lib/llvm-*/share/clang -name clang-tidy-diff.py -print -quit 2>/dev/null || true)
          fi
          if [ -z "$tidy_diff" ]; then
            echo "::error::clang-tidy-diff is missing from the locked analysis environment"
            exit 1
          fi
          echo "CLANG_TIDY_DIFF=$tidy_diff" >> "$GITHUB_ENV"

      - name: Restore CPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: CPM-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake', '3rdparty/patches/**', 'cmake/prefetch_cpm/CMakeLists.txt') }}

      - name: Populate CPM source cache
        uses: ./.github/actions/prefetch-cpm-cache
        env:
          KLOGG_WORKSPACE: ${{ github.workspace }}

      - name: Acquire private analysis build namespace
        shell: bash
        run: |
          set -euo pipefail
          # The mounted workspace has foreign-owned ancestors for this root job.
          # Retain the mktemp parent; configure may clean only its build child.
          private_parent=$(mktemp -d /tmp/klogg-analysis.XXXXXXXX)
          printf 'KLOGG_BUILD_ROOT=%s/build_root\n' "$private_parent" >> "$GITHUB_ENV"

      # The ordinary adapter reuses the unchanged qualification primitives.
      # Keep phase orchestration out of the workflow and signed verifier bytes.
      - name: Configure (generate compile_commands.json)
        shell: bash
        run: |
          python3 scripts/run_ci_analysis.py configure --role static \
            --workspace "$KLOGG_WORKSPACE" --build-dir "$KLOGG_BUILD_ROOT"

      - name: Generate Qt UI headers for analysis
        shell: bash
        run: |
          python3 scripts/run_ci_analysis.py static-prepare --role static \
            --workspace "$KLOGG_WORKSPACE" --build-dir "$KLOGG_BUILD_ROOT" --jobs "$(nproc)"

      - name: Run clang-tidy
        shell: bash
        run: |
          python3 scripts/run_ci_analysis.py static-tidy --role static \
            --workspace "$KLOGG_WORKSPACE" --build-dir "$KLOGG_BUILD_ROOT" \
            --analysis-mode "$KLOGG_ANALYSIS_MODE" --analysis-base-sha "${KLOGG_ANALYSIS_BASE:-}" \
            --clang-tidy-diff "$CLANG_TIDY_DIFF" --jobs "$(nproc)"

      - name: Run cppcheck (warning+style over src/)
        shell: bash
        run: |
          python3 scripts/run_ci_analysis.py static-cppcheck --role static \
            --workspace "$KLOGG_WORKSPACE" --build-dir "$KLOGG_BUILD_ROOT" \
            --analysis-mode "$KLOGG_ANALYSIS_MODE" --analysis-base-sha "${KLOGG_ANALYSIS_BASE:-}"
