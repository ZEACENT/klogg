name: "Static analysis"

# Per-PR clang-tidy + cppcheck gate.  Configures once
# (CMAKE_EXPORT_COMPILE_COMMANDS) to produce build_root/compile_commands.json,
# then runs two independent analyses:
#   * clang-tidy via clang-tidy-diff on PRs with a CHANGED-LINES-ONLY policy:
#     strict on NEW code while ignoring the pre-existing style findings (hundreds
#     of them across transitively-included headers) that make whole-file
#     --warnings-as-errors unworkable on a legacy codebase.  On push-to-master /
#     workflow_dispatch the full src/ audit runs NON-FATAL (report-only).
#   * cppcheck --enable=warning,style --error-exitcode=1 over the first-party
#     src/ compile units.
# cppcheck returning non-zero, or a clang-tidy-diff finding on a changed PR
# line, fails the job.  Setup mirrors the Coverage workflow (gcc-13 leg +
# agent-setup for Qt/Boost/CPM cache).

on:
  push:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: "clang-tidy + cppcheck"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          # agent-setup reads matrix.config.* to install Qt/Boost/CPM cache,
          # mirroring the Coverage workflow's native gcc-13 leg.
          - arch: x64
            qt_version: 6.9.3
            qt_arch: linux_gcc_64
            qt_modules: qt5compat
            qt_archives: qtbase icu qtsvg qttools qttranslations
    env:
      KLOGG_WORKSPACE: ${{ github.workspace }}
      KLOGG_BUILD_ROOT: build_root
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the clang-tidy-diff step can diff the PR branch
          # against origin/master (changed-LINES-ONLY policy).
          fetch-depth: 0

      - name: Install gcc-13, clang-tidy and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 clang-tidy cppcheck libxkbcommon-dev libxkbcommon-x11-dev

      - name: Prepare compiler env
        run: |
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup

      - name: Build clang-tidy review scope
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CHANGED-LINES-ONLY policy: snapshot this branch's src/ changes as a
            # unified diff (-U0 => no context lines, so only added/removed lines
            # are described) and feed it to clang-tidy-diff in the next step.
            # clang-tidy-diff turns the "@@" hunk ranges into a clang-tidy
            # --line-filter, so clang-tidy reports ONLY diagnostics on added
            # lines -- strict on NEW code, ignoring the hundreds of pre-existing
            # style findings elsewhere in touched files (and in transitively-
            # included headers, which never appear in the line-filter) that make
            # whole-file --warnings-as-errors unworkable on this legacy codebase.
            # Use the PR's exact base SHA, not the `origin/master` ref (which is
            # not reliably populated for pull_request checkouts and can let
            # pre-existing findings from earlier master commits leak in). This
            # scopes clang-tidy strictly to THIS PR's changed src/ lines.
            BASE='${{ github.event.pull_request.base.sha }}'
            git diff -U0 "$BASE" HEAD -- src/ > tidy_patch.diff
            # Skip the gate when no compilation unit (only headers / nothing) in
            # src/ changed; headers are still linted transitively when their TU
            # is in the diff, and always by the cppcheck step below.
            n=$(grep -Ec '^\+\+\+ b/.*\.(cpp|cc)$' tidy_patch.diff || true)
            if [ "$n" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No changed src/ compilation units; skipping clang-tidy."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "clang-tidy-diff: $n changed src/ TU(s) on this branch."
            fi
          else
            # push-to-master / workflow_dispatch: audit all of src/, NON-FATAL
            # (report-only) so pre-existing findings never block the branch.
            echo "skip=false" >> "$GITHUB_OUTPUT"
            find src -type f \( -name '*.cpp' -o -name '*.cc' \) | sort > tidy_files.txt
            echo "clang-tidy: full src/ audit (report-only), $(wc -l < tidy_files.txt) file(s)."
          fi

      - name: Configure (generate compile_commands.json)
        shell: bash
        run: |
          rm -rf "$KLOGG_BUILD_ROOT"
          cmake -S "$KLOGG_WORKSPACE" -B "$KLOGG_BUILD_ROOT" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKLOGG_BUILD_TESTS=ON \
            -DKLOGG_USE_VECTORSCAN=OFF \
            -DKLOGG_USE_LTO=OFF \
            -DKLOGG_USE_SENTRY=OFF \
            -DKLOGG_GENERIC_CPU=ON \
            -DCPM_SOURCE_CACHE="$KLOGG_WORKSPACE/cpm_cache" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Run clang-tidy (changed lines on PRs; report-only on master)
        if: steps.targets.outputs.skip != 'true'
        shell: bash
        run: |
          set -u
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # CHANGED-LINES-ONLY: clang-tidy-diff feeds clang-tidy the TUs
            # touched by the patch (tidy_patch.diff on stdin) plus a --line-filter
            # built from the diff hunks, so clang-tidy reports ONLY diagnostics
            # on added lines -- pre-existing style findings on unchanged lines
            # (and findings in transitively-included headers) never fail the
            # gate.  Notes for the LLVM 18 clang-tidy-diff shipped on Ubuntu 24.04
            # (/usr/bin/clang-tidy-diff):
            #   -p 1                strip git's leading "b/" diff prefix so paths
            #                       match compile_commands.json entries;
            #   -path <build_root>  the compile_commands.json dir (NOT -p, which
            #                       in this tool strips diff-path prefixes);
            #   -iregex             restrict the run to compilation units (skip
            #                       standalone headers, which lack TU flags);
            #   -extra-arg          absorb gcc-specific -W flags in the DB.
            # clang-tidy-diff has NO --warnings-as-errors flag, and its exit code
            # only reflects clang-tidy PROCESS failures, so the filtered stdout
            # (" warning:" / " error:" per finding) is the gate signal.
            echo "::group::clang-tidy-diff (changed lines only)"
            clang-tidy-diff \
              -p 1 \
              -path "$KLOGG_BUILD_ROOT" \
              -iregex '.*\.(cpp|cc)$' \
              -extra-arg=-Wno-unknown-warning-option \
              -quiet \
              < tidy_patch.diff > tidy_diff_out.txt 2>&1 || true
            echo "::endgroup::"
            cat tidy_diff_out.txt
            # Defensive post-filter: clang-tidy-diff is patch-driven, but its
            # file detection can occasionally surface a finding in a TU that is
            # NOT in this PR's real diff (a pre-existing issue in an unrelated
            # file). Re-derive the exact set of src/ files this PR changed and
            # fail ONLY on findings whose path matches one of them, so the gate
            # is strict on this PR's new code and blind to pre-existing leaks.
            BASE='${{ github.event.pull_request.base.sha }}'
            mapfile -t changed_files < <(git diff --name-only "$BASE" HEAD -- src/ | grep -E '\.(cpp|cc)$' || true)
            new_findings=""
            if [ "${#changed_files[@]}" -gt 0 ]; then
              # Match finding lines whose path ends with one of the changed
              # files (clang-tidy prints absolute paths; we match the suffix).
              pattern=$(printf '%s:\n' "${changed_files[@]}" | paste -sd'|' -)
              new_findings=$(grep -E ' (warning|error):' tidy_diff_out.txt | grep -E "$pattern" || true)
            fi
            if [ -n "$new_findings" ]; then
              echo "::error::clang-tidy reported issues on this PR's changed files:"
              echo "$new_findings"
              exit 1
            fi
            echo "clang-tidy-diff: clean (no issues on this PR's changed src/ files)."
          else
            # Full src/ audit on push-to-master / workflow_dispatch, NON-FATAL
            # (report-only): clang-tidy runs WITHOUT --warnings-as-errors, so
            # findings surface in the log but never block the branch.
            export KLOGG_BUILD_ROOT
            xargs -P "$(nproc)" -I{} bash -c '
              clang-tidy -p "$KLOGG_BUILD_ROOT" \
                --extra-arg=-Wno-unknown-warning-option "{}" || exit 0
            ' < tidy_files.txt || true
            echo "clang-tidy: full src/ audit complete (report-only, non-fatal)."
          fi

      - name: Run cppcheck (warning+style over src/)
        shell: bash
        run: |
          set -u
          # cppcheck's -i does NOT exclude paths when --project is used (the JSON
          # database pins the exact TU set), so first filter compile_commands.json
          # down to first-party src/ TUs, dropping cpm_cache / _deps / build_root
          # autogen / tests / benchmarks / 3rdparty.  The --suppress flags below
          # seed the ratchet baseline: the first four drop cppcheck's
          # Qt/preprocessor false positives (tool limitations, not code defects);
          # the rest mask pre-existing style/perf findings in src/ so the gate is
          # green on day one and catches *new* issues. Delete a --suppress line
          # to start enforcing that check (fix the findings or mark them with
          # // cppcheck-suppress first).
          BASE='${{ github.event.pull_request.base.sha }}'
          # Filter compile_commands.json to first-party src/ TUs (cppcheck's -i
          # does not exclude paths under --project, so we hand it a filtered DB).
          python3 -c "import json,os,sys; src=os.path.abspath(os.path.join(os.getcwd(),'src'))+os.sep; db=json.load(open(sys.argv[1])); g=lambda e: e['file'] if 'file' in e else (e.get('files') or [''])[0]; kept=[e for e in db if g(e).startswith(src)]; json.dump(kept, open(sys.argv[2],'w')); print(f'cppcheck: {len(kept)}/{len(db)} first-party src/ TUs')" "$KLOGG_BUILD_ROOT/compile_commands.json" /tmp/cc_src.json

          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "$BASE" ]; then
            # PR: scope cppcheck to THIS PR's changed src/ TUs (consistent with
            # the clang-tidy-diff changed-lines policy) so pre-existing findings
            # in UNCHANGED files -- e.g. a redundantInitialization false positive
            # in styles.cpp's theme logic -- don't block the gate. New issues in
            # touched files are still caught (the whole changed TU is checked).
            mapfile -t changed_src < <(git diff --name-only "$BASE" HEAD -- src/ | grep -E '\.(cpp|cc)$' || true)
            if [ "${#changed_src[@]}" -eq 0 ]; then
              echo "cppcheck: no changed src/ TUs on this PR; skipping."
              exit 0
            fi
            printf '%s\n' "${changed_src[@]}" > /tmp/changed_src.txt
            python3 -c "import json,sys; changed=[l.strip() for l in open('/tmp/changed_src.txt') if l.strip()]; db=json.load(open(sys.argv[1])); g=lambda e: e['file'] if 'file' in e else (e.get('files') or [''])[0]; kept=[e for e in db if any(g(e).endswith(c) for c in changed)]; json.dump(kept, open(sys.argv[2],'w')); print(f'cppcheck: {len(kept)} changed src/ TUs')" /tmp/cc_src.json /tmp/cc_changed.json
            CC_PROJECT=/tmp/cc_changed.json
            CC_EXTRA="--error-exitcode=1"
          else
            # push-to-master / workflow_dispatch: full src/ audit, REPORT-ONLY
            # (no --error-exitcode) so pre-existing findings never block master.
            CC_PROJECT=/tmp/cc_src.json
            CC_EXTRA=""
          fi

          cppcheck \
            --project="$CC_PROJECT" \
            --enable=warning,style \
            $CC_EXTRA \
            --inline-suppr \
            --quiet \
            --suppress=missingInclude \
            --suppress=syntaxError \
            --suppress=unknownMacro \
            --suppress=preprocessorErrorDirective \
            --suppress=functionStatic \
            --suppress=noExplicitConstructor \
            --suppress=returnByReference \
            --suppress=constParameterPointer \
            --suppress=constParameterReference \
            --suppress=constVariable \
            --suppress=shadowFunction \
            --suppress=variableScope \
            --suppress=unreadVariable \
            --suppress=assignBoolToFloat \
            --suppress=useStlAlgorithm \
            --suppress=useInitializationList \
            --suppress=missingOverride
