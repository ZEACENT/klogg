name: "Static analysis"

# Per-PR clang-tidy + cppcheck gate.  Configures once
# (CMAKE_EXPORT_COMPILE_COMMANDS) to produce build_root/compile_commands.json,
# then runs two independent, fast-failing analyses:
#   * clang-tidy --warnings-as-errors='*' (checks from .clang-tidy) over the
#     changed C/C++ files on PRs, and over all of src/ on push-to-master /
#     workflow_dispatch.
#   * cppcheck --enable=warning,style --error-exitcode=1 over the first-party
#     src/ compile units.
# Either tool returning non-zero fails the job.  Setup mirrors the Coverage
# workflow (native gcc-13 leg + agent-setup for Qt/Boost/CPM cache).

on:
  push:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  pull_request:
    branches: [master]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  workflow_dispatch:

jobs:
  static-analysis:
    name: "clang-tidy + cppcheck"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          # agent-setup reads matrix.config.* to install Qt/Boost/CPM cache,
          # mirroring the Coverage workflow's native gcc-13 leg.
          - arch: x64
            qt_version: 6.9.3
            qt_arch: linux_gcc_64
            qt_modules: qt5compat
            qt_archives: qtbase icu qtsvg qttools qttranslations
    env:
      KLOGG_WORKSPACE: ${{ github.workspace }}
      KLOGG_BUILD_ROOT: build_root
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so tj-actions/changed-files can diff the PR base.
          fetch-depth: 0

      - name: Install gcc-13, clang-tidy and cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 clang-tidy cppcheck

      - name: Prepare compiler env
        run: |
          echo "CC=gcc-13" >> $GITHUB_ENV
          echo "CXX=g++-13" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup

      - name: Detect changed C++ files (PR only)
        if: github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@v44
        with:
          # Track compilation units only: standalone headers can't be analysed
          # by clang-tidy without their compile flags and would false-fail, so
          # they are linted transitively via HeaderFilterRegex when their owning
          # TU is processed (and always covered by the cppcheck step).
          files: |
            **/*.cpp
            **/*.cc
          files_ignore: |
            build_root/**
            _deps/**
            cpm_cache/**
            3rdparty/**
            website/**

      - name: Configure (generate compile_commands.json)
        shell: bash
        run: |
          rm -rf "$KLOGG_BUILD_ROOT"
          cmake -S "$KLOGG_WORKSPACE" -B "$KLOGG_BUILD_ROOT" -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKLOGG_BUILD_TESTS=ON \
            -DKLOGG_USE_VECTORSCAN=ON \
            -DKLOGG_USE_LTO=OFF \
            -DKLOGG_USE_SENTRY=OFF \
            -DKLOGG_GENERIC_CPU=ON \
            -DCPM_SOURCE_CACHE="$KLOGG_WORKSPACE/cpm_cache" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build clang-tidy target list
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: lint exactly the changed C/C++ files (gate against new issues).
            : > tidy_files.txt
            for f in ${{ steps.changed.outputs.all_changed_files }}; do
              [ -f "$f" ] && printf '%s\n' "$f" >> tidy_files.txt
            done
            n=$(wc -l < tidy_files.txt)
            if [ "$n" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No changed C/C++ source files; skipping clang-tidy."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "clang-tidy: $n changed file(s)."
            fi
          else
            # push-to-master / workflow_dispatch: audit all of src/.
            echo "skip=false" >> "$GITHUB_OUTPUT"
            find src -type f \( -name '*.cpp' -o -name '*.cc' \) | sort > tidy_files.txt
            echo "clang-tidy: full src/ audit, $(wc -l < tidy_files.txt) file(s)."
          fi

      - name: Run clang-tidy (--warnings-as-errors)
        if: steps.targets.outputs.skip != 'true'
        shell: bash
        run: |
          set -u
          # clang-tidy is invoked directly (not via the run-clang-tidy wrapper)
          # so we can (a) reliably pass --extra-arg=-Wno-unknown-warning-option
          # to absorb gcc-specific -W flags carried in compile_commands.json,
          # (b) feed an explicit list of compilation units, and (c) propagate a
          # deterministic exit code. Headers are linted transitively via the
          # .clang-tidy HeaderFilterRegex when included by a processed TU.
          # --warnings-as-errors='*' fails the step on any enabled finding
          # (fast-fail gate); checks come from .clang-tidy at the repo root.
          any_fail=0
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Small changed set -> sequential is fine and keeps log readable.
            while IFS= read -r f; do
              [ -n "$f" ] && [ -f "$f" ] || continue
              echo "::group::clang-tidy $f"
              if ! clang-tidy -p "$KLOGG_BUILD_ROOT" --warnings-as-errors='*' \
                   --extra-arg=-Wno-unknown-warning-option "$f"; then
                any_fail=1
              fi
              echo "::endgroup::"
            done < tidy_files.txt
          else
            # Full src/ audit -> parallelise across cores.
            export KLOGG_BUILD_ROOT
            xargs -P "$(nproc)" -I{} bash -c '
              clang-tidy -p "$KLOGG_BUILD_ROOT" --warnings-as-errors="*" \
                --extra-arg=-Wno-unknown-warning-option "{}" || exit 1
            ' < tidy_files.txt || any_fail=1
          fi
          exit "$any_fail"

      - name: Run cppcheck (warning+style over src/)
        shell: bash
        run: |
          set -u
          # cppcheck's -i does NOT exclude paths when --project is used (the JSON
          # database pins the exact TU set), so first filter compile_commands.json
          # down to first-party src/ TUs, dropping cpm_cache / _deps / build_root
          # autogen / tests / benchmarks / 3rdparty.  The --suppress flags below
          # seed the ratchet baseline: the first four drop cppcheck's
          # Qt/preprocessor false positives (tool limitations, not code defects);
          # the rest mask pre-existing style/perf findings in src/ so the gate is
          # green on day one and catches *new* issues. Delete a --suppress line
          # to start enforcing that check (fix the findings or mark them with
          # // cppcheck-suppress first).
          python3 -c "import json,os,sys; src=os.path.abspath(os.path.join(os.getcwd(),'src'))+os.sep; db=json.load(open(sys.argv[1])); g=lambda e: e['file'] if 'file' in e else (e.get('files') or [''])[0]; kept=[e for e in db if g(e).startswith(src)]; json.dump(kept, open(sys.argv[2],'w')); print(f'cppcheck: {len(kept)}/{len(db)} first-party src/ TUs')" "$KLOGG_BUILD_ROOT/compile_commands.json" /tmp/cc_src.json

          cppcheck \
            --project=/tmp/cc_src.json \
            --enable=warning,style \
            --error-exitcode=1 \
            --inline-suppr \
            --quiet \
            --suppress=missingInclude \
            --suppress=syntaxError \
            --suppress=unknownMacro \
            --suppress=preprocessorErrorDirective \
            --suppress=functionStatic \
            --suppress=noExplicitConstructor \
            --suppress=returnByReference \
            --suppress=constParameterPointer \
            --suppress=constParameterReference \
            --suppress=constVariable \
            --suppress=shadowFunction \
            --suppress=variableScope \
            --suppress=unreadVariable \
            --suppress=assignBoolToFloat \
            --suppress=useStlAlgorithm \
            --suppress=useInitializationList \
            --suppress=missingOverride
