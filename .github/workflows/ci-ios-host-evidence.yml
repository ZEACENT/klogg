name: iOS Host Tool Evidence (unreviewed)

on:
  workflow_call:
    inputs:
      expected-source-sha:
        description: Exact PR branch commit used only for read-only host diagnostics
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-host-evidence-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  Source:
    name: Verify source and prefetch locked iOS archives
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected-source-sha }}
          persist-credentials: false
      - name: Validate exact diagnostic source
        shell: bash
        env:
          KLOGG_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          source = os.environ['KLOGG_EXPECTED_SOURCE_SHA']
          if (os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
                  or os.environ['GITHUB_REPOSITORY'] != 'ZEACENT/klogg'
                  or not os.environ['GITHUB_REF'].startswith('refs/heads/')
                  or os.environ['GITHUB_REF'] in ('refs/heads/master', 'refs/heads/main')
                  or re.fullmatch('[0-9a-f]{40}', source) is None
                  or source == '0' * 40
                  or source != os.environ['GITHUB_SHA']
                  or source != subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()):
              raise SystemExit('iOS host diagnostics require the exact canonical PR branch source')
          PY
      - name: Fetch exact locked iOS source archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefetch_ios_native_sources.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --output "${{ github.workspace }}/ios-native-sources"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-source-cache
          path: ${{ github.workspace }}/ios-native-sources/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  IosIntel:
    name: Unreviewed iOS host diagnostic x86_64
    needs: [Source]
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      KLOGG_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      KLOGG_IOS_ARCHITECTURE: x86_64
    steps: &ios_evidence_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected-source-sha }}
          persist-credentials: false
      - name: Initialize incomplete host diagnostic
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$KLOGG_EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          python3 scripts/ci_ios_host_evidence.py \
            --target-id "ios-${KLOGG_IOS_ARCHITECTURE}" \
            --output "${{ runner.temp }}/ios-host-evidence-${KLOGG_IOS_ARCHITECTURE}.json" \
            --stub
      - name: Select exact diagnostic source and Xcode
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$KLOGG_EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version)" = $'Xcode 26.6\nBuild version 17F113'
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Install iOS source-build tools for diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          if brew list --formula aws-sam-cli >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies aws-sam-cli || true
          fi
          if brew tap | grep -Fx aws/tap >/dev/null; then
            brew untap aws/tap
          fi
          brew install autoconf automake libtool pkg-config
      - name: Install pinned CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1
      - name: Verify Xcode and compiler identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_dependency_toolchain.py --target-id "ios-${KLOGG_IOS_ARCHITECTURE}"
      - name: Probe unreviewed host observation capability
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_ios_host_evidence.py \
            --target-id "ios-${KLOGG_IOS_ARCHITECTURE}" \
            --output "${{ runner.temp }}/ios-host-evidence-${KLOGG_IOS_ARCHITECTURE}.json" \
            --preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-native-source-cache
          path: ${{ github.workspace }}/ios-native-sources
      - name: Build actual disconnected iOS stack for observation
        shell: bash
        run: |
          set -euo pipefail
          stack_root="${{ runner.temp }}/ios-native-stack"
          python3 scripts/build_ios_native_stack.py \
            --repository-root "${{ github.workspace }}" \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --archive-root "${{ github.workspace }}/ios-native-sources" \
            --work-root "${{ runner.temp }}/ios-native-work" \
            --artifact-root "$stack_root" \
            --architecture "$KLOGG_IOS_ARCHITECTURE" \
            --parallel "$(sysctl -n hw.ncpu)"
          python3 scripts/verify_ios_native_stack.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --stack-root "$stack_root" \
            --architecture "$KLOGG_IOS_ARCHITECTURE" \
            --receipt "$stack_root/ios-native-build-receipt.json"
      - name: Record incomplete host-input closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_ios_host_evidence.py \
            --target-id "ios-${KLOGG_IOS_ARCHITECTURE}" \
            --output "${{ runner.temp }}/ios-host-evidence-${KLOGG_IOS_ARCHITECTURE}.json" \
            --post-build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: ios-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.KLOGG_IOS_ARCHITECTURE }}
          path: ${{ runner.temp }}/ios-host-evidence-${{ env.KLOGG_IOS_ARCHITECTURE }}.json
          if-no-files-found: error
          retention-days: 7

  IosArm:
    name: Unreviewed iOS host diagnostic arm64
    needs: [Source]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      KLOGG_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
      KLOGG_IOS_ARCHITECTURE: arm64
    steps: *ios_evidence_steps
