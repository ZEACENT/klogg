name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  PlatformFragilePreflight:
    name: "Platform-fragile preflight"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.8'
      - name: Run narrow platform-fragile lint
        run: python3 scripts/lint_platform_fragile.py --paths src tests

  ResolveLinuxEnvironment:
    name: "Resolve locked analysis environment"
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: prepare
        uses: ./.github/actions/prepare-linux-environment
        with:
          family: noble-qt693-analysis
          pull: "false"
          retag: "false"

  analyze:
    needs: [PlatformFragilePreflight, ResolveLinuxEnvironment]
    name: Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ needs.ResolveLinuxEnvironment.outputs.image }}
    permissions:
      contents: read
      security-events: write
    env:
      # CodeQL's remotely enabled overlay experiment supports only build-mode:none.
      # Disable it explicitly so the required traced CMake build remains warning-free
      # and continues to cover generated MOC/RCC units and configuration branches.
      CODEQL_ACTION_OVERLAY_ANALYSIS: "false"
      CODEQL_ACTION_OVERLAY_ANALYSIS_CODE_SCANNING_CPP: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The container runs as root while the mounted workspace stays owned by
      # the runner user; raw git commands fail closed without this exception.
      - name: Trust the workspace for Git inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore CPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: CPM-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake', '3rdparty/patches/**', 'cmake/prefetch_cpm/CMakeLists.txt') }}

      - name: Populate CPM source cache
        uses: ./.github/actions/prefetch-cpm-cache
        env:
          KLOGG_WORKSPACE: ${{ github.workspace }}

      - name: Fetch the pinned official CodeQL bundle
        id: codeql-bundle
        shell: bash
        run: |
          python3 scripts/fetch_codeql_bundle.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/klogg-codeql" \
            --github-output "$GITHUB_OUTPUT"

      - name: Configure traced build
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DKLOGG_GENERIC_CPU=ON \
            -DKLOGG_USE_SENTRY=OFF \
            -DKLOGG_USE_VECTORSCAN=OFF \
            -DCPM_SOURCE_CACHE="$GITHUB_WORKSPACE/cpm_cache" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Prebuild vendored dependencies outside CodeQL tracing
        run: cmake --build build -t klogg_codeql_thirdparty

      - name: Verify traced build contains only first-party work
        run: |
          cmake --build build -t klogg -- -n > /tmp/codeql-traced-plan.txt
          if grep -E 'cpm_cache|_deps|3rdparty/CMakeFiles' /tmp/codeql-traced-plan.txt; then
            echo "::error::vendored compile work remains after CodeQL dependency prebuild"
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: c-cpp
          build-mode: manual
          tools: ${{ steps.codeql-bundle.outputs.bundle }}

      - name: Build traced application
        run: cmake --build build -t klogg

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
