name: "Coverage"

# Per-PR line/branch coverage ratchet.  Builds the test targets with
# -DENABLE_COVERAGE=ON (gcc --coverage), runs ctest, then uses gcovr to
# measure line and branch coverage over src/.  The measured percentages are
# compared against the floors in .github/baselines/coverage-{line,branch}.txt
# and the job fails if either drops below its floor (ratchet-up only).  The
# floors are seeded from a successful full run and may only move upward after
# measured coverage has genuinely risen.  An HTML + JSON report is
# uploaded as an artifact for offline review.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PlatformFragilePreflight:
    name: "Platform-fragile preflight"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.8'
      - name: Run narrow platform-fragile lint
        run: python3 scripts/lint_platform_fragile.py --paths src tests

  ResolveLinuxEnvironment:
    name: "Resolve locked analysis environment"
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: prepare
        uses: ./.github/actions/prepare-linux-environment
        with:
          family: noble-qt693-analysis
          pull: "false"
          retag: "false"

  coverage:
    needs: [PlatformFragilePreflight, ResolveLinuxEnvironment]
    name: "Line/branch coverage ratchet"
    runs-on: ubuntu-24.04
    # Historical full-run ceiling is ~22 min (cold cache); 45 min leaves
    # headroom while bounding runner-side hangs that would otherwise sit
    # in_progress forever.
    timeout-minutes: 45
    container:
      image: ${{ needs.ResolveLinuxEnvironment.outputs.image }}
      options: --init
    env:
      KLOGG_WORKSPACE: ${{ github.workspace }}
      KLOGG_BUILD_ROOT: build_root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The container runs as root while the mounted workspace stays owned by
      # the runner user; raw git commands fail closed without this exception.
      - name: Trust the workspace for Git inside the container
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore CPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: CPM-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake', '3rdparty/patches/**', 'cmake/prefetch_cpm/CMakeLists.txt') }}

      - name: Populate CPM source cache
        uses: ./.github/actions/prefetch-cpm-cache
        env:
          KLOGG_WORKSPACE: ${{ github.workspace }}

      - name: Acquire private coverage source and build namespace
        shell: bash
        run: |
          set -euo pipefail
          # gcovr requires the build beneath its source root. Copy the exact
          # detached/merge checkout, not the repository's default branch. Both
          # live beneath a retained private parent outside the runner mount.
          private_parent=$(mktemp -d /tmp/klogg-analysis.XXXXXXXX)
          source_root=$(cd "$GITHUB_WORKSPACE" && pwd -P)
          source_head=$(git -C "$source_root" rev-parse --verify HEAD)
          # Local clone checks the foreign source git directory separately from
          # the worktree. This trust is exact and confined to this job container.
          git config --global --add safe.directory "$source_root/.git"
          git clone --no-hardlinks --no-checkout -- "$source_root" "$private_parent/source"
          test ! -e "$private_parent/source/.git/objects/info/alternates"
          test ! -L "$private_parent/source/.git/objects/info/alternates"
          git -C "$private_parent/source" checkout --detach "$source_head"
          test "$(git -C "$private_parent/source" rev-parse --verify HEAD)" = "$source_head"
          test "$(git -C "$source_root" rev-parse --verify HEAD)" = "$source_head"
          printf 'KLOGG_WORKSPACE=%s/source\nKLOGG_BUILD_ROOT=%s/source/build_root\n' \
            "$private_parent" "$private_parent" >> "$GITHUB_ENV"
          printf 'KLOGG_CPM_SOURCE_CACHE=%s/cpm_cache\n' "$source_root" >> "$GITHUB_ENV"

      - name: Configure (Debug + coverage)
        shell: bash
        run: |
          rm -rf "$KLOGG_BUILD_ROOT"
          mkdir -p "$KLOGG_BUILD_ROOT"
          cd "$KLOGG_BUILD_ROOT"
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKLOGG_BUILD_TESTS=ON \
            -DENABLE_COVERAGE=ON \
            -DKLOGG_USE_VECTORSCAN=OFF \
            -DKLOGG_USE_LTO=OFF \
            -DKLOGG_OVERRIDE_MALLOC=OFF \
            -DCPM_SOURCE_CACHE="$KLOGG_CPM_SOURCE_CACHE" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "$KLOGG_WORKSPACE"

      - name: Build tests
        shell: bash
        run: |
          cmake --build "$KLOGG_BUILD_ROOT" -t klogg klogg_grep klogg_test_build -j"$(nproc)"

      - name: Run tests
        shell: bash
        run: |
          cd "$KLOGG_BUILD_ROOT"
          ctest --output-on-failure --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Generate coverage report
        shell: bash
        working-directory: ${{ env.KLOGG_WORKSPACE }}
        run: |
          set -euo pipefail
          # Explicit relative filters use CWD, not --root. Select the private
          # checkout's src/ while retaining the original upload/ratchet context.
          mkdir -p coverage_report
          # HTML report (primary, human-readable) + textual summary in one pass.
          # --print-summary writes to stdout while -o directs the HTML output.
          gcovr \
            --root "$KLOGG_WORKSPACE" \
            --filter '^src/' \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --html-details \
            --html-self-contained \
            --html-title "Klogg line/branch coverage" \
            -o coverage_report/index.html \
            --print-summary "$KLOGG_BUILD_ROOT" \
            | tee coverage_report/summary.txt

          # Machine-readable companion to the authoritative summary. Keep this
          # fail-closed too: malformed or missing first-party gcov data must not
          # disappear from either report without failing the gate.
          gcovr \
            --root "$KLOGG_WORKSPACE" \
            --filter '^src/' \
            --gcov-ignore-parse-errors negative_hits.warn_once_per_file \
            --json --json-pretty \
            -o coverage_report/coverage.json \
            "$KLOGG_BUILD_ROOT"

          echo "=== gcovr summary ==="
          cat coverage_report/summary.txt
          cp -R coverage_report "$GITHUB_WORKSPACE/"

      - name: Enforce coverage ratchet
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA" ;;
            push) base_sha="$PUSH_BASE_SHA" ;;
            workflow_dispatch) base_sha=$(git rev-parse HEAD^ 2>/dev/null || true) ;;
            *) echo "::error::unsupported coverage ratchet event: $EVENT_NAME"; exit 1 ;;
          esac

          if [ -z "$base_sha" ] || [[ "$base_sha" =~ ^0+$ ]]; then
            echo "::error::coverage ratchet base is unavailable for $EVENT_NAME"
            exit 1
          fi
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base_sha"
          fi
          if ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "::error::coverage ratchet base commit $base_sha is unavailable"
            exit 1
          fi

          args=(
            --summary coverage_report/summary.txt
            --line-floor .github/baselines/coverage-line.txt
            --branch-floor .github/baselines/coverage-branch.txt
          )
          args+=(--base-sha "$base_sha")
          python3 scripts/enforce_coverage_ratchet.py "${args[@]}"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage_report/
          if-no-files-found: warn
