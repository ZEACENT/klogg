name: "CI Build"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'website/**'
      - BUILD.md
      - CODE_OF_CONDUCT.md
      - CONTRIBUTING.md
      - README.md
      - .gitignore
  workflow_dispatch:
    inputs:
      qualification-mode:
        description: Secret-neutral validation, or explicit signed/notarized release qualification
        required: true
        default: validation
        type: choice
        options:
          - validation
          - release
      environment-mode:
        description: Run ordinary application CI, qualify environments, or qualify and publish environments
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - qualify
          - publish
      dependency-mode:
        description: Isolated native qualification, host evidence observation, or fail-closed publish validation
        required: true
        default: "off"
        type: choice
        options:
          - "off"
          - qualify
          - publish
          - observe-ios-host
      expected-source-sha:
        description: Exact dispatched commit required for producer modes
        required: false
        default: ""
        type: string
      analysis-base-sha:
        description: Explicit ancestor commit for environment static-analysis qualification
        required: false
        default: ""
        type: string
      prior-source-run-id:
        description: Explicit earlier source-cache run ID for environment fixture only
        required: false
        default: ""
        type: string
      prior-source-artifact-id:
        description: Exact earlier source-cache artifact ID for environment fixture only
        required: false
        default: ""
        type: string
      prior-source-run-attempt:
        description: Explicit earlier source-cache run attempt for environment fixture only
        required: false
        default: ""
        type: string
      prior-source-sha:
        description: Explicit earlier source-cache commit SHA for environment fixture only
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Release qualification must not share a queue with ordinary master pushes.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'validation' && inputs.environment-mode == 'off' && inputs.dependency-mode == 'off') }}

env:
  KLOGG_CI_IMAGE_PREFIX: zeacent/klogg

jobs:
  DependencyModePreflight:
    name: "Native dependency dispatch preflight"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # A skipped ancestor makes ordinary descendants skip even when their direct needs pass.
      - name: Reject prior environment source inputs outside producer dispatch
        shell: bash
        env:
          KLOGG_ENVIRONMENT_MODE: ${{ inputs.environment-mode }}
          KLOGG_DEPENDENCY_MODE: ${{ inputs.dependency-mode }}
          KLOGG_PRIOR_SOURCE_RUN_ID: ${{ inputs.prior-source-run-id }}
          KLOGG_PRIOR_SOURCE_ARTIFACT_ID: ${{ inputs.prior-source-artifact-id }}
          KLOGG_PRIOR_SOURCE_RUN_ATTEMPT: ${{ inputs.prior-source-run-attempt }}
          KLOGG_PRIOR_SOURCE_SHA: ${{ inputs.prior-source-sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          prior = ('KLOGG_PRIOR_SOURCE_RUN_ID', 'KLOGG_PRIOR_SOURCE_ARTIFACT_ID',
                   'KLOGG_PRIOR_SOURCE_RUN_ATTEMPT', 'KLOGG_PRIOR_SOURCE_SHA')
          producer = (os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                      and os.environ['KLOGG_ENVIRONMENT_MODE'] in ('qualify', 'publish')
                      and os.environ['KLOGG_DEPENDENCY_MODE'] == 'off')
          if not producer and any(os.environ[name] for name in prior):
              raise SystemExit('prior source inputs are restricted to environment producer dispatch')
          PY
      - name: Inactive native dependency preflight
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dependency-mode == 'off' }}
        run: ':'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency-mode != 'off' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate isolated dependency mode and exact source
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency-mode != 'off' }}
        shell: bash
        env:
          KLOGG_DEPENDENCY_MODE: ${{ inputs.dependency-mode }}
          KLOGG_ENVIRONMENT_MODE: ${{ inputs.environment-mode }}
          KLOGG_QUALIFICATION_MODE: ${{ inputs.qualification-mode }}
          KLOGG_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          if os.environ['KLOGG_DEPENDENCY_MODE'] not in ('qualify', 'publish', 'observe-ios-host'):
              raise SystemExit('unsupported native dependency dispatch mode')
          if (os.environ['KLOGG_DEPENDENCY_MODE'] == 'observe-ios-host'
                  and os.environ['GITHUB_REF'] in ('refs/heads/master', 'refs/heads/main')):
              raise SystemExit('iOS host observation requires a non-default branch')
          if os.environ['KLOGG_ENVIRONMENT_MODE'] != 'off':
              raise SystemExit('dependency-mode cannot combine with environment-mode')
          if os.environ['KLOGG_QUALIFICATION_MODE'] != 'validation':
              raise SystemExit('dependency-mode cannot combine with release qualification')
          if os.environ['GITHUB_REPOSITORY'] != 'ZEACENT/klogg' or not os.environ['GITHUB_REF'].startswith('refs/heads/'):
              raise SystemExit('dependency production requires a canonical repository branch')
          source = os.environ['KLOGG_EXPECTED_SOURCE_SHA']
          if not re.fullmatch('[0-9a-f]{40}', source) or source == '0' * 40:
              raise SystemExit('expected-source-sha must be an explicit nonzero full commit SHA')
          if source != os.environ['GITHUB_SHA']:
              raise SystemExit('dispatched source does not match expected-source-sha')
          PY
          test "$(git rev-parse HEAD)" = "$KLOGG_EXPECTED_SOURCE_SHA"

  IosHostEvidence:
    name: Unreviewed iOS host evidence
    needs: [DependencyModePreflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency-mode == 'observe-ios-host' && needs.DependencyModePreflight.result == 'success' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-ios-host-evidence.yml
    with:
      expected-source-sha: ${{ inputs.expected-source-sha }}

  EnvironmentModePreflight:
    name: "Environment producer dispatch preflight"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && inputs.dependency-mode == 'off' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate isolated producer mode and exact source
        shell: bash
        env:
          KLOGG_ENVIRONMENT_MODE: ${{ inputs.environment-mode }}
          KLOGG_QUALIFICATION_MODE: ${{ inputs.qualification-mode }}
          KLOGG_EXPECTED_SOURCE_SHA: ${{ inputs.expected-source-sha }}
          KLOGG_ANALYSIS_BASE_SHA: ${{ inputs.analysis-base-sha }}
          KLOGG_PRIOR_SOURCE_RUN_ID: ${{ inputs.prior-source-run-id }}
          KLOGG_PRIOR_SOURCE_ARTIFACT_ID: ${{ inputs.prior-source-artifact-id }}
          KLOGG_PRIOR_SOURCE_RUN_ATTEMPT: ${{ inputs.prior-source-run-attempt }}
          KLOGG_PRIOR_SOURCE_SHA: ${{ inputs.prior-source-sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          if os.environ['KLOGG_ENVIRONMENT_MODE'] not in ('qualify', 'publish'):
              raise SystemExit('environment-mode must be off, qualify, or publish')
          if os.environ['KLOGG_QUALIFICATION_MODE'] != 'validation':
              raise SystemExit('environment producer modes cannot combine with release qualification')
          if os.environ['GITHUB_REPOSITORY'] != 'ZEACENT/klogg' or not os.environ['GITHUB_REF'].startswith('refs/heads/'):
              raise SystemExit('environment production requires a canonical repository branch')
          for key in ('KLOGG_EXPECTED_SOURCE_SHA', 'KLOGG_ANALYSIS_BASE_SHA'):
              value = os.environ[key]
              if not re.fullmatch('[0-9a-f]{40}', value) or value == '0' * 40:
                  raise SystemExit(key + ' must be an explicit nonzero full commit SHA')
          if os.environ['KLOGG_EXPECTED_SOURCE_SHA'] != os.environ['GITHUB_SHA']:
              raise SystemExit('dispatched source does not match expected-source-sha')
          if os.environ['KLOGG_ANALYSIS_BASE_SHA'] == os.environ['GITHUB_SHA']:
              raise SystemExit('analysis base must precede the qualification source')
          prior = ('KLOGG_PRIOR_SOURCE_RUN_ID', 'KLOGG_PRIOR_SOURCE_ARTIFACT_ID',
                   'KLOGG_PRIOR_SOURCE_RUN_ATTEMPT', 'KLOGG_PRIOR_SOURCE_SHA')
          values = [os.environ[key] for key in prior]
          if any(values) and not all(values):
              raise SystemExit('prior source inputs must be all-or-none')
          if all(values):
              if any(not re.fullmatch('[1-9][0-9]*', value) for value in values[:3]):
                  raise SystemExit('prior source run, artifact and attempt IDs must be positive decimal strings')
              if not re.fullmatch('[0-9a-f]{40}', values[3]) or values[3] in ('0' * 40, os.environ['GITHUB_SHA']):
                  raise SystemExit('prior source SHA must be an earlier nonzero full commit SHA')
          PY
          test "$(git rev-parse HEAD)" = "$KLOGG_EXPECTED_SOURCE_SHA"
          git cat-file -e "$KLOGG_ANALYSIS_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$KLOGG_ANALYSIS_BASE_SHA" "$KLOGG_EXPECTED_SOURCE_SHA"

  EnvironmentProducer:
    name: "Environment producer pipeline"
    needs: [EnvironmentModePreflight]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency-mode == 'off' && (inputs.environment-mode == 'qualify' || inputs.environment-mode == 'publish') }}
    # This is a reusable-workflow permission ceiling, not an executable build job.
    # The child grants writes only to isolated SARIF upload and protected publish.
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/ci-environments.yml
    with:
      mode: ${{ inputs.environment-mode }}
      expected-source-sha: ${{ inputs.expected-source-sha }}
      analysis-base-sha: ${{ inputs.analysis-base-sha }}
      prior-source-run-id: ${{ inputs.prior-source-run-id }}
      prior-source-artifact-id: ${{ inputs.prior-source-artifact-id }}
      prior-source-run-attempt: ${{ inputs.prior-source-run-attempt }}
      prior-source-sha: ${{ inputs.prior-source-sha }}

  DependencyGate:
    name: "Native dependency qualification gate"
    needs: [DependencyModePreflight, BuildAdbHelperLegalAssets, BuildAdbLinuxX64, BuildAdbLinuxArm64, BuildAdbWindowsX64, BuildAdbMacX64, BuildAdbMacArm64, BuildIosNativeX64, BuildIosNativeArm64]
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') }}
    permissions:
      contents: read
      actions: read
      attestations: read
    uses: ./.github/workflows/ci-dependencies.yml
    with:
      mode: ${{ inputs.dependency-mode }}
      expected-source-sha: ${{ inputs.expected-source-sha }}
      needs-json: ${{ toJSON(needs) }}

  ReleaseQualificationPreflight:
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Release and platform-fragile preflight"
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.8'
      - name: Run narrow platform-fragile lint
        run: python3 scripts/lint_platform_fragile.py
      - name: Verify macOS upload and diagnostics contracts
        run: python3 tests/scripts/test_ci_release_artifact_upload.py
      - name: Verify release qualification inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release' }}
        shell: bash
        env:
          KLOGG_P12_FILE_BASE64: ${{ secrets.CODESIGN_BASE64 }}
          KLOGG_P12_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          KLOGG_CODESIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          KLOGG_NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
          KLOGG_NOTARIZATION_TEAM: ${{ secrets.NOTARIZATION_TEAM }}
          KLOGG_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master" || {
            echo "::error::Signed release qualification must run from master"
            exit 1
          }
          missing=0
          for name in \
            KLOGG_P12_FILE_BASE64 \
            KLOGG_P12_PASSWORD \
            KLOGG_CODESIGN_IDENTITY \
            KLOGG_NOTARIZATION_USERNAME \
            KLOGG_NOTARIZATION_TEAM \
            KLOGG_NOTARIZATION_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release qualification secret: $name"
              missing=1
            fi
          done
          test "$missing" -eq 0

  SaveVersion:
    needs: [DependencyModePreflight]
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}Resolve build version"
    if: ${{ !cancelled() && ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') && needs.DependencyModePreflight.result == 'success')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-22.04
    outputs:
      klogg_version: ${{ steps.save-version.outputs.klogg_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/klogg-version

      - name: Save version
        id: save-version
        shell: sh
        run: |
          echo "klogg_version=$KLOGG_VERSION" >> "$GITHUB_OUTPUT"
          echo "$KLOGG_VERSION" > klogg_version.txt
          echo "$GITHUB_SHA" > klogg_commit.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: klogg_version
          path: |
            klogg_version.txt
            klogg_commit.txt
          if-no-files-found: error

  PrefetchCpmCache:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Prefetch CPM cache"
    runs-on: ubuntu-22.04
    env:
      KLOGG_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore shared CPM cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/cpm_cache
          key: CPM-${{ hashFiles('3rdparty/CMakeLists.txt', 'cmake/CPM.cmake', '3rdparty/patches/**', 'cmake/prefetch_cpm/CMakeLists.txt') }}

      - uses: ./.github/actions/prefetch-cpm-cache

      - name: Archive shared CPM cache
        shell: bash
        run: |
          tar -czf "$KLOGG_WORKSPACE/cpm-cache.tar.gz" \
            -C "$KLOGG_WORKSPACE" cpm_cache

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpm-cache
          path: cpm-cache.tar.gz
          if-no-files-found: error
          compression-level: 0

  PrefetchBoost:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Prefetch Boost"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore Boost source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/prefetch_artifacts/boost_1_86_0.tar.bz2
          key: boost-source-${{ hashFiles('ci/environments/materials.json') }}

      - name: Prefetch and verify Boost source archive
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_boost.py \
            --archive "$GITHUB_WORKSPACE/prefetch_artifacts/boost_1_86_0.tar.bz2" \
            --verify-only

      # A single original archive avoids the ~200k-file zip64 artifact flake.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boost-root
          path: prefetch_artifacts/boost_1_86_0.tar.bz2
          if-no-files-found: error

  PrefetchOpenSsl:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Prefetch Windows Qt 5 OpenSSL"
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore OpenSSL prefetch cache
        id: cache-openssl-prefetch
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/prefetch_artifacts/openssl.zip
          key: openssl-qt5-verified-v1-${{ hashFiles('ci/tools/openssl-qt5.json') }}

      - name: Validate restored OpenSSL archive or genuine absence
        id: verify-openssl-cache
        shell: bash
        env:
          KLOGG_OPENSSL_CACHE_HIT: ${{ steps.cache-openssl-prefetch.outputs.cache-hit }}
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/prefetch_artifacts/openssl.zip"
          case "$KLOGG_OPENSSL_CACHE_HIT" in
            true|false|"") ;;
            *) echo "::error::Unexpected OpenSSL cache-hit value"; exit 1 ;;
          esac
          if [[ "$KLOGG_OPENSSL_CACHE_HIT" == "true" || -e "$archive" || -L "$archive" ]]; then
            python3 scripts/materialize_openssl.py --lock ci/tools/openssl-qt5.json --archive "$archive" --verify-only
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire locked OpenSSL archive on genuine miss
        if: ${{ steps.verify-openssl-cache.outputs.missing == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/prefetch_artifacts"
          python3 scripts/materialize_openssl.py --lock ci/tools/openssl-qt5.json --archive "$GITHUB_WORKSPACE/prefetch_artifacts/openssl.zip" --acquire

      - name: Verify complete OpenSSL archive before publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_openssl.py --lock ci/tools/openssl-qt5.json --archive "$GITHUB_WORKSPACE/prefetch_artifacts/openssl.zip" --verify-only

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openssl-archive
          path: ${{ github.workspace }}/prefetch_artifacts/openssl.zip
          if-no-files-found: error

      - name: Save verified OpenSSL prefetch cache
        if: ${{ steps.cache-openssl-prefetch.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/prefetch_artifacts/openssl.zip
          key: openssl-qt5-verified-v1-${{ hashFiles('ci/tools/openssl-qt5.json') }}

  PrefetchLinuxDeployQt:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Prefetch linuxdeployqt"
    runs-on: ubuntu-22.04
    env:
      KLOGG_WORKSPACE: ${{ github.workspace }}
    steps:
      - name: Prefetch linuxdeployqt artifact
        shell: sh
        run: |
          PREFETCH_ROOT="$KLOGG_WORKSPACE/prefetch_artifacts"
          LINUXDEPLOYQT="$PREFETCH_ROOT/linuxdeployqt-continuous-x86_64.AppImage"
          LINUXDEPLOYQT_URL="https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"

          mkdir -p "$PREFETCH_ROOT"

          attempt=1
          max_attempts=3
          while [ $attempt -le $max_attempts ]; do
            rm -f "$LINUXDEPLOYQT"

            if curl --fail --retry 3 --retry-delay 10 --progress-bar --location \
              --output "$LINUXDEPLOYQT" "$LINUXDEPLOYQT_URL"; then
              if file "$LINUXDEPLOYQT" | grep -q "ELF"; then
                chmod +x "$LINUXDEPLOYQT"
                exit 0
              fi
              echo "Downloaded file is not a valid ELF/AppImage binary, retrying..."
              rm -f "$LINUXDEPLOYQT"
            fi

            if [ $attempt -eq $max_attempts ]; then
              echo "::error::Failed to download linuxdeployqt after $max_attempts attempts"
              exit 1
            fi

            echo "linuxdeployqt prefetch attempt $attempt failed, retrying after backoff..."
            attempt=$((attempt + 1))
            sleep $((attempt * 10))
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linuxdeployqt
          path: prefetch_artifacts/linuxdeployqt-continuous-x86_64.AppImage
          if-no-files-found: error

  PrefetchWindowsTools:
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Prefetch Windows MSYS2 tools"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore pinned MSYS2 package archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: prefetch_artifacts/msys2-packages
          key: msys2-mingw64-tools-${{ hashFiles('ci/tools/msys2-tools.json') }}

      - name: Download, validate and bundle pinned MSYS2 tools
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_windows_tools.py \
            --lock ci/tools/msys2-tools.json \
            --cache prefetch_artifacts/msys2-packages \
            --archive prefetch_artifacts/msys2-tools.zip

      - name: Verify bundled native Windows tools
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_windows_tools.py \
            --lock ci/tools/msys2-tools.json \
            --extract-artifact --require-prefetched \
            --archive prefetch_artifacts/msys2-tools.zip \
            --destination "$RUNNER_TEMP/verified-msys2-tools"

      - name: Smoke-test locked Windows executables
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP "verified-msys2-tools\msys64\mingw64\bin"
          & (Join-Path $bin "ragel.exe") -v
          if ($LASTEXITCODE -ne 0) { throw "Ragel failed to run from the locked tool closure" }
          & (Join-Path $bin "pkg-config.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "pkg-config failed to run from the locked tool closure" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msys2-tools
          path: prefetch_artifacts/msys2-tools.zip
          if-no-files-found: error

  PrefetchAdbHelperSources:
    needs: [DependencyModePreflight]
    if: ${{ !cancelled() && ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') && needs.DependencyModePreflight.result == 'success')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}Prefetch locked ADB helper source closure"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      KLOGG_ADB_SOURCE_CACHE_MAX_BYTES: 536870912
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compute exact ADB source cache key
        id: adb-cache-key
        shell: bash
        run: >-
          echo "key=adb-helper-sources-v2-${{ hashFiles('packaging/adb/adb-helper.lock.json', 'scripts/prefetch_adb_helper_sources.py', 'scripts/prefetch_adb_manifest_fallback.py', 'scripts/prefetch_adb_libusb_fallback.py', 'scripts/prefetch_adb_source_closure.py') }}"
          >> "$GITHUB_OUTPUT"

      - name: Restore exact locked ADB source closure
        id: cache-adb-sources
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: prefetch_artifacts/adb-helper-sources
          key: ${{ steps.adb-cache-key.outputs.key }}
          restore-keys: adb-helper-sources-v1-

      - name: Prefetch and hash immutable ADB sources
        timeout-minutes: 45
        shell: bash
        env:
          KLOGG_ADB_SOURCE_CACHE_EXACT_KEY: ${{ steps.adb-cache-key.outputs.key }}
          KLOGG_ADB_SOURCE_CACHE_MATCHED_KEY: ${{ steps.cache-adb-sources.outputs.cache-matched-key }}
          KLOGG_ADB_SOURCE_CACHE_RESTORE_OUTCOME: ${{ steps.cache-adb-sources.outcome }}
          KLOGG_ADB_SOURCE_EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          adb_source_cache_root="prefetch_artifacts/adb-helper-sources"
          cache_usable=false

          if [[ "$KLOGG_ADB_SOURCE_CACHE_RESTORE_OUTCOME" == "success" &&
                -n "$KLOGG_ADB_SOURCE_CACHE_MATCHED_KEY" ]]; then
            if python3 scripts/prefetch_adb_helper_sources.py \
              --lock packaging/adb/adb-helper.lock.json \
              --download-root "$adb_source_cache_root" \
              --offline \
              --max-cache-bytes "$KLOGG_ADB_SOURCE_CACHE_MAX_BYTES"; then
              cache_usable=true
            else
              if [[ "$KLOGG_ADB_SOURCE_CACHE_MATCHED_KEY" == "$KLOGG_ADB_SOURCE_CACHE_EXACT_KEY" ]]; then
                echo "::error::The exact ADB source cache failed verification; delete the immutable cache entry before retrying"
                exit 1
              fi
              echo "::warning::The restored v1 ADB source cache failed verification; using a fresh local prefetch"
            fi
          elif [[ "$KLOGG_ADB_SOURCE_CACHE_RESTORE_OUTCOME" != "success" ]]; then
            echo "::warning::The ADB source cache service was unavailable; using a fresh local prefetch"
          fi

          if [[ "$cache_usable" != "true" ]]; then
            rm -rf "$adb_source_cache_root"
            transport_status=2
            if [[ "$KLOGG_ADB_SOURCE_EVENT" == "pull_request" || "$KLOGG_ADB_SOURCE_EVENT" == "push" ]]; then
              if python3 scripts/ci_adb_source_transport.py \
                --lock packaging/adb/adb-helper.lock.json \
                --repo-root "$GITHUB_WORKSPACE" \
                --download-root "$adb_source_cache_root"; then
                transport_status=0
              else
                transport_status=$?
              fi
            elif [[ "$KLOGG_ADB_SOURCE_EVENT" != "workflow_dispatch" ]]; then
              echo "::error::Unsupported ADB source prefetch event: $KLOGG_ADB_SOURCE_EVENT"
              exit 1
            fi
            if [[ "$transport_status" -eq 2 ]]; then
              python3 scripts/prefetch_adb_source_closure.py \
                --lock packaging/adb/adb-helper.lock.json \
                --download-root "$adb_source_cache_root" \
                --workers 2 \
                --max-cache-bytes "$KLOGG_ADB_SOURCE_CACHE_MAX_BYTES"
            elif [[ "$transport_status" -eq 0 ]]; then
              python3 scripts/prefetch_adb_helper_sources.py \
                --lock packaging/adb/adb-helper.lock.json \
                --download-root "$adb_source_cache_root" \
                --offline \
                --max-cache-bytes "$KLOGG_ADB_SOURCE_CACHE_MAX_BYTES"
            else
              exit "$transport_status"
            fi
          fi

      - name: Save exact locked ADB source closure
        if: ${{ github.event_name == 'push' && steps.cache-adb-sources.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: prefetch_artifacts/adb-helper-sources
          key: ${{ steps.adb-cache-key.outputs.key }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adb-helper-source-cache
          path: prefetch_artifacts/adb-helper-sources/*
          if-no-files-found: error
          compression-level: 0

  BuildAdbHelperLegalAssets:
    needs: [SaveVersion, PrefetchAdbHelperSources]
    if: ${{ ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish'))) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}Build ADB helper legal assets"
    runs-on: ubuntu-24.04
    outputs:
      support_artifact_id: ${{ steps.upload_adb_support.outputs.artifact-id }}
      full_release_artifact_id: ${{ steps.upload_adb_release.outputs.artifact-id }}
      klogg_version: ${{ needs.SaveVersion.outputs.klogg_version }}
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adb-helper-source-cache
          path: prefetch_artifacts/adb-helper-sources

      - name: Verify source closure and build legal assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefetch_adb_helper_sources.py \
            --lock packaging/adb/adb-helper.lock.json \
            --download-root prefetch_artifacts/adb-helper-sources \
            --offline
          python3 scripts/build_adb_helper_legal_assets.py \
            --lock packaging/adb/adb-helper.lock.json \
            --archive-root prefetch_artifacts/adb-helper-sources \
            --repository-root "$GITHUB_WORKSPACE" \
            --version "$KLOGG_VERSION" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}" \
            --output prefetch_artifacts/adb-helper-release \
            --package-support-output prefetch_artifacts/adb-helper-package-support \
            --package-core-output prefetch_artifacts/adb-helper-package-core

      - name: Upload package-required ADB support assets
        id: upload_adb_support
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adb-helper-package-support
          path: prefetch_artifacts/adb-helper-package-support/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload immutable ADB package core
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adb-helper-package-core
          path: prefetch_artifacts/adb-helper-package-core/*
          if-no-files-found: error
          compression-level: 0

      - name: Upload full ADB release closure for trusted publication
        id: upload_adb_release
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/master' && inputs.qualification-mode == 'release') || (github.repository == 'ZEACENT/klogg' && github.ref_type == 'branch' && inputs.qualification-mode == 'validation' && inputs.environment-mode == 'off' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish')))) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adb-helper-legal-assets
          path: prefetch_artifacts/adb-helper-release/*
          if-no-files-found: error
          compression-level: 0

  BuildAdbLinuxX64:
    needs: [BuildAdbHelperLegalAssets]
    permissions: &artifact_attestation_permissions
      contents: read
      actions: read
      id-token: write
      attestations: write
    if: ${{ ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish'))) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}Source-built ADB helper linux-x86_64"
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate-sha256 }}
      archive_sha256: ${{ steps.candidate.outputs.archive-sha256 }}
      full_artifact_id: ${{ steps.upload_full.outputs.artifact-id }}
    env:
      KLOGG_ADB_HELPER_TARGET: linux-x86_64
      KLOGG_ADB_CONTAINER_IMAGE: quay.io/pypa/manylinux2014_x86_64@sha256:95440e0e72dd3a81dc8d2cf59a84d57af661456620f5bc821ff92048d0e54ff9
    steps: &adb_helper_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select native Windows Python for dependency contracts
        id: windows-contract-python
        if: ${{ env.KLOGG_ADB_HELPER_TARGET == 'windows-x86_64' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
          update-environment: false

      - name: Run native Windows dependency filesystem contracts
        if: ${{ env.KLOGG_ADB_HELPER_TARGET == 'windows-x86_64' }}
        shell: pwsh
        working-directory: tests/scripts
        env:
          KLOGG_NATIVE_PYTHON: ${{ steps.windows-contract-python.outputs.python-path }}
        run: |
          $source = @'
          import os
          import sys
          if os.name != "nt" or sys.platform != "win32":
              raise SystemExit(f"Native Windows CPython required: {os.name}/{sys.platform} ({sys.executable})")
          import unittest
          unittest.main(module=None, argv=["unittest", "-v", "test_ci_dependency_windows_security", "test_ci_dependency_core"])
          '@
          & $env:KLOGG_NATIVE_PYTHON -c $source
          exit $LASTEXITCODE

      - name: Select verified Xcode 26.6
        if: ${{ startsWith(env.KLOGG_ADB_HELPER_TARGET, 'macos-') }}
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          version=$(xcodebuild -version)
          if [[ "$version" != $'Xcode 26.6\nBuild version 17F113' ]]; then
            echo "::error::Expected Xcode 26.6 build 17F113, got: $version" >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Install locked native CMake toolchain
        if: ${{ !startsWith(env.KLOGG_ADB_HELPER_TARGET, 'linux-') }}
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Prepare MSVC for source-built AdbWinApi DLLs
        if: ${{ env.KLOGG_ADB_HELPER_TARGET == 'windows-x86_64' }}
        uses: ./.github/actions/setup-msvc
        with:
          arch: x64

      - name: Prepare pinned MinGW compiler for the MSYS2 source patch series
        if: ${{ env.KLOGG_ADB_HELPER_TARGET == 'windows-x86_64' }}
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-pkgconf

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adb-helper-source-cache
          path: ${{ runner.temp }}/adb-helper-prefetch

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: adb-helper-package-core
          path: ${{ runner.temp }}/adb-helper-package-core

      - name: Extract verified source cache while disconnected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/adb-helper-sources"
          python3 scripts/prefetch_adb_helper_sources.py \
            --lock packaging/adb/adb-helper.lock.json \
            --download-root "$RUNNER_TEMP/adb-helper-prefetch" \
            --extract-root "$RUNNER_TEMP/adb-helper-sources" \
            --offline

      - name: Install hash-locked MinGW compiler closure offline
        if: ${{ env.KLOGG_ADB_HELPER_TARGET == 'windows-x86_64' }}
        shell: msys2 {0}
        run: |
          set -euo pipefail
          pacman -U --needed --noconfirm \
            "$RUNNER_TEMP"/adb-helper-prefetch/*.pkg.tar.zst
          python3 - <<'PY'
          import json, pathlib, subprocess
          lock = json.loads(pathlib.Path("packaging/adb/adb-helper.lock.json").read_text(encoding="utf-8"))
          for package in lock.get("toolchain_packages", []):
              result = subprocess.run(
                  ["pacman", "-Q", package["id"]],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              actual = result.stdout.strip().split(maxsplit=1)
              if actual != [package["id"], package["version"]]:
                  raise SystemExit(
                      f"MSYS2 package mismatch for {package['id']}: expected {package['version']}, got {result.stdout.strip()}"
                  )
          PY

      - name: Build and verify native ADB helper
        uses: ./.github/actions/build-adb-helper
        with:
          target: ${{ env.KLOGG_ADB_HELPER_TARGET }}
          source-root: ${{ runner.temp }}/adb-helper-sources
          package-core-root: ${{ runner.temp }}/adb-helper-package-core
          package-support-root: ${{ runner.temp }}/adb-helper-package-support
          version: ${{ needs.BuildAdbHelperLegalAssets.outputs.klogg_version }}
          artifact-root: ${{ runner.temp }}/adb-helper-artifact
          container-image: ${{ env.KLOGG_ADB_CONTAINER_IMAGE }}
          object-cache-enabled: ${{ startsWith(env.KLOGG_ADB_HELPER_TARGET, 'macos-') && (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) }}

      - name: Package ADB helper without losing file modes
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/adb-helper-artifact"
          archive="$RUNNER_TEMP/adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}.tar.gz"
          if command -v cygpath >/dev/null 2>&1; then
            artifact_root=$(cygpath -u "$artifact_root")
            archive=$(cygpath -u "$archive")
          fi
          tar -czf "$archive" -C "$artifact_root" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_full
        with:
          name: adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}
          path: ${{ runner.temp }}/adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}.tar.gz
          if-no-files-found: error

      - name: Attest target-bound ADB helper build provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/adb-helper-artifact/SHA256SUMS

      - name: Attest exact full native tar provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}.tar.gz

      - name: Produce offline native-core candidate
        id: candidate
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/native-core-candidate"
          mkdir -p "$candidate_dir"
          archive="$candidate_dir/adb-helper-${KLOGG_ADB_HELPER_TARGET}.tar.gz"
          receipt="$candidate_dir/candidate.json"
          python3 scripts/ci_dependency_producer.py \
            --target-id "adb-${KLOGG_ADB_HELPER_TARGET}" \
            --artifact-root "$RUNNER_TEMP/adb-helper-artifact" \
            --source-assets-root "$RUNNER_TEMP/adb-helper-package-support" \
            --archive "$candidate_dir/adb-helper-${KLOGG_ADB_HELPER_TARGET}.tar.gz" \
            --candidate-receipt "$candidate_dir/candidate.json"
          python3 - "$archive" "$receipt" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import pathlib
          import sys
          archive, receipt = (pathlib.Path(value) for value in sys.argv[1:])
          print(f"archive-sha256={hashlib.sha256(archive.read_bytes()).hexdigest()}")
          print(f"candidate-sha256={hashlib.sha256(receipt.read_bytes()).hexdigest()}")
          PY

      - name: Upload immutable native-core candidate
        id: upload_candidate
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-core-candidate-adb-${{ env.KLOGG_ADB_HELPER_TARGET }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-core-candidate/adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}.tar.gz
            ${{ runner.temp }}/native-core-candidate/candidate.json
          if-no-files-found: error
          compression-level: 0

