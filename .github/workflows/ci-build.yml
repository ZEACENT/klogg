    needs: [BuildAdbHelperLegalAssets]
    permissions: *artifact_attestation_permissions
    if: ${{ ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish'))) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}Source-built ADB helper macos-arm64"
    runs-on: macos-26
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate-sha256 }}
      archive_sha256: ${{ steps.candidate.outputs.archive-sha256 }}
      full_artifact_id: ${{ steps.upload_full.outputs.artifact-id }}
    env:
      KLOGG_ADB_HELPER_TARGET: macos-arm64
      KLOGG_ADB_CONTAINER_IMAGE: ""
    steps: *adb_helper_steps

  LinuxPackages:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchLinuxDeployQt, BuildAdbLinuxX64, ReleaseQualificationPreflight]
    permissions: &artifact_verification_permissions
      contents: read
      actions: read
      attestations: read
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Linux ${{ matrix.config.label }} [${{ matrix.config.package_tag }}]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_ARCH: ${{ matrix.config.arch }}
      KLOGG_CONFIG_PACKAGE_TAG: ${{ matrix.config.package_tag }}
      KLOGG_CONFIG_CMAKE_OPTS: ${{ matrix.config.cmake_opts }}
      KLOGG_CONTAINER_SUFFIX: ${{ matrix.config.container_suffix }}
      KLOGG_CONTAINER_ROOT: ${{ matrix.config.container_root }}
      KLOGG_ENV_FAMILY: ${{ matrix.config.family }}
      KLOGG_PACKAGE_ENABLED: true
      KLOGG_CPACK_GEN: ${{ matrix.config.cpack_gen }}
      KLOGG_PACKAGE_SUFFIX: ${{ matrix.config.package_suffix }}
      KLOGG_ARTIFACTS_ID: ${{ matrix.config.artifacts_id }}
      KLOGG_CHECK_COMMAND: ${{ matrix.config.check_command }}
      KLOGG_CHECK_CONTAINER: ${{ matrix.config.check_container }}
      KLOGG_CONFIG_OS: ${{ matrix.config.os }}
      KLOGG_SANITIZER: ${{ matrix.config.sanitizer }}
      KLOGG_CACHE_WRITE: ${{ matrix.config.cache_write }}
      KLOGG_CACHE_SCOPE: ${{ matrix.config.cache_scope }}
      KLOGG_LABEL: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu_jammy
            os_version: 22.04
            arch: x64
            label: ubuntu-22.04-deb
            family: jammy-qt5
            cache_write: true
            cache_scope: klogg-linux-ubuntu22.04
            package_tag: vs-gen
            cpack_gen: DEB
            artifacts_id: jammy
            package_suffix: deb
            check_container: ubuntu:22.04
            container_root: docker/ubuntu22.04
            container_suffix: _ubuntu22.04
            cmake_opts: -DKLOGG_GENERIC_CPU=ON
            check_command: for attempt in 1 2 3; do apt-get update -o Acquire::Retries=3 -o APT::Update::Error-Mode=any && break; if [ "$attempt" = 3 ]; then exit 1; fi; sleep $((attempt * 10)); done; DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/klogg*.deb; QT_QPA_PLATFORM=offscreen klogg -v
            sanitizer: ""
            timeout_minutes: 60
          - os: ubuntu_noble
            os_version: 24.04
            arch: x64
            label: ubuntu-24.04-deb
            family: noble-qt6
            cache_write: true
            cache_scope: klogg-linux-ubuntu24.04
            package_tag: vs-gen
            check_command: for attempt in 1 2 3; do apt-get update -o Acquire::Retries=3 -o APT::Update::Error-Mode=any && break; if [ "$attempt" = 3 ]; then exit 1; fi; sleep $((attempt * 10)); done; DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/klogg*.deb; QT_QPA_PLATFORM=offscreen klogg -v
            cpack_gen: DEB
            artifacts_id: noble
            package_suffix: deb
            check_container: ubuntu:24.04
            container_root: docker/ubuntu24.04
            container_suffix: _ubuntu24.04
            cmake_opts: -DENABLE_CPPCHECK=ON -DKLOGG_GENERIC_CPU=ON
            sanitizer: ""
            timeout_minutes: 60
          - os: ubuntu_resolute
            os_version: 26.04
            arch: x64
            label: ubuntu-26.04-deb
            family: resolute-qt6
            cache_write: true
            cache_scope: klogg-linux-ubuntu26.04
            package_tag: vs-gen
            check_command: for attempt in 1 2 3; do apt-get update -o Acquire::Retries=3 -o APT::Update::Error-Mode=any && break; if [ "$attempt" = 3 ]; then exit 1; fi; sleep $((attempt * 10)); done; DEBIAN_FRONTEND=noninteractive apt-get install -y /packages/klogg*.deb; QT_QPA_PLATFORM=offscreen klogg -v
            cpack_gen: DEB
            artifacts_id: resolute
            package_suffix: deb
            # Ubuntu 24.10+ dropped the t64 time_t-transition suffix from the
            # Qt6 packages (libqt6gui6t64 -> libqt6gui6), so the Noble-built
            # deb is installable only on 24.04. Resolute carries the current
            # (unsuffixed) names; building there yields the deb for 26.04 LTS.
            check_container: ubuntu:26.04
            container_root: docker/ubuntu26.04
            container_suffix: _ubuntu26.04
            cmake_opts: -DENABLE_CPPCHECK=ON -DKLOGG_GENERIC_CPU=ON
            sanitizer: ""
            timeout_minutes: 60
          - os: ubuntu_appimage
            os_version: 20.04
            arch: x64
            label: ubuntu-20.04-appimage
            family: focal-qt5-gcc13
            cache_write: true
            cache_scope: klogg-linux-ubuntu20.04
            package_tag: vs-gen
            artifacts_id: appimage
            package_suffix: AppImage
            container_root: docker/ubuntu20.04
            container_suffix: _ubuntu20.04
            cmake_opts: -DKLOGG_GENERIC_CPU=ON
            cpack_gen:
            check_container:
            check_command:
            sanitizer: ""
            timeout_minutes: 60

    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.config.timeout_minutes || 60 }}
    steps: &linux_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          name: adb-helper-linux-x86_64
          path: ${{ github.workspace }}/prefetch_artifacts/adb-helper-archive

      - name: Extract mode-preserving ADB helper artifact
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_root="${{ github.workspace }}/prefetch_artifacts/adb-helper-archive"
          artifact_root="${{ github.workspace }}/prefetch_artifacts/adb-helper"
          archive="$archive_root/adb-helper-linux-x86_64.tar.gz"
          test -f "$archive"
          rm -rf "$artifact_root"
          python3 scripts/extract_verified_tar.py \
            --archive "$archive" \
            --destination "$artifact_root"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          name: adb-helper-package-support
          path: ${{ github.workspace }}/prefetch_artifacts/adb-helper/release

      - name: Verify target-bound ADB helper checksum envelope and provenance
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="${{ github.workspace }}/prefetch_artifacts/adb-helper"
          python3 scripts/verify_adb_helper_envelope.py \
            --lock packaging/adb/adb-helper.lock.json \
            --artifact-root "$artifact_root" \
            --expected-target linux-x86_64
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            gh attestation verify "$artifact_root/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cpm-cache
          path: ${{ github.workspace }}
      - uses: ./.github/actions/restore-cpm-cache

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_CONFIG_OS == 'ubuntu_appimage' }}
        with:
          name: linuxdeployqt
          path: ${{ github.workspace }}/tools

      - name: Verify and prepare the locked Linux environment
        id: linux-environment
        uses: ./.github/actions/prepare-linux-environment
        with:
          family: ${{ env.KLOGG_ENV_FAMILY }}

      - name: Compute bounded ccache generation
        id: ccache-generation
        if: ${{ env.KLOGG_SANITIZER != 'thread' }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          today = datetime.datetime.now(datetime.timezone.utc).date()
          print(f"current={today.isoformat()}")
          PY

      - name: Restore ccache for the Linux build
        id: restore-ccache
        if: ${{ env.KLOGG_SANITIZER != 'thread' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # The container compiles with CCACHE_DIR=/usr/local/.ccache, which is
          # the workspace mounted at /usr/local, so restoring this host path
          # warms the in-container cache. The key is stable per config (no
          # per-commit SHA): per-sha entries exhausted the repo-wide 10GB cache
          # budget, evicting every restore before the next run. The bounded v2
          # generation tries the current UTC day, then the newest retained v2
          # generation. This survives quiet weekends without creating per-run
          # entries; PRs restore but never write throwaway caches of their own.
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.KLOGG_LABEL }}-ccache-v2-${{ steps.ccache-generation.outputs.current }}
          restore-keys: |
            ${{ env.KLOGG_LABEL }}-ccache-v2-

      - uses: ./.github/actions/prepare-workspace-env
        with:
          arch: ${{ env.KLOGG_CONFIG_ARCH }}
          package-tag: ${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          cmake-options: ${{ env.KLOGG_CONFIG_CMAKE_OPTS }}
          qt-version: ${{ env.KLOGG_QT_VERSION }}
      - name: Require verified source-built ADB helper for Linux packages
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: sh
        run: |
          echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DKLOGG_ADB_HELPER_REQUIRED=ON -DKLOGG_ADB_HELPER_TARGET=linux-x86_64 -DKLOGG_ADB_HELPER_ARTIFACT_ROOT=/usr/local/prefetch_artifacts/adb-helper" >> $GITHUB_ENV

      - name: Lock CPM downloads to prefetched cache
        shell: sh
        run: |
          echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DFETCHCONTENT_FULLY_DISCONNECTED=ON" >> $GITHUB_ENV

      - name: Configure effective ccache budget
        if: ${{ env.KLOGG_SANITIZER != 'thread' }}
        shell: bash
        run: python3 scripts/ci_ccache.py prepare --label "$KLOGG_LABEL" --github-env "$GITHUB_ENV"

      - name: Describe shared application compiler objects
        id: shared-cache-descriptor
        if: ${{ env.KLOGG_SANITIZER != 'thread' }}
        shell: bash
        env:
          KLOGG_CI_ENVIRONMENT_IDENTITY: ${{ steps.linux-environment.outputs.image }}
        run: |
          set -euo pipefail
          args=(--required-step "Build Linux application" --required-step "Verify Linux tests" --required-step "Bound Linux ccache before save")
          if [ "$KLOGG_PACKAGE_ENABLED" = "true" ]; then
            args+=(--required-step "Qualify Linux package")
          fi
          python3 -I scripts/ci_compiler_object_descriptor.py \
            --component application --label "$KLOGG_LABEL" \
            --producer-job "Linux $KLOGG_LABEL [$KLOGG_CONFIG_PACKAGE_TAG]" \
            --export-step "Export shared application compiler objects" \
            --output "$RUNNER_TEMP/shared-compiler-descriptor.json" --image "$KLOGG_CI_ENVIRONMENT_IDENTITY" "${args[@]}"

      - name: Restore compatible cross-run compiler objects
        id: restore-shared-compiler-cache
        if: ${{ steps.shared-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/restore-compiler-object-artifact
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache

      - name: Enable ccache compiler launcher
        if: ${{ env.KLOGG_SANITIZER != 'thread' }}
        shell: sh
        env:
          KLOGG_CCACHE_CONTAINER_CONFIG: ${{ steps.shared-cache-descriptor.outputs.container-config-path }}
        run: |
          # The existing Docker action is qualification-policy-bound. Carry
          # the effective environment through its existing CMake launcher seam,
          # overriding old image defaults without rebuilding those images.
          # Preserve the quotes for that action's inner bash -lc parse.
          launcher="env;CCACHE_MAXSIZE=$CCACHE_MAXSIZE;CCACHE_COMPILERCHECK=$CCACHE_COMPILERCHECK;CCACHE_COMPRESS=$CCACHE_COMPRESS;CCACHE_COMPRESSLEVEL=$CCACHE_COMPRESSLEVEL;ccache"
          if [ -n "${KLOGG_CCACHE_CONTAINER_CONFIG:-}" ]; then
            launcher="env;CCACHE_CONFIGPATH=$KLOGG_CCACHE_CONTAINER_CONFIG;CCACHE_SLOPPINESS=;CCACHE_PREFIX=;CCACHE_PREFIX_CPP=;CCACHE_REMOTE_STORAGE=;${launcher#env;}"
          fi
          echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DCMAKE_C_COMPILER_LAUNCHER='$launcher' -DCMAKE_CXX_COMPILER_LAUNCHER='$launcher'" >> $GITHUB_ENV

      - name: Set sanitizer env (forwarded into the container by docker-run-tests)
        if: ${{ env.KLOGG_SANITIZER }}
        shell: sh
        run: |
          # Each sanitizer leg scopes only its own runtime options; docker-run-tests
          # forwards whatever is set and passes empty values for the rest.
          if [ "${{ env.KLOGG_SANITIZER }}" = "address" ]; then
            # detect_leaks=1 enables LeakSanitizer on the ASan leg; suppressions
            # live under the workspace mount (/usr/local) inside the container.
            echo "ASAN_OPTIONS=detect_leaks=1:abort_on_error=1:halt_on_error=1:suppressions=/usr/local/tests/sanitizers/asan_suppressions.txt" >> $GITHUB_ENV
            # Slow unwinding retains the qoffscreen plugin frame in indirect Qt
            # allocation stacks, allowing the existing module-scoped suppression
            # to match without broad QObject/Qt suppressions.
            echo "LSAN_OPTIONS=suppressions=/usr/local/tests/sanitizers/lsan_suppressions.txt:fast_unwind_on_malloc=0" >> $GITHUB_ENV
          fi
          if [ "${{ env.KLOGG_SANITIZER }}" = "undefined" ]; then
            echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1" >> $GITHUB_ENV
          fi
          if [ "${{ env.KLOGG_SANITIZER }}" = "thread" ]; then
            docker run --pull=never --rm "${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ env.KLOGG_CONTAINER_SUFFIX }}" /bin/bash -c '
              test -x /usr/bin/llvm-symbolizer-14 &&
              test -f /opt/qt5-tsan/plugins/platforms/libqoffscreen.so &&
              llvm-nm-14 -D --undefined-only /opt/qt5-tsan/lib/libQt5Core.so.5 | grep -q __tsan_acquire &&
              llvm-nm-14 -D --undefined-only /opt/qt5-tsan/lib/libQt5Core.so.5 | grep -q __tsan_release
            '
            echo "TSAN_OPTIONS=halt_on_error=1:external_symbolizer_path=/usr/bin/llvm-symbolizer-14" >> $GITHUB_ENV
          fi

      - name: Build Linux application
        uses: ./.github/actions/docker-build
        with:
          container-suffix: ${{ env.KLOGG_CONTAINER_SUFFIX }}

      - name: Bind build metrics to verified Linux environment
        env:
          KLOGG_CI_ENVIRONMENT_IDENTITY: ${{ steps.linux-environment.outputs.image }}
          KLOGG_CI_CACHE_ARTIFACT_ID: ${{ steps.restore-shared-compiler-cache.outputs.artifact-id }}
          KLOGG_CI_CACHE_RESTORE_KEY: ${{ steps.restore-ccache.outputs.cache-matched-key }}
        shell: bash
        run: >-
          python3 scripts/ci_build_observation.py bind-environment
          --metrics "$KLOGG_BUILD_ROOT/ci-build-metrics-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          --identity "$KLOGG_CI_ENVIRONMENT_IDENTITY"

      - name: Upload current-run build metrics
        if: ${{ hashFiles(format('{0}/ci-build-metrics-{1}-{2}.json', env.KLOGG_BUILD_ROOT, github.run_id, github.run_attempt)) != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metrics-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: ${{ env.KLOGG_BUILD_ROOT }}/ci-build-metrics-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Show ccache statistics
        if: ${{ env.KLOGG_SANITIZER != 'thread' }}
        shell: bash
        run: |
          # Lifetime counters are diagnostic only; build metrics contain deltas.
          # Match the compiler launcher's effective settings, not image defaults.
          docker run --pull=never --rm -v "$KLOGG_WORKSPACE":/usr/local \
            --env CCACHE_MAXSIZE --env CCACHE_COMPILERCHECK \
            --env CCACHE_COMPRESS --env CCACHE_COMPRESSLEVEL \
            "${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ env.KLOGG_CONTAINER_SUFFIX }}" \
            /bin/bash -c 'ccache -s 2>&1 || echo "ccache stats unavailable"'

      - name: Verify ASan-instrumented test binaries
        if: ${{ env.KLOGG_SANITIZER == 'address' }}
        shell: bash
        run: |
          docker run --pull=never --rm \
            --env KLOGG_BUILD_ROOT \
            -v "$KLOGG_WORKSPACE:/usr/local" \
            "${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ env.KLOGG_CONTAINER_SUFFIX }}" \
            /bin/bash -c '
              set -euo pipefail
              for bin in klogg_tests klogg_itests; do
                f="/usr/local/$KLOGG_BUILD_ROOT/output/$bin"
                test -x "$f" || { echo "test binary missing: $bin"; exit 1; }
                # grep without -q: -q exits on the first match and closes the
                # pipe, which SIGPIPEs nm; under pipefail that fails the check
                # even when the symbol is present. Reading the whole stream is
                # a few ms and keeps the pipeline exit status reliable.
                nm "$f" 2>/dev/null | grep "asan_init" >/dev/null || {
                  echo "ERROR: $bin missing ASan instrumentation (no asan_init symbol)"; exit 1; }
              done
              echo "ASan instrumentation verified in klogg_tests and klogg_itests"
            '

      - name: Verify UBSan-instrumented test binaries
        if: ${{ env.KLOGG_SANITIZER == 'undefined' }}
        shell: bash
        run: |
          docker run --pull=never --rm \
            --env KLOGG_BUILD_ROOT \
            -v "$KLOGG_WORKSPACE:/usr/local" \
            "${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ env.KLOGG_CONTAINER_SUFFIX }}" \
            /bin/bash -c '
              set -euo pipefail
              for bin in klogg_tests klogg_itests; do
                f="/usr/local/$KLOGG_BUILD_ROOT/output/$bin"
                test -x "$f" || { echo "test binary missing: $bin"; exit 1; }
                # grep without -q: -q exits on the first match and closes the
                # pipe, which SIGPIPEs nm; under pipefail that fails the check
                # even when the symbol is present. Reading the whole stream is
                # a few ms and keeps the pipeline exit status reliable.
                nm "$f" 2>/dev/null | grep "ubsan_handle" >/dev/null || {
                  echo "ERROR: $bin missing UBSan instrumentation (no ubsan_handle symbol)"; exit 1; }
              done
              echo "UBSan instrumentation verified in klogg_tests and klogg_itests"
            '

      - name: Verify TSan Qt runtime provenance
        if: ${{ env.KLOGG_SANITIZER == 'thread' }}
        shell: bash
        run: |
          docker run --pull=never --rm \
            --env TSAN_OPTIONS \
            -v "$KLOGG_WORKSPACE:/usr/local" \
            "${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ env.KLOGG_CONTAINER_SUFFIX }}" \
            /usr/local/scripts/verify_tsan_qt_runtime.sh \
            "/usr/local/$KLOGG_BUILD_ROOT/output/klogg_itests" \
            /opt/qt5-tsan

      - name: Verify Linux tests
        uses: ./.github/actions/docker-run-tests
        with:
          container-suffix: ${{ env.KLOGG_CONTAINER_SUFFIX }}
      - name: Qualify Linux package
        uses: ./.github/actions/docker-package
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          os: ${{ env.KLOGG_CONFIG_OS }}
          container-suffix: ${{ env.KLOGG_CONTAINER_SUFFIX }}
          cpack-generator: ${{ env.KLOGG_CPACK_GEN }}
          package-suffix: ${{ env.KLOGG_PACKAGE_SUFFIX }}
          artifact-id: ${{ env.KLOGG_ARTIFACTS_ID }}
          collect-symbols: "true"
          check-container: ${{ env.KLOGG_CHECK_CONTAINER }}
          check-command: ${{ env.KLOGG_CHECK_COMMAND }}

      - name: Bound Linux ccache before save
        if: ${{ success() && env.KLOGG_SANITIZER != 'thread' && (github.event_name == 'push' || steps.shared-cache-descriptor.outputs.eligible == 'true') }}
        shell: bash
        env:
          KLOGG_CCACHE_CONTAINER_CONFIG: ${{ steps.shared-cache-descriptor.outputs.container-config-path }}
        run: |
          docker run --pull=never --rm --env CCACHE_CONFIGPATH="$KLOGG_CCACHE_CONTAINER_CONFIG" \
            -v "$KLOGG_WORKSPACE":/usr/local \
            "${{ env.KLOGG_CI_IMAGE_PREFIX }}${{ env.KLOGG_CONTAINER_SUFFIX }}" \
            python3 /usr/local/scripts/ci_ccache.py trim --label "$KLOGG_LABEL"

      - name: Save ccache for the Linux build
        if: ${{ success() && env.KLOGG_SANITIZER != 'thread' && github.event_name == 'push' }}
        uses: ./.github/actions/save-verified-compiler-cache
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache
          # Only validated master builds seed bounded daily generations.
          # Transport failures after this point must not discard their cache.
          key: ${{ env.KLOGG_LABEL }}-ccache-v2-${{ steps.ccache-generation.outputs.current }}

      - name: Export shared application compiler objects
        id: export-shared-compiler-cache
        if: ${{ success() && steps.shared-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/export-compiler-object-artifact
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache
          export-needed: ${{ steps.restore-shared-compiler-cache.outputs.export-needed }}

      - name: Upload shared compiler cache evidence
        if: ${{ always() && steps.restore-shared-compiler-cache.outputs.report != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-object-acquisition-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.restore-shared-compiler-cache.outputs.report }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

# Successful pull requests already validate package contents in place. Upload
# only trusted master outputs and explicit release qualifications; Continuous
# consumes the master artifacts immediately.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release')) }}
        with:
          name: packages-${{ env.KLOGG_ARTIFACTS_ID }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release')) }}
        with:
          name: symbols-${{ env.KLOGG_ARTIFACTS_ID }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/symbols/*'
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  LinuxSanitizers:
    needs: [SaveVersion, PrefetchCpmCache, ReleaseQualificationPreflight]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Linux ${{ matrix.config.label }} [${{ matrix.config.package_tag }}]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_ARCH: ${{ matrix.config.arch }}
      KLOGG_CONFIG_PACKAGE_TAG: ${{ matrix.config.package_tag }}
      KLOGG_CONFIG_CMAKE_OPTS: ${{ matrix.config.cmake_opts }}
      KLOGG_CONTAINER_SUFFIX: ${{ matrix.config.container_suffix }}
      KLOGG_CONTAINER_ROOT: ${{ matrix.config.container_root }}
      KLOGG_ENV_FAMILY: ${{ matrix.config.family }}
      KLOGG_PACKAGE_ENABLED: false
      KLOGG_CONFIG_OS: ${{ matrix.config.os }}
      KLOGG_SANITIZER: ${{ matrix.config.sanitizer }}
      KLOGG_CACHE_WRITE: ${{ matrix.config.cache_write }}
      KLOGG_CACHE_SCOPE: ${{ matrix.config.cache_scope }}
      KLOGG_LABEL: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # Package-free sanitizer legs start without mobile artifact producers.
          - os: ubuntu_jammy
            os_version: 22.04
            arch: x64
            label: ubuntu-22.04-asan-lsan
            family: jammy-qt5
            cache_write: false
            cache_scope: klogg-linux-ubuntu22.04
            package_tag: asan
            container_root: docker/ubuntu22.04
            container_suffix: _ubuntu22.04
            cmake_opts: -DKLOGG_GENERIC_CPU=ON -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF -DENABLE_SANITIZER_ADDRESS=ON -DKLOGG_CI_LIGHT_DEBUG=ON
            sanitizer: address
            # ASan instrumentation + the full test suite is the longest pole in
            # the matrix; leave headroom over the default 60 min for runner CPU
            # contention (the deb legs hit the 60-min timeout on a slow runner).
            timeout_minutes: 90
            cpack_gen: ""
            package_suffix: ""
            artifacts_id: ""
            check_command: ""
            check_container: ""
          - os: ubuntu_jammy
            os_version: 22.04
            arch: x64
            label: ubuntu-22.04-ubsan
            family: jammy-qt5
            cache_write: false
            cache_scope: klogg-linux-ubuntu22.04
            package_tag: ubsan
            container_root: docker/ubuntu22.04
            container_suffix: _ubuntu22.04
            cmake_opts: -DKLOGG_GENERIC_CPU=ON -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON -DKLOGG_CI_LIGHT_DEBUG=ON
            sanitizer: undefined
            timeout_minutes: 60
            cpack_gen: ""
            package_suffix: ""
            artifacts_id: ""
            check_command: ""
            check_container: ""

    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.config.timeout_minutes || 60 }}
    steps: *linux_steps

  LinuxTsan:
    needs: [SaveVersion, PrefetchCpmCache, ReleaseQualificationPreflight]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Linux ubuntu-22.04-tsan [tsan]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_ARCH: x64
      KLOGG_CONFIG_PACKAGE_TAG: tsan
      KLOGG_CONFIG_CMAKE_OPTS: -DCMAKE_C_COMPILER=clang-14 -DCMAKE_CXX_COMPILER=clang++-14 -DCMAKE_PREFIX_PATH=/opt/qt5-tsan -DQt5_DIR=/opt/qt5-tsan/lib/cmake/Qt5 -DKLOGG_TSAN_QT_PREFIX=/opt/qt5-tsan -DKLOGG_TSAN_QT_VERSION=5.15.19 -DKLOGG_GENERIC_CPU=ON -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF -DENABLE_SANITIZER_THREAD=ON
      KLOGG_CONTAINER_SUFFIX: _ubuntu22.04-tsan
      KLOGG_CONTAINER_ROOT: docker/ubuntu22.04-tsan
      KLOGG_ENV_FAMILY: jammy-qt5-tsan
      KLOGG_PACKAGE_ENABLED: false
      KLOGG_CONFIG_OS: ubuntu_jammy
      KLOGG_SANITIZER: thread
      KLOGG_CACHE_WRITE: true
      KLOGG_CACHE_SCOPE: klogg-qt5-tsan
      KLOGG_LABEL: ubuntu-22.04-tsan
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps: *linux_steps

  PrefetchIosNativeSources:
    needs: [DependencyModePreflight]
    if: ${{ !cancelled() && ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') && needs.DependencyModePreflight.result == 'success')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}Prefetch locked iOS native sources"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore checksum-locked iOS source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ github.workspace }}/ios-native-sources
          key: ios-native-sources-${{ hashFiles('3rdparty/libimobiledevice/libimobiledevice.lock.json') }}

      - name: Prefetch checksum-locked iOS native sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prefetch_ios_native_sources.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --output "${{ github.workspace }}/ios-native-sources"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-source-cache
          path: ${{ github.workspace }}/ios-native-sources/*
          if-no-files-found: error
          compression-level: 0

  BuildIosNativeX64:
    needs: [SaveVersion, PrefetchIosNativeSources]
    permissions: *artifact_attestation_permissions
    if: ${{ ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish'))) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}iOS native stack x86_64"
    runs-on: macos-26-intel
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate-sha256 }}
      archive_sha256: ${{ steps.candidate.outputs.archive-sha256 }}
      full_artifact_id: ${{ steps.resolve_full_artifact.outputs.artifact-id }}
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_IOS_ARCHITECTURE: x86_64
      KLOGG_IOS_ARTIFACT: ios-native-x86_64
    timeout-minutes: 60
    steps: &ios_native_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select verified Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          version=$(xcodebuild -version)
          if [[ "$version" != $'Xcode 26.6\nBuild version 17F113' ]]; then
            echo "::error::Expected Xcode 26.6 build 17F113, got: $version" >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

      - name: Install iOS native source-build tools
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_ANALYTICS=1
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          if brew list --formula aws-sam-cli >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies aws-sam-cli || true
          fi
          if brew tap | grep -Fx aws/tap >/dev/null; then
            brew untap aws/tap
          fi
          brew install autoconf automake libtool pkg-config

      - name: Install pinned CMake and Ninja
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: 3.31.6
          ninjaVersion: 1.12.1

      - name: Verify pinned iOS producer toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_dependency_toolchain.py \
            --target-id "ios-${KLOGG_IOS_ARCHITECTURE}"

      - name: Observe unreviewed iOS host tool inputs
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_dependency_toolchain.py \
            --target-id "ios-${KLOGG_IOS_ARCHITECTURE}" \
            --probe-unreviewed-host-tools

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-native-source-cache
          path: ${{ github.workspace }}/ios-native-sources

      - name: Execute pinned os_trace startup C contract
        shell: bash
        env:
          KLOGG_IOS_NATIVE_ARCHIVE_ROOT: ${{ github.workspace }}/ios-native-sources
        run: |
          set -euo pipefail
          python3 "${{ github.workspace }}/tests/scripts/test_libimobiledevice_ostrace_startup.py"

      - name: Select ordinary iOS compiler cache scope
        id: ios-cache-eligibility
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off') }}
        shell: bash
        run: python3 scripts/ci_native_object_cache.py eligible --component ios-native --target "$KLOGG_IOS_ARCHITECTURE"

      - name: Install ordinary iOS compiler cache
        if: ${{ steps.ios-cache-eligibility.outputs.eligible == 'true' }}
        shell: bash
        env:
          HOMEBREW_NO_ANALYTICS: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ccache

      - name: Prepare ordinary iOS compiler objects
        id: ios-cache
        if: ${{ steps.ios-cache-eligibility.outputs.eligible == 'true' }}
        shell: bash
        run: python3 scripts/ci_native_object_cache.py prepare --component ios-native --target "$KLOGG_IOS_ARCHITECTURE"

      - name: Restore scoped iOS compiler objects
        id: ios-cache-primary
        if: ${{ steps.ios-cache.outputs.enabled == 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.ios-cache.outputs.path }}
          key: ${{ steps.ios-cache.outputs.primary-key }}
          restore-keys: ${{ steps.ios-cache.outputs.primary-prefix }}

      - name: Restore master iOS objects on own-PR miss
        id: ios-cache-master
        if: ${{ steps.ios-cache.outputs.own-pr == 'true' && steps.ios-cache-primary.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.ios-cache.outputs.path }}
          key: ${{ steps.ios-cache.outputs.master-key }}
          restore-keys: ${{ steps.ios-cache.outputs.master-prefix }}

      - name: Describe shared iOS compiler objects
        id: ios-cache-descriptor
        if: ${{ steps.ios-cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          KLOGG_IOS_CACHE_IDENTITY: ${{ steps.ios-cache.outputs.identity-file }}
        run: |
          set -euo pipefail
          python3 scripts/ci_compiler_object_descriptor.py \
            --component native --label "native-ios-$KLOGG_IOS_ARCHITECTURE" \
            --native-identity "$KLOGG_IOS_CACHE_IDENTITY" \
            --producer-job "iOS native stack $KLOGG_IOS_ARCHITECTURE" \
            --required-step "Build disconnected thin iOS native stack" \
            --required-step "Bind iOS native artifact with SHA256SUMS" \
            --export-step "Export shared iOS compiler objects" \
            --output "$RUNNER_TEMP/native-ios-descriptor-$KLOGG_IOS_ARCHITECTURE.json"

      - name: Restore shared iOS compiler objects
        id: ios-cache-shared
        if: ${{ steps.ios-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/restore-compiler-object-artifact
        with:
          descriptor: ${{ steps.ios-cache-descriptor.outputs.descriptor }}
          path: ${{ steps.ios-cache.outputs.path }}

      - name: Start current-build iOS cache observation
        if: ${{ steps.ios-cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          KLOGG_NATIVE_CACHE_STATE: ${{ steps.ios-cache.outputs.state }}
          KLOGG_NATIVE_PRIMARY_MATCH: ${{ steps.ios-cache-primary.outputs.cache-matched-key }}
          KLOGG_NATIVE_MASTER_MATCH: ${{ steps.ios-cache-master.outputs.cache-matched-key }}
        run: python3 scripts/ci_native_object_cache.py start --state "$KLOGG_NATIVE_CACHE_STATE"

      - name: Build disconnected thin iOS native stack
        shell: bash
        env:
          KLOGG_IOS_CACHE_STATE: ${{ steps.ios-cache.outputs.state }}
          KLOGG_IOS_COMPILER_LAUNCHER: ${{ steps.ios-cache.outputs.compiler-launcher }}
        run: |
          set -euo pipefail
          build_prefix=(python3)
          launcher_args=(--parallel "$(sysctl -n hw.ncpu)")
          if [[ -n "$KLOGG_IOS_CACHE_STATE" ]]; then
            build_prefix=(python3 scripts/ci_native_object_cache.py exec --state "$KLOGG_IOS_CACHE_STATE" -- python3)
            launcher_args+=(--compiler-launcher "$KLOGG_IOS_COMPILER_LAUNCHER")
          fi
          original_root="${{ runner.temp }}/ios-native-original"
          core_root="${{ runner.temp }}/ios-native-legal-core"
          stack_root="${{ runner.temp }}/ios-native-stack"
          "${build_prefix[@]}" scripts/build_ios_native_stack.py \
            --repository-root "${{ github.workspace }}" \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --archive-root "${{ github.workspace }}/ios-native-sources" \
            --work-root "${{ runner.temp }}/ios-native-work" \
            --artifact-root "$original_root" \
            --architecture "${{ env.KLOGG_IOS_ARCHITECTURE }}" \
            "${launcher_args[@]}"
          python3 scripts/verify_ios_native_stack.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --stack-root "$original_root" \
            --architecture "${{ env.KLOGG_IOS_ARCHITECTURE }}" \
            --receipt "$original_root/ios-native-build-receipt.json"
          python3 scripts/build_ios_native_legal_assets.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --archive-root "${{ github.workspace }}/ios-native-sources" \
            --repository-root "${{ github.workspace }}" \
            --stack-root "$original_root" \
            --core-only --output "$core_root"
          receipt_sha256() {
            python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest())' "$1"
          }
          python3 scripts/build_ios_native_legal_assets.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --stack-root "$original_root" --core-root "$core_root" \
            --assemble-stack \
            --source-set-sha256 "$(receipt_sha256 "$core_root/ios-native-source-set-receipt.json")" \
            --legal-receipt-sha256 "$(receipt_sha256 "$core_root/ios-native-legal-receipt.json")" \
            --build-receipt-sha256 "$(receipt_sha256 "$original_root/ios-native-build-receipt.json")" \
            --version "$KLOGG_VERSION" \
            --base-url "https://github.com/${GITHUB_REPOSITORY}" \
            --output "$stack_root"
          for receipt in \
            ios-native-build-receipt.json \
            ios-native-source-set-receipt.json \
            ios-native-source-receipt.json \
            ios-native-legal-receipt.json \
            ios-native-sbom.spdx.json; do
            test -f "$stack_root/$receipt"
          done
          cp "$stack_root/ios-native-build-receipt.json" \
            "$stack_root/ios-native-${{ env.KLOGG_IOS_ARCHITECTURE }}-build-receipt.json"

      - name: Bind iOS native artifact with SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ runner.temp }}/ios-native-stack" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = sorted(
              path for path in root.rglob("*")
              if path.is_file() and not path.is_symlink() and path.name != "SHA256SUMS"
          )
          if not files:
              raise SystemExit("iOS native artifact is empty")
          lines = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          tar -czf "${{ runner.temp }}/${{ env.KLOGG_IOS_ARTIFACT }}.tar.gz" \
            -C "${{ runner.temp }}/ios-native-stack" .

      - name: Measure and bound verified iOS compiler objects
        id: ios-cache-finish
        if: ${{ success() && steps.ios-cache.outputs.enabled == 'true' }}
        shell: bash
        env:
          KLOGG_NATIVE_CACHE_STATE: ${{ steps.ios-cache.outputs.state }}
        run: python3 scripts/ci_native_object_cache.py finish --state "$KLOGG_NATIVE_CACHE_STATE"

      - name: Save verified scoped iOS compiler objects
        if: ${{ success() && steps.ios-cache-finish.outputs.validated == 'true' && steps.ios-cache.outputs.save-key != '' }}
        uses: ./.github/actions/save-verified-compiler-cache
        with:
          path: ${{ steps.ios-cache.outputs.path }}
          key: ${{ steps.ios-cache.outputs.save-key }}
          descriptor: ${{ steps.ios-cache-descriptor.outputs.descriptor }}

      - name: Export shared iOS compiler objects
        if: ${{ success() && steps.ios-cache-finish.outputs.validated == 'true' && steps.ios-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/export-compiler-object-artifact
        with:
          descriptor: ${{ steps.ios-cache-descriptor.outputs.descriptor }}
          path: ${{ steps.ios-cache.outputs.path }}
          export-needed: ${{ steps.ios-cache-shared.outputs.export-needed }}

      - name: Retain iOS compiler cache measurement
        if: ${{ always() && steps.ios-cache-finish.outputs.validated == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ios-object-cache-${{ env.KLOGG_IOS_ARCHITECTURE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.ios-cache-finish.outputs.report }}
            ${{ steps.ios-cache-shared.outputs.report }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload iOS native stack
        id: upload_ios_stack
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.KLOGG_IOS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.KLOGG_IOS_ARTIFACT }}.tar.gz
          if-no-files-found: error

      - name: Retry iOS native stack upload after artifact-service failure
        id: retry_ios_stack
        if: ${{ steps.upload_ios_stack.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.KLOGG_IOS_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.KLOGG_IOS_ARTIFACT }}.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Resolve effective full iOS artifact ID
        id: resolve_full_artifact
        if: ${{ always() && (steps.upload_ios_stack.outcome == 'success' || steps.upload_ios_stack.outcome == 'failure') }}
        shell: bash
        env:
          KLOGG_PRIMARY_OUTCOME: ${{ steps.upload_ios_stack.outcome }}
          KLOGG_PRIMARY_ID: ${{ steps.upload_ios_stack.outputs.artifact-id }}
          KLOGG_RETRY_OUTCOME: ${{ steps.retry_ios_stack.outcome }}
          KLOGG_RETRY_ID: ${{ steps.retry_ios_stack.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ "$KLOGG_PRIMARY_OUTCOME" == success && "$KLOGG_RETRY_OUTCOME" == skipped && -z "$KLOGG_RETRY_ID" ]]; then
            artifact_id="$KLOGG_PRIMARY_ID"
          elif [[ "$KLOGG_PRIMARY_OUTCOME" == failure && -z "$KLOGG_PRIMARY_ID" && "$KLOGG_RETRY_OUTCOME" == success ]]; then
            artifact_id="$KLOGG_RETRY_ID"
          else
            echo '::error::No unambiguous successful original iOS artifact upload'
            exit 1
          fi
          if [[ ! "$artifact_id" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Original iOS artifact ID must be a positive decimal number'
            exit 1
          fi
          printf 'artifact-id=%s\n' "$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Upload architecture-independent iOS source set
        if: ${{ env.KLOGG_IOS_ARCHITECTURE == 'arm64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-source-assets
          path: |
            ${{ runner.temp }}/ios-native-stack/ios-native-corresponding-source.tar.gz
            ${{ runner.temp }}/ios-native-stack/ios-native-source-set-receipt.json
            ${{ runner.temp }}/ios-native-stack/ios-native-overlay-receipt.json
            ${{ runner.temp }}/ios-native-stack/ios-native-source-offer.txt
            ${{ runner.temp }}/ios-native-stack/ios-native-lgpl-replacement.txt
            ${{ runner.temp }}/ios-native-stack/NOTICE-ios-native.txt
            ${{ runner.temp }}/ios-native-stack/licenses
          if-no-files-found: error

      - name: Attest target-bound iOS native stack provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ios-native-stack/SHA256SUMS

      - name: Attest exact full native tar provenance
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/${{ env.KLOGG_IOS_ARTIFACT }}.tar.gz

      - name: Produce offline native-core candidate
        id: candidate
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/native-core-candidate"
          mkdir -p "$candidate_dir"
          archive="$candidate_dir/ios-native-${KLOGG_IOS_ARCHITECTURE}.tar.gz"
          receipt="$candidate_dir/candidate.json"
          python3 scripts/ci_dependency_producer.py \
            --target-id "ios-${KLOGG_IOS_ARCHITECTURE}" \
            --artifact-root "$RUNNER_TEMP/ios-native-stack" \
            --source-assets-root "$RUNNER_TEMP/ios-native-stack" \
            --archive "$candidate_dir/ios-native-${KLOGG_IOS_ARCHITECTURE}.tar.gz" \
            --candidate-receipt "$candidate_dir/candidate.json"
          python3 - "$archive" "$receipt" <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import pathlib
          import sys
          archive, receipt = (pathlib.Path(value) for value in sys.argv[1:])
          print(f"archive-sha256={hashlib.sha256(archive.read_bytes()).hexdigest()}")
          print(f"candidate-sha256={hashlib.sha256(receipt.read_bytes()).hexdigest()}")
          PY

      - name: Upload immutable native-core candidate
        id: upload_candidate
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-core-candidate-ios-${{ env.KLOGG_IOS_ARCHITECTURE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-core-candidate/ios-native-${{ env.KLOGG_IOS_ARCHITECTURE }}.tar.gz
            ${{ runner.temp }}/native-core-candidate/candidate.json
          if-no-files-found: error
          compression-level: 0

  BuildIosNativeArm64:
    needs: [SaveVersion, PrefetchIosNativeSources]
    permissions: *artifact_attestation_permissions
    if: ${{ ((github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) || (github.event_name == 'workflow_dispatch' && (inputs.dependency-mode == 'qualify' || inputs.dependency-mode == 'publish'))) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && inputs.environment-mode != 'off' && '[producer-mode skipped] ' || '' }}iOS native stack arm64"
    runs-on: macos-26
    outputs:
      artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      candidate_sha256: ${{ steps.candidate.outputs.candidate-sha256 }}
      archive_sha256: ${{ steps.candidate.outputs.archive-sha256 }}
      full_artifact_id: ${{ steps.resolve_full_artifact.outputs.artifact-id }}
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_IOS_ARCHITECTURE: arm64
      KLOGG_IOS_ARTIFACT: ios-native-arm64
    timeout-minutes: 60
    steps: *ios_native_steps

  MacPackages:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchBoost, ReleaseQualificationPreflight]
    permissions: *artifact_verification_permissions
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}macOS intel-qt6 [vs-gen]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_OS: macos-26-intel
      KLOGG_QT_VERSION: 6.9.3
      KLOGG_QT_MODULES: qt5compat qtimageformats
      KLOGG_QT_ARCHIVES: qtbase icu qtsvg qttools qttranslations
      KLOGG_QT_ARCH: clang_64
      KLOGG_CONFIG_ARCH: x64
      KLOGG_LABEL: intel-qt6
      KLOGG_CONFIG_PACKAGE_TAG: vs-gen
      KLOGG_ARTIFACTS_ID: macos-intel-qt6
      KLOGG_ADB_HELPER_TARGET: macos-x86_64
      KLOGG_IOS_NATIVE_ARTIFACT: ios-native-x86_64
      KLOGG_IOS_ARCHITECTURE: x86_64
      KLOGG_CONFIG_CMAKE_OPTS: -DKLOGG_OSX_DEPLOYMENT_TARGET=15.0
      KLOGG_PACKAGE_ENABLED: true
      KLOGG_SANITIZER: ""
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps: &mac_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select verified Xcode 26.6
        shell: bash
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
          test -d "$DEVELOPER_DIR"
          version=$(xcodebuild -version)
          if [[ "$version" != $'Xcode 26.6\nBuild version 17F113' ]]; then
            echo "::error::Expected Xcode 26.6 build 17F113, got: $version" >&2
            exit 1
          fi
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"

#Install build deps
      - name: Set brew env
        shell: sh
        run: |
          echo "HOMEBREW_NO_ANALYTICS=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_AUTO_UPDATE=1" >> $GITHUB_ENV
          echo "HOMEBREW_NO_INSTALL_CLEANUP=1" >> $GITHUB_ENV

      - name: Brew deps
        run: |
          # ccache is a build dep on macOS too: the sanitizer legs rebuild
          # vectorscan + tbb + kf5archive from source (all pinned third-party
          # deps) on every run, which the run-31240298189 timeline shows is
          # the critical path (~11 min of a 27-30 min build). A warm ccache
          # collapses that to near zero. brew install is idempotent and fast
          # (~1s) when the formula is already present.
          if brew list --formula aws-sam-cli >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies aws-sam-cli || true
          fi
          if brew tap | grep -Fx aws/tap >/dev/null; then
            brew untap aws/tap
          fi
          brew install ragel ccache

      - name: Compute bounded ccache generation
        id: ccache-generation
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          today = datetime.datetime.now(datetime.timezone.utc).date()
          print(f"current={today.isoformat()}")
          PY

      - name: Restore own-PR ccache for the macOS build
        id: restore-pr-ccache
        if: ${{ github.event_name == 'pull_request' && github.repository == 'ZEACENT/klogg' && github.event.pull_request.head.repo.full_name == github.repository && toJSON(github.event.pull_request.head.repo.id) == github.repository_id && github.event.pull_request.number > 0 }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # GitHub scopes PR caches to refs/pull/N/merge; this explicit namespace
          # also keeps PR writes out of the trusted push keys and other PR keys.
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.KLOGG_LABEL }}-ccache-content-pr-v1-${{ github.event.pull_request.number }}-${{ steps.ccache-generation.outputs.current }}
          restore-keys: |
            ${{ env.KLOGG_LABEL }}-ccache-content-pr-v1-${{ github.event.pull_request.number }}-
            ${{ env.KLOGG_LABEL }}-ccache-pr-v1-${{ github.event.pull_request.number }}-

      - name: Restore ccache for the macOS build
        id: restore-ccache
        if: ${{ steps.restore-pr-ccache.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # New saves identify the content-check policy. Legacy fallback remains
          # read-only: it may contain useful objects, but does not prove warmth.
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.KLOGG_LABEL }}-ccache-content-v1-${{ steps.ccache-generation.outputs.current }}
          restore-keys: |
            ${{ env.KLOGG_LABEL }}-ccache-content-v1-
            ${{ env.KLOGG_LABEL }}-ccache-v2-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boost-root
          path: ${{ github.workspace }}/prefetch_artifacts

      - name: Require prefetched dependency artifacts
        shell: sh
        run: |
          echo "KLOGG_REQUIRE_PREFETCHED_BOOST=ON" >> $GITHUB_ENV
          echo "KLOGG_REQUIRE_PREFETCHED_CPM=ON" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup
        with:
          qt-version: ${{ env.KLOGG_QT_VERSION }}
          qt-arch: ${{ env.KLOGG_QT_ARCH }}
          qt-modules: ${{ env.KLOGG_QT_MODULES }}
          qt-archives: ${{ env.KLOGG_QT_ARCHIVES }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cpm-cache
          path: ${{ github.workspace }}
      - uses: ./.github/actions/restore-cpm-cache
      - uses: ./.github/actions/prepare-workspace-env
        with:
          arch: ${{ env.KLOGG_CONFIG_ARCH }}
          package-tag: ${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          cmake-options: ${{ env.KLOGG_CONFIG_CMAKE_OPTS }}
          qt-version: ${{ env.KLOGG_QT_VERSION }}

      - name: Disable Sentry on macOS
        shell: sh
        run: |
          # Disable Sentry on macOS due to Crashpad incompatibility with newer Xcode SDKs
          # macOS 15+ requires at least 2018 Macs (Kaby Lake / Apple Silicon),
          # all of which support AVX2 / NEON.  Use GENERIC_CPU=OFF to enable
          # hardware-specific optimizations (AVX2 for Intel, NEON for ARM64).
          PACKAGE_CMAKE_OPTS=""
          if [ "${{ env.KLOGG_PACKAGE_ENABLED }}" == "true" ]; then
            PACKAGE_CMAKE_OPTS="-DKLOGG_ADB_HELPER_REQUIRED=ON -DKLOGG_ADB_HELPER_TARGET=${{ env.KLOGG_ADB_HELPER_TARGET }} -DKLOGG_ADB_HELPER_ARTIFACT_ROOT=${{ github.workspace }}/prefetch_artifacts/adb-helper -DKLOGG_ENABLE_IOS_NATIVE_STACK=ON -DKLOGG_IOS_NATIVE_STACK_ROOT=${{ github.workspace }}/prefetch_artifacts/ios-native"
          fi
          echo "KLOGG_CMAKE_OPTS=-G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DKLOGG_GENERIC_CPU=OFF -DKLOGG_USE_SENTRY=OFF -DCMAKE_INSTALL_PREFIX=/usr -DFETCHCONTENT_FULLY_DISCONNECTED=ON $PACKAGE_CMAKE_OPTS ${{ env.KLOGG_CONFIG_CMAKE_OPTS }}" >> $GITHUB_ENV

      - name: Select Intel macOS TSan optimization profile
        if: ${{ runner.os == 'macOS' && env.KLOGG_SANITIZER == 'thread' }}
        shell: sh
        run: |
          # Nested dependency project() calls resolve relative includes anew.
          # Match the measured absolute hook before deriving cache identity.
          test -f "$KLOGG_WORKSPACE/cmake/CiMacosTsanProfile.cmake"
          printf '%s\n' "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DCMAKE_PROJECT_INCLUDE=$KLOGG_WORKSPACE/cmake/CiMacosTsanProfile.cmake" >> "$GITHUB_ENV"

      - name: Configure effective ccache budget
        shell: bash
        run: python3 scripts/ci_ccache.py prepare --label "$KLOGG_LABEL" --github-env "$GITHUB_ENV"

      - name: Describe shared application compiler objects
        id: shared-cache-descriptor
        shell: bash
        run: |
          set -euo pipefail
          args=(--required-step "Finalize verified macOS build" --required-step "Verify macOS tests" --required-step "Bound macOS ccache before save")
          if [ "$KLOGG_PACKAGE_ENABLED" = "true" ]; then
            args+=(--required-step "Qualify macOS package")
          fi
          python3 -I scripts/ci_compiler_object_descriptor.py \
            --component application --label "$KLOGG_LABEL" \
            --producer-job "macOS $KLOGG_LABEL [$KLOGG_CONFIG_PACKAGE_TAG]" \
            --export-step "Export shared application compiler objects" \
            --output "$RUNNER_TEMP/shared-compiler-descriptor.json" "${args[@]}"

      - name: Restore compatible cross-run compiler objects
        id: restore-shared-compiler-cache
        if: ${{ steps.shared-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/restore-compiler-object-artifact
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache

      - name: Enable ccache compiler launcher
        shell: sh
        run: |
          # Normalize workspace-relative paths; compiler content (not runner
          # mtimes) is checked by the shared effective-cache policy.
          echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
      
      - name: Set sanitizer env
        if: ${{ env.KLOGG_SANITIZER }}
        shell: sh
        run: |
          # Apple ASan does not support LeakSanitizer; detect_leaks=1 aborts
          # before main(). Linux remains the required LSan platform.
          echo "ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:halt_on_error=1" >> $GITHUB_ENV
          echo "UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1" >> $GITHUB_ENV
          echo "TSAN_OPTIONS=halt_on_error=1" >> $GITHUB_ENV

      - name: Compile macOS objects while native producers run
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        uses: ./.github/actions/agent-build
        with:
          phase: prepare
        env:
          KLOGG_CI_CACHE_ARTIFACT_ID: ${{ steps.restore-shared-compiler-cache.outputs.artifact-id }}
          KLOGG_CI_CACHE_RESTORE_KEY: ${{ steps.restore-pr-ccache.outputs.cache-matched-key || steps.restore-ccache.outputs.cache-matched-key }}

      - name: Require successful same-run native producers
        id: native-ready
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_native_rendezvous.py
          --architecture "$KLOGG_IOS_ARCHITECTURE"
          --receipt "$RUNNER_TEMP/native-ready.json"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          artifact-ids: ${{ steps.native-ready.outputs.adb-artifact-id }}
          merge-multiple: true
          path: ${{ github.workspace }}/prefetch_artifacts/adb-helper-archive

      - name: Extract mode-preserving ADB helper artifact
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_root="${{ github.workspace }}/prefetch_artifacts/adb-helper-archive"
          artifact_root="${{ github.workspace }}/prefetch_artifacts/adb-helper"
          archive="$archive_root/adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}.tar.gz"
          rm -rf "$artifact_root"
          python3 scripts/extract_verified_tar.py \
            --archive "$archive" \
            --destination "$artifact_root"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          artifact-ids: ${{ steps.native-ready.outputs.support-artifact-id }}
          merge-multiple: true
          path: ${{ github.workspace }}/prefetch_artifacts/adb-helper/release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          artifact-ids: ${{ steps.native-ready.outputs.ios-artifact-id }}
          merge-multiple: true
          path: ${{ github.workspace }}/prefetch_artifacts/ios-native-archive

      - name: Extract symlink-preserving iOS native stack
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_root="${{ github.workspace }}/prefetch_artifacts/ios-native-archive"
          stack_root="${{ github.workspace }}/prefetch_artifacts/ios-native"
          archive="$archive_root/${{ env.KLOGG_IOS_NATIVE_ARTIFACT }}.tar.gz"
          test -f "$archive"
          rm -rf "$stack_root"
          python3 scripts/extract_verified_tar.py \
            --archive "$archive" \
            --destination "$stack_root"

      - name: Verify target-bound iOS native checksum envelope and Mach-O closure
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stack_root="${{ github.workspace }}/prefetch_artifacts/ios-native"
          python3 - "$stack_root" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          sidecar = root / "SHA256SUMS"
          if not sidecar.is_file():
              raise SystemExit("missing iOS native SHA256SUMS")
          for line in sidecar.read_text(encoding="utf-8").splitlines():
              expected, relative = line.split("  ", 1)
              path = root / relative
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"missing or invalid iOS native artifact file: {relative}")
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"iOS native artifact sha256 mismatch: {relative}")
          PY
          ios_arch="${{ env.KLOGG_IOS_ARCHITECTURE }}"
          python3 scripts/verify_ios_native_stack.py \
            --lock 3rdparty/libimobiledevice/libimobiledevice.lock.json \
            --stack-root "$stack_root" \
            --architecture "$ios_arch" \
            --receipt "$stack_root/ios-native-build-receipt.json"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            gh attestation verify "$stack_root/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "KLOGG_IOS_NATIVE_STACK_ROOT=$stack_root" >> "$GITHUB_ENV"

      - name: Verify target-bound ADB helper checksum envelope and provenance
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="${{ github.workspace }}/prefetch_artifacts/adb-helper"
          python3 scripts/verify_adb_helper_envelope.py \
            --lock packaging/adb/adb-helper.lock.json \
            --artifact-root "$artifact_root" \
            --expected-target "${{ env.KLOGG_ADB_HELPER_TARGET }}"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            gh attestation verify "$artifact_root/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Finalize verified macOS build
        uses: ./.github/actions/agent-build
        with:
          phase: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' && 'finalize' || 'full' }}
          native-receipt: ${{ runner.temp }}/native-ready.json
        env:
          KLOGG_CI_CACHE_ARTIFACT_ID: ${{ steps.restore-shared-compiler-cache.outputs.artifact-id }}
          KLOGG_CI_CACHE_RESTORE_KEY: ${{ steps.restore-pr-ccache.outputs.cache-matched-key || steps.restore-ccache.outputs.cache-matched-key }}

      - name: Upload current-run build metrics
        if: ${{ hashFiles(format('{0}/ci-build-metrics-{1}-{2}.json', env.KLOGG_BUILD_ROOT, github.run_id, github.run_attempt)) != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metrics-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: ${{ env.KLOGG_BUILD_ROOT }}/ci-build-metrics-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload macOS phased-build evidence
        if: ${{ always() && env.KLOGG_PACKAGE_ENABLED == 'true' && hashFiles(format('{0}/ci-build-phase-{1}-{2}-*.json', env.KLOGG_BUILD_ROOT, github.run_id, github.run_attempt)) != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-phase-evidence-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ env.KLOGG_BUILD_ROOT }}/ci-build-phase-${{ github.run_id }}-${{ github.run_attempt }}-*.json
            ${{ env.KLOGG_BUILD_ROOT }}/ci-build-phase-${{ github.run_id }}-${{ github.run_attempt }}-*.ninja-log.txt
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Show ccache statistics
        shell: sh
        run: ccache -s 2>&1 || echo "ccache stats unavailable"

      - name: Verify ASan/UBSan-instrumented test binaries
        if: ${{ env.KLOGG_SANITIZER == 'address-undefined' }}
        shell: bash
        run: |
          set -euo pipefail
          for bin in klogg_tests klogg_itests; do
            f="$KLOGG_BUILD_ROOT/output/$bin"
            test -x "$f" || { echo "test binary missing: $bin"; exit 1; }
            # grep without -q: -q exits on the first match and closes the pipe,
            # which SIGPIPEs nm (LLVM nm aborts with "IO failure: Broken pipe");
            # under pipefail that fails the check even when the symbol is
            # present. Reading the whole stream keeps the exit status reliable.
            nm "$f" 2>/dev/null | grep "asan_init" >/dev/null || {
              echo "ERROR: $bin missing ASan instrumentation (no asan_init symbol)"; exit 1; }
            nm "$f" 2>/dev/null | grep "ubsan_handle" >/dev/null || {
              echo "ERROR: $bin missing UBSan instrumentation (no ubsan_handle symbol)"; exit 1; }
          done
          echo "ASan+UBSan instrumentation verified in klogg_tests and klogg_itests"

      - name: Verify macOS tests
        uses: ./.github/actions/agent-run-tests
        id: macos_tests

      - name: Upload macOS test diagnostics
        if: ${{ failure() && steps.macos_tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ env.KLOGG_LABEL }}-test-diagnostics
          path: |
            ${{ env.KLOGG_BUILD_ROOT }}/Testing/Temporary/LastTest.log
            ~/Library/Logs/DiagnosticReports/klogg_vectorscan_tests*.ips
          if-no-files-found: ignore
          retention-days: 7

      - name: Qualify macOS package
        uses: ./.github/actions/agent-package-mac
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          adb-target: ${{ env.KLOGG_ADB_HELPER_TARGET }}
          collect-symbols: "true"
          qualification-mode: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.qualification-mode == 'release' && 'release' || 'validation' }}
          p12-file-base64: ${{ secrets.CODESIGN_BASE64 }}
          p12-password: ${{ secrets.CODESIGN_PASSWORD }}
          codesign-identity: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          notarization-username: ${{ secrets.NOTARIZATION_USERNAME }}
          notarization-team: ${{ secrets.NOTARIZATION_TEAM }}
          notarization-password: ${{ secrets.NOTARIZATION_PASSWORD }}

      - name: Bound macOS ccache before save
        if: ${{ success() && (github.event_name == 'push' || steps.restore-pr-ccache.outcome == 'success') }}
        shell: sh
        run: python3 scripts/ci_ccache.py trim --label "$KLOGG_LABEL"

      - name: Save ccache for the macOS build
        if: ${{ success() && github.event_name == 'push' }}
        uses: ./.github/actions/save-verified-compiler-cache
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache
          # Validate and bound before saving; publication transport runs later.
          key: ${{ env.KLOGG_LABEL }}-ccache-content-v1-${{ steps.ccache-generation.outputs.current }}

      - name: Save own-PR ccache for the macOS build
        # A successful guarded restore (including a miss) authorizes only this
        # PR's namespace. Skipped fork/missing-metadata restores cannot save.
        if: ${{ success() && github.event_name == 'pull_request' && steps.restore-pr-ccache.outcome == 'success' }}
        uses: ./.github/actions/save-verified-compiler-cache
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache
          key: ${{ env.KLOGG_LABEL }}-ccache-content-pr-v1-${{ github.event.pull_request.number }}-${{ steps.ccache-generation.outputs.current }}

      - name: Export shared application compiler objects
        id: export-shared-compiler-cache
        if: ${{ success() && steps.shared-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/export-compiler-object-artifact
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.ccache
          export-needed: ${{ steps.restore-shared-compiler-cache.outputs.export-needed }}

      - name: Upload shared compiler cache evidence
        if: ${{ always() && steps.restore-shared-compiler-cache.outputs.report != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-object-acquisition-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.restore-shared-compiler-cache.outputs.report }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - uses: ./.github/actions/upload-release-artifact
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release')) }}
        with:
          name: packages-${{ env.KLOGG_ARTIFACTS_ID }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/packages/*'
          retention-days: 7
          compression-level: 0

      - uses: ./.github/actions/upload-release-artifact
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release')) }}
        with:
          name: symbols-${{ env.KLOGG_ARTIFACTS_ID }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          path: '${{ env.KLOGG_BUILD_ROOT }}/symbols/*'
          retention-days: 90
          compression-level: 0

  MacArmPackages:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchBoost, ReleaseQualificationPreflight]
    permissions: *artifact_verification_permissions
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}macOS arm64-qt6 [vs-arm64]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_OS: macos-26
      KLOGG_QT_VERSION: 6.9.3
      KLOGG_QT_MODULES: qt5compat qtimageformats
      KLOGG_QT_ARCHIVES: qtbase icu qtsvg qttools qttranslations
      KLOGG_QT_ARCH: clang_64
      KLOGG_CONFIG_ARCH: arm64
      KLOGG_LABEL: arm64-qt6
      KLOGG_CONFIG_PACKAGE_TAG: vs-arm64
      KLOGG_ARTIFACTS_ID: macos-arm-qt6
      KLOGG_ADB_HELPER_TARGET: macos-arm64
      KLOGG_IOS_NATIVE_ARTIFACT: ios-native-arm64
      KLOGG_IOS_ARCHITECTURE: arm64
      KLOGG_CONFIG_CMAKE_OPTS: -DKLOGG_OSX_DEPLOYMENT_TARGET=14.0
      KLOGG_PACKAGE_ENABLED: true
      KLOGG_SANITIZER: ""
    runs-on: macos-26
    timeout-minutes: 60
    steps: *mac_steps

  MacSanitizers:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchBoost, ReleaseQualificationPreflight]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}macOS ${{ matrix.config.label }} [${{ matrix.config.package_tag }}]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_OS: ${{ matrix.config.os }}
      KLOGG_QT_VERSION: ${{ matrix.config.qt_version }}
      KLOGG_QT_MODULES: ${{ matrix.config.qt_modules }}
      KLOGG_QT_ARCHIVES: ${{ matrix.config.qt_archives }}
      KLOGG_QT_ARCH: ${{ matrix.config.qt_arch }}
      KLOGG_CONFIG_ARCH: ${{ matrix.config.arch }}
      KLOGG_LABEL: ${{ matrix.config.label }}
      KLOGG_CONFIG_PACKAGE_TAG: ${{ matrix.config.package_tag }}
      KLOGG_CONFIG_CMAKE_OPTS: ${{ matrix.config.cmake_opts }}
      KLOGG_PACKAGE_ENABLED: false
      KLOGG_SANITIZER: ${{ matrix.config.sanitizer }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # Package-free sanitizer legs start without ADB or iOS native producers.
          # macOS TSan covers first-party code plus mimalloc and TBB;
          # other vendored dependencies are not instrumented.
          # prebuilt Qt 6 is not TSan-instrumented.
          # The Linux source-built Qt TSan leg is authoritative for Qt-internal races.
          # Run on the Intel runner so TSan's
          # threading overhead stays stable.
          - os: macos-26-intel
            qt_version: 6.9.3
            qt_modules: qt5compat qtimageformats
            qt_archives: qtbase icu qtsvg qttools qttranslations
            qt_arch: clang_64
            arch: x64
            label: intel-qt6-asan-ubsan
            package_tag: asan-ubsan
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=15.0 -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF -DENABLE_SANITIZER_ADDRESS=ON -DENABLE_SANITIZER_UNDEFINED_BEHAVIOR=ON -DKLOGG_CI_LIGHT_DEBUG=ON
            sanitizer: address-undefined
          - os: macos-26-intel
            qt_version: 6.9.3
            qt_modules: qt5compat qtimageformats
            qt_archives: qtbase icu qtsvg qttools qttranslations
            qt_arch: clang_64
            arch: x64
            label: intel-qt6-first-party-tsan
            package_tag: tsan
            # KLOGG_CI_LIGHT_DEBUG=ON (-g1 instead of -g): same treatment as the
            # asan-ubsan leg and the Linux tsan leg. Line tables suffice to
            # symbolize TSan reports, and the smaller DWARF shrinks both compile
            # time (vectorscan dominates) and the ccache entry footprint.
            # The measured O1 profile preserves existing debug and sanitizer flags.
            # agent-build verifies generated commands before compiling.
            cmake_opts: -DKLOGG_OSX_DEPLOYMENT_TARGET=15.0 -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF -DENABLE_SANITIZER_THREAD=ON -DKLOGG_CI_LIGHT_DEBUG=ON -DKLOGG_CI_MACOS_TSAN_O1=ON
            sanitizer: thread

    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 60
    steps: *mac_steps

  WindowsPackages:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchBoost, PrefetchWindowsTools, BuildAdbWindowsX64, ReleaseQualificationPreflight]
    permissions: *artifact_verification_permissions
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Windows x64-qt6 [vs-avx2]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_OS: windows
      KLOGG_OS_VERSION: 2022
      KLOGG_QT_VERSION: 6.9.3
      KLOGG_QT_MODULES: qt5compat qtimageformats
      KLOGG_QT_ARCHIVES: qtbase icu qtsvg qttools qttranslations
      KLOGG_QT_ARCH: win64_msvc2022_64
      KLOGG_CONFIG_ARCH: x64
      KLOGG_SSL_ARCH: -x64
      KLOGG_CONFIG_PACKAGE_TAG: vs-avx2
      KLOGG_CONFIG_CMAKE_OPTS: -DKLOGG_GENERIC_CPU=OFF -DKLOGG_USE_VECTORSCAN=ON
      KLOGG_LABEL: x64-qt6
      KLOGG_CACHE_PRODUCER_JOB: Windows x64-qt6 [vs-avx2]
      KLOGG_ARTIFACTS_ID: windows-x64-qt6
      KLOGG_ADB_HELPER_TARGET: windows-x86_64
      KLOGG_PACKAGE_ENABLED: true
      KLOGG_SANITIZER: ""
    runs-on: windows-2022
    timeout-minutes: 60
    steps: &windows_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          name: adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}
          path: ${{ github.workspace }}/prefetch_artifacts/adb-helper-archive

      - name: Extract mode-preserving ADB helper artifact
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_root="${{ github.workspace }}/prefetch_artifacts/adb-helper-archive"
          artifact_root="${{ github.workspace }}/prefetch_artifacts/adb-helper"
          archive="$archive_root/adb-helper-${{ env.KLOGG_ADB_HELPER_TARGET }}.tar.gz"
          rm -rf "$artifact_root"
          python3 scripts/extract_verified_tar.py \
            --archive "$archive" \
            --destination "$artifact_root"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          name: adb-helper-package-support
          path: ${{ github.workspace }}/prefetch_artifacts/adb-helper/release

      - name: Verify target-bound ADB helper checksum envelope and provenance
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_root="${{ github.workspace }}/prefetch_artifacts/adb-helper"
          python3 scripts/verify_adb_helper_envelope.py \
            --lock packaging/adb/adb-helper.lock.json \
            --artifact-root "$artifact_root" \
            --expected-target "${{ env.KLOGG_ADB_HELPER_TARGET }}"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            gh attestation verify "$artifact_root/SHA256SUMS" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ startsWith(env.KLOGG_QT_VERSION, '5') }}
        with:
          name: openssl-archive
          path: ${{ github.workspace }}

      - name: Verify and materialize locked Qt 5 OpenSSL
        if: ${{ startsWith(env.KLOGG_QT_VERSION, '5') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_openssl.py --lock ci/tools/openssl-qt5.json --archive "$GITHUB_WORKSPACE/openssl.zip" --materialize --architecture "${{ env.KLOGG_CONFIG_ARCH }}" --destination "$GITHUB_WORKSPACE/openssl-1.1"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msys2-tools
          path: ${{ github.workspace }}

      - name: Verify and extract locked MSYS2 tools artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/materialize_windows_tools.py \
            --lock ci/tools/msys2-tools.json \
            --extract-artifact --require-prefetched \
            --archive "$GITHUB_WORKSPACE/msys2-tools.zip" \
            --destination "$GITHUB_WORKSPACE/msys2-tools"

      - name: Set openssl paths
        if: ${{ startsWith(env.KLOGG_QT_VERSION, '5') }}
        shell: bash
        run: |
          echo "SSL_DIR=${{ github.workspace }}\openssl-1.1\${{ env.KLOGG_CONFIG_ARCH }}\bin" >> $GITHUB_ENV
          echo "SSL_ARCH=${{ env.KLOGG_SSL_ARCH }}" >> $GITHUB_ENV

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: boost-root
          path: ${{ github.workspace }}/prefetch_artifacts

      - name: Require prefetched dependency artifacts
        shell: bash
        run: |
          echo "KLOGG_REQUIRE_PREFETCHED_BOOST=ON" >> $GITHUB_ENV
          echo "KLOGG_REQUIRE_PREFETCHED_CPM=ON" >> $GITHUB_ENV

      - uses: ./.github/actions/agent-setup
        with:
          qt-version: ${{ env.KLOGG_QT_VERSION }}
          qt-arch: ${{ env.KLOGG_QT_ARCH }}
          qt-modules: ${{ env.KLOGG_QT_MODULES }}
          qt-archives: ${{ env.KLOGG_QT_ARCHIVES }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cpm-cache
          path: ${{ github.workspace }}
      - uses: ./.github/actions/restore-cpm-cache
      - uses: ./.github/actions/prepare-workspace-env
        with:
          arch: ${{ env.KLOGG_CONFIG_ARCH }}
          package-tag: ${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          cmake-options: ${{ env.KLOGG_CONFIG_CMAKE_OPTS }}
          qt-version: ${{ env.KLOGG_QT_VERSION }}

      - name: Require verified source-built ADB helper for Windows packages
        if: ${{ env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: bash
        run: |
          echo "KLOGG_ADB_HELPER_TARGET=${{ env.KLOGG_ADB_HELPER_TARGET }}" >> $GITHUB_ENV
          echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DKLOGG_ADB_HELPER_REQUIRED=ON -DKLOGG_ADB_HELPER_TARGET=${{ env.KLOGG_ADB_HELPER_TARGET }} -DKLOGG_ADB_HELPER_ARTIFACT_ROOT=$KLOGG_WORKSPACE/prefetch_artifacts/adb-helper" >> $GITHUB_ENV

      - name: Lock CPM downloads to prefetched cache
        shell: bash
        run: |
          echo "KLOGG_CMAKE_OPTS=$KLOGG_CMAKE_OPTS -DFETCHCONTENT_FULLY_DISCONNECTED=ON" >> $GITHUB_ENV

      - name: Prepare dev cmd
        uses: ./.github/actions/setup-msvc
        with:
          arch: ${{ env.KLOGG_CONFIG_ARCH }}

      - name: Prepare verified Windows object cache
        id: windows-cache
        shell: pwsh
        run: python3 -I scripts/ci_windows_object_cache.py prepare

      - name: Restore same-namespace Windows objects
        id: restore-windows-cache
        if: ${{ steps.windows-cache.outputs.ready == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.windows-cache.outputs.primary-key }}
          restore-keys: ${{ steps.windows-cache.outputs.primary-prefix }}

      - name: Restore master Windows objects for a cold PR
        id: restore-windows-master-cache
        if: ${{ steps.windows-cache.outputs.ready == 'true' && github.event_name == 'pull_request' && steps.restore-windows-cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5.0.4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.windows-cache.outputs.master-key }}
          restore-keys: ${{ steps.windows-cache.outputs.master-prefix }}

      - name: Describe shared application compiler objects
        id: shared-cache-descriptor
        if: ${{ steps.windows-cache.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--required-step "Build Windows application" --required-step "Verify Windows tests" --required-step "Report and validate Windows object cache")
          if [ "$KLOGG_PACKAGE_ENABLED" = "true" ]; then
            args+=(--required-step "Qualify Windows package")
          fi
          python3 -I scripts/ci_compiler_object_descriptor.py \
            --component application --label "$KLOGG_LABEL" \
            --producer-job "$KLOGG_CACHE_PRODUCER_JOB" \
            --export-step "Export shared application compiler objects" \
            --output "$RUNNER_TEMP/shared-compiler-descriptor.json" --windows-state "$GITHUB_WORKSPACE/windows-object-cache-state.json" "${args[@]}"

      - name: Restore compatible cross-run compiler objects
        id: restore-shared-compiler-cache
        if: ${{ steps.shared-cache-descriptor.outputs.eligible == 'true' }}
        uses: ./.github/actions/restore-compiler-object-artifact
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.sccache

      - name: Activate Windows object cache or use the native compiler
        id: activate-windows-cache
        if: ${{ steps.windows-cache.outputs.ready == 'true' }}
        shell: pwsh
        run: python3 -I scripts/ci_windows_object_cache.py activate

      - name: Add verified MSYS2 tools to PATH
        shell: pwsh
        run: |
          $msysBin = Join-Path $env:GITHUB_WORKSPACE "msys2-tools\msys64\mingw64\bin"
          if ( !(Test-Path (Join-Path $msysBin "ragel.exe")) -or
               !(Test-Path (Join-Path $msysBin "pkg-config.exe")) ) {
            throw "Verified MSYS2 ragel/pkg-config executables are missing"
          }
          $msysBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Ragel
        shell: pwsh
        run: |
          ragel -v

      - name: Verify pkg-config
        shell: pwsh
        run: |
          pkg-config --version

      - name: Set sanitizer env
        if: ${{ env.KLOGG_SANITIZER }}
        shell: bash
        run: |
          # MSVC ASan has no leak detector; keep every supported container check
          # enabled globally. Any dependency-specific workaround must be scoped
          # to the affected test process instead of weakening the whole leg.
          echo "ASAN_OPTIONS=detect_leaks=0:abort_on_error=1:halt_on_error=1" >> $GITHUB_ENV

          if [ "${{ env.KLOGG_SANITIZER }}" = "address" ]; then
            # The vectorscan regression matrix spawns one ASan-instrumented
            # child process per run; per-child ASan runtime + Qt startup
            # (~7s) dominated this leg (610s of a 30-minute job). Sample the
            # matrix for memory-safety coverage — the full 336-run exhaustive
            # cardinality stays enforced on the non-ASan vs-avx2 leg (~16s
            # there) — and oversubscribe the 4-vCPU runner: child runs are
            # process-spawn/I-O-bound, not pure CPU.
            echo "KLOGG_VECTORSCAN_EXHAUSTIVE=0" >> $GITHUB_ENV
            echo "KLOGG_VECTORSCAN_CHILD_CONCURRENCY=8" >> $GITHUB_ENV
          fi

      - name: Build Windows application
        uses: ./.github/actions/agent-build
        env:
          KLOGG_CI_CACHE_ARTIFACT_ID: ${{ steps.restore-shared-compiler-cache.outputs.artifact-id }}
          KLOGG_CI_CACHE_RESTORE_KEY: ${{ steps.restore-windows-cache.outputs.cache-matched-key || steps.restore-windows-master-cache.outputs.cache-matched-key }}

      - name: Verify vectorscan config in CMake cache (x64)
        if: ${{ env.KLOGG_CONFIG_ARCH == 'x64' }}
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:GITHUB_WORKSPACE "build_root\CMakeCache.txt"
          if ( !(Test-Path $cachePath) ) {
            Write-Error "CMake cache not found at $cachePath"
            exit 1
          }

          $vectorscan = Select-String -Path $cachePath -Pattern '^KLOGG_USE_VECTORSCAN:BOOL=ON$'
          if ( !$vectorscan ) {
            Write-Host "Current regex backend values:"
            Select-String -Path $cachePath -Pattern '^KLOGG_USE_VECTORSCAN:BOOL=|^KLOGG_GENERIC_CPU:BOOL=' | ForEach-Object { $_.Line }
            Write-Error "Unexpected vectorscan CMake settings"
            exit 1
          }

      - name: Verify vectorscan disabled in CMake cache (x86)
        if: ${{ env.KLOGG_CONFIG_ARCH == 'x86' }}
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:GITHUB_WORKSPACE "build_root\CMakeCache.txt"
          if ( !(Test-Path $cachePath) ) {
            Write-Error "CMake cache not found at $cachePath"
            exit 1
          }

          $vectorscan = Select-String -Path $cachePath -Pattern '^KLOGG_USE_VECTORSCAN:BOOL=OFF$'
          if ( !$vectorscan ) {
            Write-Host "Current regex backend values:"
            Select-String -Path $cachePath -Pattern '^KLOGG_USE_VECTORSCAN:BOOL=|^KLOGG_GENERIC_CPU:BOOL=' | ForEach-Object { $_.Line }
            Write-Error "Vectorscan must stay disabled on Windows x86"
            exit 1
          }

      - name: Configure crash dumps for Windows test binaries
        shell: pwsh
        run: |
          # Every Windows leg (x86 and x64) gets WER LocalDumps so a hard crash
          # in either test binary leaves an analyzable dump. DumpType=2 (full)
          # with DumpCount=10 bounds the retained set to the 10 most recent
          # dumps; the dump directory is only uploaded on test failure below.
          $dumpDir = Join-Path $env:GITHUB_WORKSPACE "build_root\crash_dumps"
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          "KLOGG_TEST_MINIDUMP_DIR=$dumpDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KLOGG_TEST_TRACE_SEARCH_STARTS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          foreach ($exe in @("klogg_itests.exe", "klogg_tests.exe")) {
            $regPath = "HKCU\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\$exe"
            reg add "$regPath" /v DumpFolder /t REG_EXPAND_SZ /d "$dumpDir" /f
            reg add "$regPath" /v DumpCount /t REG_DWORD /d 10 /f
            reg add "$regPath" /v DumpType /t REG_DWORD /d 2 /f
          }

          # Pre-create the symbol downstream store used by _NT_SYMBOL_PATH (set
          # in the agent-run-tests action) so dbghelp can cache OS/CRT symbols
          # when the test binaries' first-chance crash trace
          # (tests/helpers/crash_trace.cpp) symbolizes crash stacks.
          New-Item -ItemType Directory -Force -Path "C:\symbols" | Out-Null

      - name: Stage MSVC AddressSanitizer runtime next to test binaries
        if: ${{ env.KLOGG_SANITIZER == 'address' }}
        shell: pwsh
        run: |
          # VS 2022 (17.7+) ASan links a single ASan DLL into the
          # executable for every CRT config, so Windows must resolve it at
          # runtime. msvc-dev-cmd already places it on PATH; also copy it
          # next to the built binaries so Windows finds it from the EXE
          # directory regardless of PATH propagation through the MSYS2 sh
          # shell used to run ctest.
          $outDir = Join-Path $env:KLOGG_BUILD_ROOT "output"
          if (-not (Test-Path $outDir)) {
            Write-Warning "Build output directory not found: $outDir; skipping ASan DLL staging."
            exit 0
          }
          $hostArch = $env:VSCMD_ARG_HOST_ARCH; if (-not $hostArch) { $hostArch = 'x64' }
          $tgtArch  = $env:VSCMD_ARG_TGT_ARCH;  if (-not $tgtArch)  { $tgtArch  = 'x64' }
          $asanDir  = Join-Path $env:VCToolsInstallDir "bin\Host$hostArch\$tgtArch"
          $dllNames = @('clang_rt.asan_dynamic-x86_64.dll', 'cl_asan_x64.dll')
          $staged = $false
          foreach ($name in $dllNames) {
            $src = Join-Path $asanDir $name
            if (Test-Path $src) {
              Copy-Item $src -Destination $outDir -Force
              Write-Host "Staged $src -> $outDir"
              $staged = $true
            }
          }
          if (-not $staged) {
            Write-Warning "No MSVC ASan DLL found under $asanDir; relying on PATH (msvc-dev-cmd) to provide it at runtime."
          }

      - name: Verify Windows tests
        uses: ./.github/actions/agent-run-tests
        id: run-tests
        # Keep the job alive only long enough to collect diagnostics; the final
        # outcome gate below still fails the job when this step fails.
        continue-on-error: true

      - name: Collect Windows diagnostics on test failure
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $diagRoot = Join-Path $workspace "build_root\diagnostics"
          New-Item -ItemType Directory -Force -Path $diagRoot | Out-Null

          $ctestTemp = Join-Path $workspace "build_root\Testing\Temporary"
          if ( Test-Path $ctestTemp ) {
            Copy-Item $ctestTemp -Destination (Join-Path $diagRoot "Testing-Temporary") -Recurse -Force
          }

          $dumpDir = Join-Path $workspace "build_root\crash_dumps"
          if ( Test-Path $dumpDir ) {
            Copy-Item $dumpDir -Destination (Join-Path $diagRoot "crash_dumps") -Recurse -Force
          }

          foreach ($name in @("klogg_itests.exe", "klogg_itests.pdb", "klogg_tests.exe", "klogg_tests.pdb")) {
            $binary = Join-Path $workspace "build_root\output\$name"
            if ( Test-Path $binary ) {
              Copy-Item $binary -Destination $diagRoot -Force
            } else {
              "Missing test diagnostic file: $name" | Add-Content -Path (Join-Path $diagRoot "missing-files.txt")
            }
          }

          # Failure-only identity evidence: project executables may be retained,
          # but loaded compiler/DbgHelp/ASan modules are metadata-only. Never run
          # commands or paths reported by diagnostic JSON.
          $identityScript = @'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import sys
          import threading

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          build = workspace / "build_root"
          destination = build / "diagnostics"
          sys.path.insert(0, str(workspace / "scripts"))
          import pe_identity

          MAX_TEXT_BYTES = 64 * 1024
          MAX_COMMAND_BYTES = 128 * 1024
          MAX_FILE_BYTES = 64 * 1024 * 1024
          MAX_MODULE_BYTES = 256 * 1024 * 1024
          MAX_MODULE_RECORDS = 6
          MAX_MODULE_PATH_UNITS = 512
          errors = []

          def problem(label, error):
              message = (label + ": " + str(error))[:1024]
              errors.append(message)
              print("Crash smoke identity metadata unavailable: " + message, file=sys.stderr)

          def bounded_bytes(path, limit):
              with path.open("rb") as stream:
                  data = stream.read(limit + 1)
              if len(data) > limit:
                  raise ValueError("metadata input exceeds byte limit")
              return data

          def file_identity(path, limit):
              if path.is_symlink() or not path.is_file():
                  raise ValueError("not a regular non-symlink file")
              size = path.stat().st_size
              if size > limit:
                  raise ValueError("file exceeds hash/retention limit")
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  remaining = limit
                  while remaining:
                      block = stream.read(min(1024 * 1024, remaining))
                      if not block:
                          break
                      digest.update(block)
                      remaining -= len(block)
                  if stream.read(1):
                      raise ValueError("file grew beyond hash limit")
              return {"path": str(path), "size": size, "sha256": digest.hexdigest()}

          def read_only_command(arguments, directory, limit):
              # Only fixed Git/Ninja metadata tools reach this seam; JSON paths
              # and returned compile/link command strings are never executable.
              with subprocess.Popen(arguments, cwd=directory, stdout=subprocess.PIPE,
                                    stderr=subprocess.STDOUT) as process:
                  result = []
                  def read_output():
                      result.append(process.stdout.read(limit + 1))
                      if len(result[0]) > limit:
                          process.kill()
                  reader = threading.Thread(target=read_output, daemon=True)
                  reader.start()
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
                      raise ValueError("metadata command timeout")
                  finally:
                      reader.join(timeout=5)
                  if reader.is_alive() or not result or len(result[0]) > limit:
                      raise ValueError("metadata command output exceeds limit or is unavailable")
                  if process.returncode:
                      raise ValueError("metadata command failed: " + result[0].decode("utf-8", "replace")[:1024])
                  return result[0].decode("utf-8", "replace")

          env_names = ("GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB",
                       "GITHUB_WORKFLOW_REF", "GITHUB_WORKFLOW_SHA", "RUNNER_OS", "RUNNER_ARCH",
                       "ImageOS", "ImageVersion", "KLOGG_LABEL", "KLOGG_CONFIG_ARCH",
                       "KLOGG_SANITIZER", "ASAN_OPTIONS", "VCToolsVersion", "VCToolsInstallDir",
                       "VSCMD_VER", "VSCMD_ARG_HOST_ARCH", "VSCMD_ARG_TGT_ARCH",
                       "WindowsSDKVersion", "WindowsSdkDir", "UCRTVersion")
          evidence = {"schema_version": 1, "environment": {
              name: os.environ.get(name, "")[:4096] for name in env_names},
              "os_version": {name: getattr(sys.getwindowsversion(), name)
                             for name in ("major", "minor", "build", "platform", "service_pack")}
                            if hasattr(sys, "getwindowsversion") else None,
              "source_revision": None, "sources": [], "project_files": [],
              "build_commands": {"status": "unavailable"}, "compiler": {"status": "unavailable"},
              "modules": [], "errors": errors}
          try:
              revision = read_only_command(["git", "rev-parse", "HEAD"], workspace, 1024).strip()
              if not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise ValueError("invalid checkout revision")
              evidence["source_revision"] = revision
          except Exception as error:
              problem("checkout revision", error)
          for relative in ("tests/helpers/collector.cpp", "tests/helpers/crash_trace.cpp",
                           "tests/helpers/crash_trace_test_helper.cpp",
                           "tests/helpers/crash_collector_protocol.h", "tests/helpers/CMakeLists.txt",
                           "tests/scripts/windows_crash_trace_smoke.py", "scripts/pe_identity.py",
                           ".github/workflows/ci-build.yml"):
              try:
                  evidence["sources"].append(file_identity(workspace / relative, 1024 * 1024))
              except Exception as error:
                  problem("source " + relative, error)
          for name in ("crash_trace_test_helper.exe", "crash_trace_collector.exe",
                       "crash_trace_test_helper.pdb", "crash_trace_collector.pdb"):
              path = build / "output" / name
              record = {"name": name, "status": "absent"}
              if path.exists():
                  try:
                      record.update(file_identity(path, MAX_FILE_BYTES))
                      if path.suffix == ".exe":
                          record["architecture"] = pe_identity.architecture_from_pe(path)
                      shutil.copyfile(path, destination / name)
                      record["status"] = "retained"
                  except Exception as error:
                      record["status"] = "error"
                      problem("project file " + name, error)
              elif path.suffix == ".exe":
                  problem("project file " + name, "executable absent")
              # /DEBUG:NONE may legitimately produce no helper/collector PDB.
              evidence["project_files"].append(record)
          try:
              cache = bounded_bytes(build / "CMakeCache.txt", 2 * 1024 * 1024).decode("utf-8", "replace")
              selected = {}
              for line in cache.splitlines():
                  match = re.fullmatch(r"(CMAKE_(?:CXX_COMPILER|MAKE_PROGRAM|BUILD_TYPE|SYSTEM_VERSION)):[^=]+=(.{0,4096})", line)
                  if match:
                      selected[match[1]] = match[2]
              evidence["cmake"] = selected
              rules_text = bounded_bytes(build / "CMakeFiles" / "rules.ninja", 2 * 1024 * 1024).decode("utf-8", "replace")
              rules = re.findall(r"^rule (CXX_(?:COMPILER|EXECUTABLE_LINKER|STATIC_LIBRARY_LINKER)__(?:crash_trace_test_helper|crash_trace_collector|test_crash_trace)_[A-Za-z0-9_]+)$", rules_text, re.MULTILINE)
              required_rules = ("CXX_COMPILER__crash_trace_test_helper_",
                                "CXX_EXECUTABLE_LINKER__crash_trace_test_helper_",
                                "CXX_COMPILER__crash_trace_collector_",
                                "CXX_EXECUTABLE_LINKER__crash_trace_collector_",
                                "CXX_COMPILER__test_crash_trace_",
                                "CXX_STATIC_LIBRARY_LINKER__test_crash_trace_")
              if not 6 <= len(rules) <= 9 or any(
                      not any(rule.startswith(prefix) for rule in rules) for prefix in required_rules):
                  raise ValueError("helper/collector Ninja rules unavailable or exceed limit")
              # compdb -x expands Ninja response-file contents from generated
              # rules, including link inputs, without executing any build edge.
              commands = json.loads(read_only_command(
                  [selected["CMAKE_MAKE_PROGRAM"], "-t", "compdb", "-x", *rules],
                  build, MAX_COMMAND_BYTES))
              if not isinstance(commands, list) or not 1 <= len(commands) <= 16:
                  raise ValueError("helper/collector command count invalid")
              for entry in commands:
                  if not isinstance(entry, dict) or any(
                          not isinstance(entry.get(key), str) or not entry[key]
                          for key in ("directory", "command", "file", "output")):
                      raise ValueError("helper/collector command entry invalid")
                  output = entry["output"].replace(chr(92), "/")
                  if not re.search(r"(?:^|/)(?:CMakeFiles/(?:crash_trace_test_helper|crash_trace_collector|test_crash_trace)\.dir/|(?:crash_trace_test_helper|crash_trace_collector)\.exe$|(?:lib)?test_crash_trace\.(?:lib|a)$)", output):
                      raise ValueError("command output is outside helper/collector targets")
              evidence["build_commands"] = {"status": "generated-not-executed", "rules": rules,
                                             "response_files_expanded": True, "entries": commands}
          except Exception as error:
              problem("effective compile/link commands", error)
          try:
              compiler = pathlib.Path(evidence["cmake"]["CMAKE_CXX_COMPILER"])
              evidence["compiler"] = {"status": "hashed", **file_identity(compiler, MAX_MODULE_BYTES),
                                      "architecture": pe_identity.architecture_from_pe(compiler)}
          except Exception as error:
              problem("offline compiler identity", error)
          known_modules = {"dbghelp.dll", "dbgcore.dll", "clang_rt.asan_dynamic-x86_64.dll",
                           "clang_rt.asan_dynamic-i386.dll", "cl_asan_x64.dll"}
          stderr_files = sorted((build / "crash_dumps").glob("windows-crash-smoke-*/helper-stderr.txt"))[:2]
          for stderr in stderr_files:
              try:
                  text = bounded_bytes(stderr, MAX_TEXT_BYTES).decode("utf-8", "replace")
                  for line in text.splitlines():
                      prefix = "Test minidump diagnostic "
                      if not line.startswith(prefix):
                          continue
                      if len(line.encode("utf-8")) > 8192:
                          raise ValueError("diagnostic JSON line exceeds limit")
                      module = json.loads(line[len(prefix):])
                      if not isinstance(module, dict) or module.get("kind") != "module":
                          continue
                      if len(evidence["modules"]) >= MAX_MODULE_RECORDS:
                          raise ValueError("module record count exceeds limit")
                      process, name, path, status = (module.get(key) for key in ("process", "name", "path", "status"))
                      if (process not in ("target", "collector") or not isinstance(name, str)
                              or name.lower() not in known_modules or not isinstance(path, str)
                              or len(path.encode("utf-16-le")) // 2 > MAX_MODULE_PATH_UNITS
                              or status not in ("loaded", "absent", "truncated", "error", "unavailable")):
                          raise ValueError("module identity record invalid")
                      record = {"process": process, "name": name, "path": path, "status": status,
                                "reported_by": str(stderr.relative_to(build)),
                                "offline": {"status": "not-eligible"}}
                      evidence["modules"].append(record)
                      # No UNC/device paths, relative paths or alternate streams:
                      # a loaded local image is observed data, never a DLL to load.
                      if status == "loaded":
                          if (not re.match(r"^[A-Za-z]:[\\/]", path) or ":" in path[2:]
                                  or "\x00" in path or pathlib.PureWindowsPath(path).name.lower() != name.lower()):
                              record["offline"] = {"status": "rejected-path"}
                              problem("loaded module path", "not an eligible local image path")
                              continue
                          try:
                              record["offline"] = {"status": "hashed", **file_identity(pathlib.Path(path), MAX_MODULE_BYTES)}
                          except Exception as error:
                              record["offline"] = {"status": "unavailable"}
                              problem("offline module " + name, error)
              except Exception as error:
                  problem("module JSON " + stderr.name, error)
          # Absence is evidence availability, not a successful capture outcome.
          evidence["module_records_status"] = "observed" if evidence["modules"] else "unavailable"
          payload = json.dumps(evidence, indent=2, ensure_ascii=True).encode("utf-8")
          if len(payload) > 256 * 1024:
              raise ValueError("identity JSON exceeds output limit")
          (destination / "crash-smoke-identity.json").write_bytes(payload)
          '@
          $identityPath = Join-Path $diagRoot "crash-smoke-identity.json"
          try {
            $identityScript | python3 -
            if ($LASTEXITCODE -ne 0) {
              throw "Crash smoke identity collection exited $LASTEXITCODE"
            }
            $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
            $versionRecords = @($identity.modules | ForEach-Object { $_.offline }) + @($identity.compiler)
            foreach ($file in $versionRecords) {
              if ($file.status -eq 'hashed') {
                try {
                  $version = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($file.path)
                  $file | Add-Member -NotePropertyName file_version -NotePropertyValue ($version.FileVersion ?? '').Substring(0, [Math]::Min(256, ($version.FileVersion ?? '').Length))
                  $file | Add-Member -NotePropertyName product_version -NotePropertyValue ($version.ProductVersion ?? '').Substring(0, [Math]::Min(256, ($version.ProductVersion ?? '').Length))
                } catch {
                  $identity.errors += "Offline file version unavailable: $($_.Exception.Message.Substring(0, [Math]::Min(1024, $_.Exception.Message.Length)))"
                  Write-Warning $identity.errors[-1]
                }
              }
            }
            $identityJson = $identity | ConvertTo-Json -Depth 20
            if ([System.Text.Encoding]::UTF8.GetByteCount($identityJson) -gt 262144) {
              throw "Version-enriched identity JSON exceeds output limit"
            }
            $identityJson | Set-Content -LiteralPath $identityPath -Encoding utf8
          } catch {
            $detail = $_.Exception.Message
            $message = "Crash smoke identity metadata collection failed: $($detail.Substring(0, [Math]::Min(1024, $detail.Length)))"
            Write-Warning $message
            $message | Add-Content -LiteralPath (Join-Path $diagRoot "metadata-errors.txt")
          }

          $timeRange = (Get-Date).AddHours(-2)
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $timeRange } -MaxEvents 300 |
            Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
            Format-List | Out-File -FilePath (Join-Path $diagRoot "eventlog_application.txt") -Width 300
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = $timeRange } -MaxEvents 300 |
            Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message |
            Format-List | Out-File -FilePath (Join-Path $diagRoot "eventlog_system.txt") -Width 300

      - name: Upload Windows diagnostics artifact
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Use label (defined on every config, including the asan leg which
          # has no artifacts_id) so the diagnostics artifact name is unique per
          # leg; artifacts_id would render as an empty segment on asan.
          name: windows-${{ env.KLOGG_LABEL }}-test-diagnostics
          path: '${{ github.workspace }}\build_root\diagnostics\**\*'
          if-no-files-found: warn

      - name: Collect Windows ASan diagnostics
        if: ${{ always() && env.KLOGG_SANITIZER == 'address' && steps.run-tests.outcome == 'failure' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          $diagRoot = Join-Path $workspace "build_root\asan_diagnostics"
          New-Item -ItemType Directory -Force -Path $diagRoot | Out-Null

          $ctestTemp = Join-Path $workspace "build_root\Testing\Temporary"
          if ( Test-Path $ctestTemp ) {
            Copy-Item $ctestTemp -Destination (Join-Path $diagRoot "Testing-Temporary") -Recurse -Force
          }

          $outputRoot = Join-Path $workspace "build_root\output"
          foreach ($name in @("klogg_vectorscan_tests.exe", "klogg_vectorscan_tests.pdb")) {
            $source = Join-Path $outputRoot $name
            if ( Test-Path $source ) {
              Copy-Item $source -Destination $diagRoot -Force
            }
          }

      - name: Upload Windows ASan diagnostics artifact
        if: ${{ always() && env.KLOGG_SANITIZER == 'address' && steps.run-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-asan-diagnostics
          path: '${{ github.workspace }}\build_root\asan_diagnostics\**\*'
          if-no-files-found: error

      - name: Fail when tests fail
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        shell: bash
        run: exit 1

      - name: Qualify Windows package
        uses: ./.github/actions/agent-package-win
        if: ${{ steps.run-tests.outcome == 'success' && env.KLOGG_PACKAGE_ENABLED == 'true' }}
        with:
          collect-symbols: "true"

      - name: Verify SSL/TLS packaging
        if: ${{ steps.run-tests.outcome == 'success' && env.KLOGG_PACKAGE_ENABLED == 'true' }}
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release"
          $script = Join-Path $env:GITHUB_WORKSPACE "packaging\windows\verify_ssl.ps1"
          & $script -ReleaseDir $releaseDir -QtVersion $env:KLOGG_QT

      - name: Report and validate Windows object cache
        id: windows-cache-report
        if: ${{ always() }}
        shell: pwsh
        env:
          PRIMARY_CACHE_MATCH: ${{ steps.restore-windows-cache.outputs.cache-matched-key }}
          MASTER_CACHE_MATCH: ${{ steps.restore-windows-master-cache.outputs.cache-matched-key }}
          PRIMARY_CACHE_OUTCOME: ${{ steps.restore-windows-cache.outcome }}
          MASTER_CACHE_OUTCOME: ${{ steps.restore-windows-master-cache.outcome }}
        run: python3 -I scripts/ci_windows_object_cache.py report

      - name: Save validated Windows objects before artifact transport
        id: save-windows-cache
        # Helper issues write keys only for master pushes and this PR's namespace.
        # Dispatch is read-only. Never save build_root, PDB bundles or executables.
        if: ${{ success() && steps.run-tests.outcome == 'success' && steps.windows-cache-report.outputs.validated == 'true' && steps.windows-cache.outputs.save-key != '' }}
        uses: ./.github/actions/save-verified-compiler-cache
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.sccache
          key: ${{ steps.windows-cache.outputs.save-key }}

      - name: Export shared application compiler objects
        id: export-shared-compiler-cache
        if: ${{ success() && steps.shared-cache-descriptor.outputs.eligible == 'true' && steps.windows-cache-report.outputs.validated == 'true' && steps.run-tests.outcome == 'success' }}
        uses: ./.github/actions/export-compiler-object-artifact
        with:
          descriptor: ${{ steps.shared-cache-descriptor.outputs.descriptor }}
          path: ${{ github.workspace }}/.sccache
          export-needed: ${{ steps.restore-shared-compiler-cache.outputs.export-needed }}

      - name: Upload shared compiler cache evidence
        if: ${{ always() && steps.restore-shared-compiler-cache.outputs.report != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-object-acquisition-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: ${{ steps.restore-shared-compiler-cache.outputs.report }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload current-run build metrics
        if: ${{ always() && hashFiles(format('{0}/ci-build-metrics-{1}-{2}.json', env.KLOGG_BUILD_ROOT, github.run_id, github.run_attempt)) != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-metrics-${{ env.KLOGG_LABEL }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}-attempt-${{ github.run_attempt }}
          path: ${{ env.KLOGG_BUILD_ROOT }}/ci-build-metrics-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Upload Windows object cache evidence
        if: ${{ always() && steps.windows-cache-report.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-object-cache-${{ env.KLOGG_LABEL }}
          path: ${{ github.workspace }}/windows-object-cache.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.run-tests.outcome == 'success' && env.KLOGG_PACKAGE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release')) }}
        with:
          name: packages-${{ env.KLOGG_ARTIFACTS_ID }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          path: '${{ env.KLOGG_BUILD_ROOT }}\packages\*'
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.run-tests.outcome == 'success' && env.KLOGG_PACKAGE_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.qualification-mode == 'release')) }}
        with:
          name: symbols-${{ env.KLOGG_ARTIFACTS_ID }}-${{ env.KLOGG_CONFIG_PACKAGE_TAG }}
          path: '${{ env.KLOGG_BUILD_ROOT }}\symbols\*'
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  WindowsX86:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchBoost, PrefetchOpenSsl, PrefetchWindowsTools, ReleaseQualificationPreflight]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Windows x86-qt5 [QTRegex]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_OS: windows
      KLOGG_OS_VERSION: 2022
      KLOGG_QT_VERSION: 5.15.2
      KLOGG_QT_MODULES: ""
      KLOGG_QT_ARCHIVES: qtbase qtimageformats qttools qttranslations icu qtsvg
      KLOGG_QT_ARCH: win32_msvc2019
      KLOGG_CONFIG_ARCH: x86
      KLOGG_SSL_ARCH: ""
      KLOGG_CONFIG_PACKAGE_TAG: QTRegex
      KLOGG_CONFIG_CMAKE_OPTS: -DKLOGG_USE_SENTRY=OFF -DKLOGG_GENERIC_CPU=ON -DKLOGG_USE_VECTORSCAN=OFF
      KLOGG_LABEL: x86-qt5
      KLOGG_CACHE_PRODUCER_JOB: Windows x86-qt5 [QTRegex]
      KLOGG_PACKAGE_ENABLED: false
      KLOGG_SANITIZER: ""
    runs-on: windows-2022
    timeout-minutes: 60
    steps: *windows_steps

  WindowsAsan:
    needs: [SaveVersion, PrefetchCpmCache, PrefetchBoost, PrefetchWindowsTools, ReleaseQualificationPreflight]
    if: ${{ (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) && !contains(github.event.head_commit.message, '[skip ci]') }}
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}Windows x64-qt6 ASan [asan]"
    env:
      KLOGG_VERSION: ${{ needs.SaveVersion.outputs.klogg_version }}
      KLOGG_CONFIG_OS: windows
      KLOGG_OS_VERSION: 2022
      KLOGG_QT_VERSION: 6.9.3
      KLOGG_QT_MODULES: qt5compat qtimageformats
      KLOGG_QT_ARCHIVES: qtbase icu qtsvg qttools qttranslations
      KLOGG_QT_ARCH: win64_msvc2022_64
      KLOGG_CONFIG_ARCH: x64
      KLOGG_SSL_ARCH: -x64
      KLOGG_CONFIG_PACKAGE_TAG: asan
      KLOGG_CONFIG_CMAKE_OPTS: -DKLOGG_USE_LTO=OFF -DKLOGG_USE_SENTRY=OFF -DENABLE_SANITIZER_ADDRESS=ON
      KLOGG_LABEL: x64-qt6-asan
      KLOGG_CACHE_PRODUCER_JOB: Windows x64-qt6 ASan [asan]
      KLOGG_PACKAGE_ENABLED: false
      KLOGG_SANITIZER: address
    runs-on: windows-2022
    timeout-minutes: 60
    steps: *windows_steps

  ci-gate:
    name: "${{ github.event_name == 'workflow_dispatch' && (inputs.environment-mode != 'off' || inputs.dependency-mode != 'off') && '[producer-mode skipped] ' || '' }}ci-gate"
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.environment-mode == 'off' && inputs.dependency-mode == 'off')) }}
    needs: [BuildAdbLinuxArm64, BuildAdbMacX64, BuildAdbMacArm64, BuildIosNativeX64, BuildIosNativeArm64, LinuxPackages, LinuxSanitizers, LinuxTsan, MacPackages, MacArmPackages, MacSanitizers, WindowsPackages, WindowsX86, WindowsAsan]
    runs-on: ubuntu-22.04
    steps:
      - name: Check CI results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "CI failed: found result '$r'"
              exit 1
            fi
          done
          echo "CI passed: $results"

  DispatchContinuous:
    name: "Dispatch Continuous publisher"
    needs: [ci-gate]
    if: >-
      ${{
        success()
        && needs.ci-gate.result == 'success'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/master'
        && github.event.repository.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Continuous publisher for current master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KLOGG_CI_RUN_ID: ${{ github.run_id }}
          KLOGG_CI_RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          master_sha="$(gh api "/repos/${repo}/branches/master" --jq '.commit.sha')"
          if [ "$master_sha" != "$KLOGG_CI_RUN_SHA" ]; then
            echo "::notice::Skipping stale Continuous dispatch: ${KLOGG_CI_RUN_SHA} != ${master_sha}"
            exit 0
          fi
          gh workflow run ci-continuous.yml \
            --repo "$repo" \
            --ref master \
            -f ci-run-id="$KLOGG_CI_RUN_ID" \
            -f ci-run-sha="$KLOGG_CI_RUN_SHA"
